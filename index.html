const { useState, useEffect, useMemo, useCallback, useRef } = React;

function waitForFirebase() {
  return new Promise((resolve) => {
    if (window.__fbReady) return resolve();
    window.addEventListener("firebase-ready", () => resolve(), { once: true });
    setTimeout(resolve, 4000);
  });
}

async function localGet(key) {
  try {
    await waitForFirebase();
    if (window.__fbGet) {
      const result = await window.__fbGet(key);
      if (result) {
        try { localStorage.setItem("boxcalc_" + key, result.value); } catch (e) {}
      }
      return result;
    }
    throw new Error("Firebase not available");
  } catch (e) {
    console.error("Firestore get failed, using local cache", e);
    try {
      const raw = localStorage.getItem("boxcalc_" + key);
      return raw ? { value: raw } : null;
    } catch (e2) {
      return null;
    }
  }
}

async function localSet(key, value) {
  try { localStorage.setItem("boxcalc_" + key, value); } catch (e) {}
  try {
    await waitForFirebase();
    if (window.__fbSet) {
      await window.__fbSet(key, value);
      return true;
    }
    throw new Error("Firebase not available");
  } catch (e) {
    console.error("Firestore set failed, saved locally only — will not sync to other devices", e);
    return true;
  }
}

function layerTypesForPly(ply) {
  const n = parseInt(ply, 10) || 3;
  const types = [];
  for (let i = 0; i < n; i++) types.push(i % 2 === 0 ? "liner" : "flute");
  return types;
}

function defaultLayerGsms(ply) {
  return layerTypesForPly(ply).map((t) => (t === "liner" ? "150" : "130"));
}

function layerLabel(type, index, types) {
  if (type === "flute") return `Flute ${types.slice(0, index).filter((t) => t === "flute").length + 1}`;
  const linerIndex = types.slice(0, index).filter((t) => t === "liner").length;
  const linerCount = types.filter((t) => t === "liner").length;
  if (linerIndex === 0) return "Top liner";
  if (linerIndex === linerCount - 1) return "Bottom liner";
  return `Middle liner ${linerIndex}`;
}

function defaultLayerBFs(ply) {
  return layerTypesForPly(ply).map(() => "20");
}

// Reads a locally-cached copy of a settings object (if this browser has one
// from a previous visit) so the very first render can show the real saved
// values instead of a brief flash of the factory defaults while the network
// request to fetch the latest data is still in flight. Safe no-op if this
// storage isn't available (e.g. inside the Claude artifact preview) — falls
// back to the given default with no error.
function getCachedJSON(key, fallback) {
  try {
    if (typeof localStorage !== "undefined") {
      const raw = localStorage.getItem("boxcalc_" + key);
      if (raw) return { ...fallback, ...JSON.parse(raw) };
    }
  } catch (e) {
    // ignore — just use the fallback
  }
  return fallback;
}

function generateOrderNumber() {
  const now = new Date();
  const y = now.getFullYear().toString().slice(-2);
  const m = String(now.getMonth() + 1).padStart(2, "0");
  const d = String(now.getDate()).padStart(2, "0");
  const rand = Math.floor(1000 + Math.random() * 9000);
  return `AMB-${y}${m}${d}-${rand}`;
}

function prefersReducedMotion() {
  return typeof window !== "undefined" && window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
}

// Animates a displayed number smoothly toward `value`; snaps instantly if the
// person has requested reduced motion.
function useCountUp(value, duration = 500) {
  const [display, setDisplay] = useState(value);
  const prevRef = useRef(value);
  useEffect(() => {
    if (prefersReducedMotion()) {
      setDisplay(value);
      prevRef.current = value;
      return;
    }
    const start = prevRef.current;
    const end = value;
    if (start === end) return;
    const startTime = performance.now();
    let raf;
    function tick(now) {
      const t = Math.min(1, (now - startTime) / duration);
      const eased = 1 - Math.pow(1 - t, 3);
      setDisplay(start + (end - start) * eased);
      if (t < 1) {
        raf = requestAnimationFrame(tick);
      } else {
        prevRef.current = end;
      }
    }
    raf = requestAnimationFrame(tick);
    return () => raf && cancelAnimationFrame(raf);
  }, [value, duration]);
  return display;
}

// Returns a ref to attach to a section and whether it has scrolled into view,
// for a gentle fade/slide-in reveal. Reveals immediately if motion is reduced.
function useReveal() {
  const ref = useRef(null);
  const [visible, setVisible] = useState(prefersReducedMotion());
  useEffect(() => {
    if (prefersReducedMotion()) return;
    const el = ref.current;
    if (!el || typeof IntersectionObserver === "undefined") {
      setVisible(true);
      return;
    }
    const obs = new IntersectionObserver(
      ([entry]) => {
        if (entry.isIntersecting) {
          setVisible(true);
          obs.disconnect();
        }
      },
      { threshold: 0.12 }
    );
    obs.observe(el);
    return () => obs.disconnect();
  }, []);
  return [ref, visible];
}

// Generates a sensible spread of dropdown options centered on the current value,
// always including the current value itself so nothing already set is ever lost.
function costOptionsAround(value) {
  const base = parseFloat(value);
  const b = isNaN(base) || base <= 0 ? 1 : base;
  const multipliers = [0.5, 0.75, 0.9, 1, 1.1, 1.25, 1.5, 2];
  const raw = multipliers.map((m) => Math.round(b * m * 100) / 100);
  if (!isNaN(base) && base > 0 && !raw.includes(Math.round(base * 100) / 100)) {
    raw.push(Math.round(base * 100) / 100);
  }
  const unique = Array.from(new Set(raw)).sort((a, b2) => a - b2);
  return unique.map((n) => n.toString());
}

// Finds the ₹/box additional charge for the matching quantity slab.
// Min and Max are both inclusive; a blank Max means "and above". Returns 0
// if no slab matches (e.g. quantity is blank/zero, or slabs are empty).
function findQtySlabExtra(qtySlabs, qty) {
  if (!qtySlabs || !qty || qty <= 0) return 0;
  for (const slab of qtySlabs) {
    const min = parseFloat(slab.min);
    const maxRaw = slab.max;
    const max = maxRaw === "" || maxRaw === undefined || maxRaw === null ? Infinity : parseFloat(maxRaw);
    if (isNaN(min)) continue;
    if (qty >= min && qty <= (isNaN(max) ? Infinity : max)) {
      const extra = parseFloat(slab.extra);
      return isNaN(extra) ? 0 : extra;
    }
  }
  return 0;
}

function computeReelSize(n, H, W, flap, reelTrim) {
  return n * (H + W + flap) + reelTrim;
}
function computeCuttingSize(L, W, joint, cuttingTrim) {
  return 2 * (L + W) + joint + cuttingTrim;
}

  const L = num(form.L),
    W = num(form.W),
    H = num(form.H),
    nUp = Math.max(1, Math.round(num(form.nUp) || 1)),
    joint = num(form.joint),
    reelTrim = num(form.reelTrim),
    cuttingTrim = num(form.cuttingTrim),
    flap = num(form.flap);

  const reelSize = useMemo(() => computeReelSize(nUp, H, W, flap, reelTrim), [nUp, H, W, flap, reelTrim]);
  const cuttingSize = useMemo(() => computeCuttingSize(L, W, joint, cuttingTrim), [L, W, joint, cuttingTrim]);

  const qtyNum = num(form.qty);
  const boardsRequired = qtyNum > 0 ? Math.ceil(qtyNum / nUp) : null;

  const layerTypes = useMemo(() => layerTypesForPly(form.ply), [form.ply]);

  const totalGsm = useMemo(() => {
    return layerTypes.reduce((sum, type, i) => {
      const g = num(form.layerGsms[i]);
      return sum + (type === "flute" ? 1.5 * g : g);
    }, 0);
  }, [layerTypes, form.layerGsms]);

  const reelSize1Up = useMemo(() => computeReelSize(1, H, W, flap, reelTrim), [H, W, flap, reelTrim]);

  const boardAreaIn2 = useMemo(() => {
    return (reelSize1Up * CM_TO_IN) * (cuttingSize * CM_TO_IN);
  }, [reelSize1Up, cuttingSize]);

  const weightPerBox = useMemo(() => {
    const base = (boardAreaIn2 * totalGsm) / WEIGHT_CONSTANT;
    return base + num(form.weightAddition);
  }, [boardAreaIn2, totalGsm, form.weightAddition]);

  const kraftPaperCost = useMemo(() => {
    return layerTypes.reduce((sum, type, i) => {
      const g = num(form.layerGsms[i]);
      const eff = type === "flute" ? 1.5 * g : g;
      const layerWeightG = (boardAreaIn2 * eff) / WEIGHT_CONSTANT;
      const bf = form.layerBFs[i];
      const rate = num(defaults.bfPrices[bf]);
      return sum + (layerWeightG / 1000) * rate;
    }, 0);
  }, [layerTypes, form.layerGsms, form.layerBFs, boardAreaIn2, defaults.bfPrices]);

  const otherCostPerKg = useMemo(() => {
    return COST_FIELD_LABELS.reduce((sum, [key]) => sum + num(form.costComponents[key]), 0);
  }, [form.costComponents]);

  const otherCost = (otherCostPerKg / 1000) * weightPerBox;
  const costPerBox = kraftPaperCost + otherCost;
  const totalCostPerKg = otherCostPerKg; // process costs only, paper priced separately by BF
  const totalOrderCost = qtyNum > 0 ? costPerBox * qtyNum : null;


  const comparisonRows = useMemo(() => {
    const rows = [];
    for (let n = 1; n <= 5; n++) {
      const rs = computeReelSize(n, H, W, flap, reelTrim);
      const boardsNeeded = qtyNum > 0 ? Math.ceil(qtyNum / n) : null;
      rows.push({ n, reelSize: rs, cuttingSize, board: `${fmt(rs)} × ${fmt(cuttingSize)}`, boardsNeeded });
    }
    return rows;
  }, [H, W, flap, reelTrim, cuttingSize, qtyNum]);

  function validate() {
    if (!form.customerName.trim()) return "Customer name is required";
    if (!form.itemName.trim()) return "Item name is required";
    if (!form.qty || num(form.qty) <= 0) return "Quantity must be greater than 0";
    if (L <= 0 || W <= 0 || H <= 0) return "Box dimensions must be greater than 0";
    return null;
  }

  async function saveOrder() {
    const err = validate();
    if (err) {
      showToast("error", err);
      return;
    }
    const record = {
      id: editingId || `ord_${Date.now()}`,
      orderNumber: (form.orderNumber || "").trim(),
      customerName: form.customerName.trim(),
      phone: (form.phone || "").trim(),
      email: (form.email || "").trim(),
      itemName: form.itemName.trim(),
      qty: num(form.qty),
      L, W, H,
      ply: form.ply,
      nUp,
      joint, reelTrim, cuttingTrim, flap,
      reelSizeCm: reelSize,
      cuttingSizeCm: cuttingSize,
      boardsRequired: Math.ceil(num(form.qty) / nUp),
      layerGsms: form.layerGsms,
      layerBFs: form.layerBFs,
      weightAddition: num(form.weightAddition),
      totalGsm,
      weightPerBoxG: weightPerBox,
      costComponents: form.costComponents,
      kraftPaperCost,
      totalCostPerKg,
      costPerBox,
      totalOrderCost,
      date: editingId
        ? orders.find((o) => o.id === editingId)?.date || new Date().toISOString()
        : new Date().toISOString(),
    };
    let next;
    if (editingId) {
      next = orders.map((o) => (o.id === editingId ? record : o));
    } else {
      next = [record, ...orders];
    }
    await persistOrders(next);
    showToast("success", editingId ? "Order updated" : "Order saved");
    setEditingId(null);
    setForm(buildEmptyForm(defaults, form.ply));
    setFlapOverridden(false);
    setLayersOverridden(false);

    const bh = reelSize * scale;
    const bandH = (H + W + flap) * scale;
    const trimHalfH = (reelTrim / 2) * scale;
    const cuttingTrimW = cuttingTrim * scale;
    return { scale, bw, bh, bandH, trimHalfH, cuttingTrimW };

                  const { bw, bh, bandH, trimHalfH, cuttingTrimW } = diagram;
                  const bands = [];

                      {bands}

                      <rect x={ox} y={oy + trimHalfH + nUp * bandH} width={bw - cuttingTrimW} height={trimHalfH} fill="url(#hatch)" stroke="#2B4C7E" strokeWidth="0.75" />
                      {/* cutting-trim strip, single side (right edge) */}
                      <rect x={ox + bw - cuttingTrimW} y={oy} width={cuttingTrimW} height={bh} fill="url(#hatch)" stroke="#2B4C7E" strokeWidth="0.75" />

                      {/* reel size dimension line (left) */}

                      <line x1={ox - 16} y1={oy} x2={ox - 8} y2={oy} stroke="#1B2A4A" strokeWidth="1" />
                      <line x1={ox - 16} y1={oy + bh} x2={ox - 8} y2={oy + bh} stroke="#1B2A4A" strokeWidth="1" />

                  <div style={styles.readOnlyVal}>{authSettings.username}</div>
                )}
              </Field>
              <Field label="Password">
                {editingAuth ? (
                  <div style={{ display: "flex", gap: 8 }}>
                    <input className="bc-input" style={styles.inputSm} type={showAuthPassword ? "text" : "password"}
                      value={draftAuthSettings.password} onChange={(e) => updateAuthField("password", e.target.value)} />
                    <button className="bc-btn" style={styles.linkBtn} onClick={() => setShowAuthPassword((v) => !v)}>
                      {showAuthPassword ? "Hide" : "Show"}
                    </button>
                  </div>
                ) : (
                  <div style={styles.readOnlyVal}>••••••••••</div>
                )}
              </Field>
            </div>
          </div>
        )}
      </main>
    </div>
  );
}

// ---- Customer-facing quote form (no login) ----
function CustomerView({ onStaffLoginClick }) {
  const [defaults, setDefaults] = useState(() => getCachedJSON("customerDefaults", FACTORY_DEFAULTS));
  const [form, setForm] = useState({
    ...buildEmptyForm(FACTORY_DEFAULTS, "3"),
    phone: "", email: "", L: "", W: "", H: "", dimUnit: "cm",
    layerGsms: highestLayerGsms("3"),
    layerBFs: highestLayerBFs("3"),
  });
  const [layersOverridden, setLayersOverridden] = useState(false);
  const [advancedOpen, setAdvancedOpen] = useState(false);
  const [submitted, setSubmitted] = useState(false);
  const [submittedOrderNumber, setSubmittedOrderNumber] = useState("");
  const [submittedSizeFlag, setSubmittedSizeFlag] = useState(false);
  const [toast, setToast] = useState(null);
  const [branding, setBranding] = useState(() => getCachedJSON("branding", FACTORY_BRANDING));

  useEffect(() => {
    if (!document.getElementById(FONT_LINK_ID)) {
      const link = document.createElement("link");
      link.id = FONT_LINK_ID;
      link.rel = "stylesheet";
      link.href =
        "https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap";
      document.head.appendChild(link);
    }
  }, []);

  // Load branding settings
  useEffect(() => {
    (async () => {
      try {
        const res = await localGet("branding");
        if (res && res.value) {
          const saved = JSON.parse(res.value);
          setBranding({ ...FACTORY_BRANDING, ...saved });
        }
      } catch (e) {
        // use factory branding
      }
    })();
  }, []);

  useEffect(() => {
    (async () => {
      try {
        const res = await localGet("customerDefaults");
        if (res && res.value) {
          const saved = JSON.parse(res.value);
          const merged = {
            ...FACTORY_DEFAULTS,
            ...saved,
            flapByPly: { ...FACTORY_DEFAULTS.flapByPly, ...(saved.flapByPly || {}) },
            layerGsmsByPly: { ...FACTORY_DEFAULTS.layerGsmsByPly, ...(saved.layerGsmsByPly || {}) },
            layerBFsByPly: { ...FACTORY_DEFAULTS.layerBFsByPly, ...(saved.layerBFsByPly || {}) },
            bfPrices: { ...FACTORY_DEFAULTS.bfPrices, ...(saved.bfPrices || {}) },
            costComponents: { ...FACTORY_DEFAULTS.costComponents, ...(saved.costComponents || {}) },
          };
          setDefaults(merged);
          setForm((f) => ({
            ...buildEmptyForm(merged, f.ply || "3"),
            phone: f.phone, email: f.email, L: f.L, W: f.W, H: f.H, dimUnit: f.dimUnit,
            layerGsms: layersOverridden ? f.layerGsms : highestLayerGsms(f.ply || "3"),
            layerBFs: layersOverridden ? f.layerBFs : highestLayerBFs(f.ply || "3"),
          }));
        }
      } catch (e) {
        // use factory defaults
      }
    })();
  }, []);

  function showToast(type, msg) {
    setToast({ type, msg });
    setTimeout(() => setToast(null), 2400);
  }

  function updateField(key, value) {
    setForm((f) => ({ ...f, [key]: value }));
    if (key === "ply") {
      setForm((f) => {
        const newTypes = layerTypesForPly(value);
        const plyDefaults = highestLayerGsms(value);
        const bfDefaults = highestLayerBFs(value);
        const mergedGsm = layersOverridden
          ? newTypes.map((_, i) => (f.layerGsms[i] !== undefined ? f.layerGsms[i] : plyDefaults[i]))
          : [...plyDefaults];
        const mergedBF = layersOverridden
          ? newTypes.map((_, i) => (f.layerBFs[i] !== undefined ? f.layerBFs[i] : bfDefaults[i]))
          : [...bfDefaults];
        return { ...f, ply: value, layerGsms: mergedGsm, layerBFs: mergedBF };
      });
    }
  }

  function updateLayerGsm(index, value) {
    setLayersOverridden(true);
    setForm((f) => {
      const next = [...f.layerGsms];
      next[index] = value;
      return { ...f, layerGsms: next };
    });
  }

  function updateLayerBF(index, value) {
    setLayersOverridden(true);
    setForm((f) => {
      const next = [...f.layerBFs];
      next[index] = value;
      return { ...f, layerBFs: next };
    });
  }

  const unitFactor = UNIT_TO_CM[form.dimUnit] ?? 1;
  const L = num(form.L) * unitFactor, W = num(form.W) * unitFactor, H = num(form.H) * unitFactor, qtyNum = num(form.qty);
  const layerTypes = useMemo(() => layerTypesForPly(form.ply), [form.ply]);
  const totalGsm = useMemo(() => {
    return layerTypes.reduce((sum, type, i) => {
      const g = num(form.layerGsms[i]);
      return sum + (type === "flute" ? 1.5 * g : g);
    }, 0);
  }, [layerTypes, form.layerGsms]);

  const flap = num(defaults.flapByPly[form.ply] ?? "0.5");
  const reelSize1Up = computeReelSize(1, H, W, flap, num(defaults.reelTrim));
  const cuttingSize = computeCuttingSize(L, W, num(defaults.joint), num(defaults.cuttingTrim));
  const boardAreaIn2 = (reelSize1Up * CM_TO_IN) * (cuttingSize * CM_TO_IN);
  const weightPerBox = (boardAreaIn2 * totalGsm) / WEIGHT_CONSTANT + num(defaults.weightAddition);

  const kraftPaperCost = layerTypes.reduce((sum, type, i) => {
    const g = num(form.layerGsms[i]);
    const eff = type === "flute" ? 1.5 * g : g;
    const layerWeightG = (boardAreaIn2 * eff) / WEIGHT_CONSTANT;
    const bf = form.layerBFs[i];
    const rate = num(defaults.bfPrices[bf]);
    return sum + (layerWeightG / 1000) * rate;
  }, 0);

  const otherCostPerKg = COST_FIELD_LABELS.reduce((sum, [key]) => sum + num(defaults.costComponents[key]), 0);
  const otherCost = (otherCostPerKg / 1000) * weightPerBox;
  const qtySlabExtra = findQtySlabExtra(defaults.qtySlabs, qtyNum);
  const costPerBox = kraftPaperCost + otherCost + qtySlabExtra;
  const totalCost = qtyNum > 0 ? costPerBox * qtyNum : null;
  const hasValidDims = L > 0 && W > 0 && H > 0;
  const displayCostPerBox = hasValidDims ? costPerBox : 0;
  const displayTotalCost = hasValidDims && qtyNum > 0 ? costPerBox * qtyNum : 0;
  const displayWeightPerBox = hasValidDims ? weightPerBox : 0;
  const displayTotalWeight = hasValidDims && qtyNum > 0 ? (weightPerBox * qtyNum) / 1000 : 0;

  const maxReelSize = num(defaults.maxReelSize);
  const maxCuttingSize = num(defaults.maxCuttingSize);
  const exceedsReelSize = hasValidDims && maxReelSize > 0 && reelSize1Up > maxReelSize;
  const exceedsCuttingSize = hasValidDims && maxCuttingSize > 0 && cuttingSize > maxCuttingSize;
  const sizeExceedsLimit = exceedsReelSize || exceedsCuttingSize;

  function validate() {
    if (!form.customerName.trim()) return "Please enter your name";
    if (!form.phone.trim()) return "Please enter your phone number";
    if (form.email.trim() && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.email.trim())) return "Please enter a valid email ID";
    if (!form.itemName.trim()) return "Please enter the item name";
    if (!form.qty || qtyNum <= 0) return "Please enter a quantity greater than 0";
    if (L <= 0 || W <= 0 || H <= 0) return "Please enter valid box dimensions";
    return null;
  }

  async function submitQuote() {
    const err = validate();
    if (err) {
      showToast("error", err);
      return;
    }
    const orderNumber = generateOrderNumber();
    const record = {
      id: `sub_${Date.now()}`,
      orderNumber,
      customerName: form.customerName.trim(),
      phone: form.phone.trim(),
      email: form.email.trim(),
      itemName: form.itemName.trim(),
      qty: qtyNum,
      L, W, H,
      enteredUnit: form.dimUnit,
      ply: form.ply,
      layerGsms: form.layerGsms,
      layerBFs: form.layerBFs,
      qtySlabExtraPerBox: qtySlabExtra,
      sizeExceedsLimit,
      costPerBox,
      totalCost,
      date: new Date().toISOString(),
    };
    try {
      const res = await localGet("customerSubmissions");
      const existing = res && res.value ? JSON.parse(res.value) : [];
      await localSet("customerSubmissions", JSON.stringify([record, ...existing]));
      setSubmittedOrderNumber(orderNumber);
      setSubmittedSizeFlag(sizeExceedsLimit);
      setSubmitted(true);
    } catch (e) {
      console.error(e);
      showToast("error", "Could not submit — please try again");
    }
  }

  function startOver() {
    setForm({
      ...buildEmptyForm(defaults, "3"),
      phone: "", email: "", L: "", W: "", H: "", dimUnit: "cm",
      layerGsms: highestLayerGsms("3"),
      layerBFs: highestLayerBFs("3"),
    });
    setLayersOverridden(false);
    setAdvancedOpen(false);
    setSubmitted(false);
  }

  const [heroRef, heroVisible] = useReveal();
  const [detailsRef, detailsVisible] = useReveal();
  const [dimsRef, dimsVisible] = useReveal();
  const [previewRef, previewVisible] = useReveal();
  const [summaryRef, summaryVisible] = useReveal();
  const animatedTotal = useCountUp(displayTotalCost);
  const animatedPerBox = useCountUp(displayCostPerBox);

  return (
    <div className="cs-root">
      <style>{PREMIUM_STYLES}</style>

      <div className="cs-header">
        <div className="cs-header-brand">
          {branding.logoDataUrl ? (
            <img src={branding.logoDataUrl} alt="Logo" style={{ width: 28, height: 28, objectFit: "contain" }} />
          ) : (
            <svg width="26" height="26" viewBox="0 0 30 30" fill="none">
              <path d="M2 9 L15 3 L28 9 L28 24 L15 30 L2 24 Z" stroke="#1B2A4A" strokeWidth="1.6" fill="none"/>
              <path d="M2 9 L15 15 L28 9 M15 15 L15 30" stroke="#1B2A4A" strokeWidth="1.6"/>
            </svg>
          )}
          <span style={{ fontWeight: 700, fontSize: 15, color: branding.color, fontFamily: branding.fontFamily }}>
            {branding.heading}
          </span>
        </div>
        <button className="cs-staff-link" onClick={onStaffLoginClick}>{branding.staffLoginLabel || "Employee Portal"}</button>
      </div>

      {toast && (
        <div style={{ ...styles.toast, ...(toast.type === "error" ? styles.toastError : styles.toastSuccess) }}>
          {toast.msg}
        </div>
      )}

      {submitted ? (
        <div className="cs-confirm-wrap">
          <div className="cs-confirm-card">
            <div className="cs-check">✓</div>
            <div style={{ fontSize: 17, fontWeight: 700, textAlign: "center", marginBottom: 2 }}>
              Your order request has been generated successfully.
            </div>
            <div className="cs-summary-eyebrow" style={{ color: "#9AA3B8", textAlign: "center", marginTop: 16 }}>Order Request Number</div>
            <div className="cs-order-num">{submittedOrderNumber}</div>
            {submittedSizeFlag && (
              <div style={{
                background: "#FFF6E6", border: "1px solid #F0D9A0", color: "#8A6416", fontSize: 12.5,
                lineHeight: 1.6, borderRadius: 10, padding: "10px 14px", margin: "0 0 20px",
              }}>
                This box size is larger than our standard board capacity — we'll review feasibility and confirm final pricing before processing.
              </div>
            )}

            <div style={{ height: 1, background: "#EEF0F2", margin: "22px 0" }} />
            <div style={{ fontSize: 13.5, color: "#6B7280", lineHeight: 1.7 }}>
              <strong style={{ color: "#1B2A4A" }}>Please note:</strong>
              <ul style={{ margin: "8px 0 0", paddingLeft: 20 }}>
                <li>The calculated cost is applicable only for a Plain Regular Slotted Container (RSC) box.</li>
                <li>If you require any other box style, die-cutting, special finishing, or printing, additional charges will apply.</li>
                <li>Printing plate charges are separate.</li>

            <div style={{ height: 1, background: "#EEF0F2", margin: "22px 0" }} />
            <div style={{ fontSize: 13.5, color: "#6B7280", lineHeight: 1.7 }}>
              <strong style={{ color: "#1B2A4A" }}>For further assistance, contact us at:</strong>
              <div style={{ marginTop: 6 }}>Phone: +91 7259231281</div>
              <div>Email: info@ambicraftcartons.com</div>

            <div>
              <div ref={detailsRef} className={`cs-section ${detailsVisible ? "cs-visible" : ""}`}>
                <h2>Your details</h2>
                <p className="cs-sub">So we know who's asking and how to reach you.</p>
                <div className="cs-field">
                  <label className="cs-label">Your name</label>
                  <input className="cs-input" value={form.customerName} onChange={(e) => updateField("customerName", e.target.value)} />
                </div>
                <div className="cs-field-row">
                  <div className="cs-field">
                    <label className="cs-label">Phone number</label>
                    <input className="cs-input" type="tel" value={form.phone} onChange={(e) => updateField("phone", e.target.value)} />
                  </div>
                  <div className="cs-field">
                    <label className="cs-label">Email ID</label>
                    <input className="cs-input" type="email" value={form.email} onChange={(e) => updateField("email", e.target.value)} />

                </div>
                <div className="cs-field-row">

                    <label className="cs-label">Item name</label>
                    <input className="cs-input" value={form.itemName} onChange={(e) => updateField("itemName", e.target.value)} />

              <div ref={dimsRef} className={`cs-section ${dimsVisible ? "cs-visible" : ""}`}>

                <div className="cs-field" style={{ maxWidth: 160 }}>
                  <label className="cs-label">Unit</label>
                  <select className="cs-select" value={form.dimUnit} onChange={(e) => updateField("dimUnit", e.target.value)}>

                    <option value="mm">Millimetres (mm)</option>
                    <option value="in">Inches (in)</option>

                </div>

                  <div className="cs-field">
                    <label className="cs-label">Width ({UNIT_LABELS[form.dimUnit]})</label>
                    <input className="cs-input" type="number" value={form.W} onChange={(e) => updateField("W", e.target.value)} />
                  </div>
                  <div className="cs-field">
                    <label className="cs-label">Height ({UNIT_LABELS[form.dimUnit]})</label>
                    <input className="cs-input" type="number" value={form.H} onChange={(e) => updateField("H", e.target.value)} />

                </div>
                <div className="cs-note">Regular Slotted Container (RSC) — our standard box style</div>
                <div className="cs-field">

                          </select>
                        </div>
                        <div>
                          <label className="cs-label">BF grade</label>
                          <select className="cs-select" value={form.layerBFs[i] ?? "20"} onChange={(e) => updateLayerBF(i, e.target.value)}>
                            {BF_OPTIONS.map((bf) => <option key={bf} value={bf}>{bf}BF</option>)}
                          </select>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>

              <div ref={previewRef} className={`cs-section ${previewVisible ? "cs-visible" : ""}`}>
                <h2>Packaging Preview</h2>
                <p className="cs-sub">A quick visual of your box shape and wall construction.</p>
                <div className="cs-diagram-grid">
                  <div className="cs-diagram-card">
                    {hasValidDims ? (
                      <>
                        <RSCDiagram L={L} W={W} H={H} />
                        <div className="cs-diagram-caption">Box Shape — {L} × {W} × {H} cm</div>
                      </>
                    ) : (
                      <>
                        <PlaceholderBoxIcon />
                        <div className="cs-diagram-caption">Box Shape</div>
                        <div className="cs-diagram-hint">Enter box dimensions to preview</div>
                      </>
                    )}
                  </div>
                  <div className="cs-diagram-card">
                    {hasValidDims ? (
                      <>
                        <PlyDiagram layerTypes={layerTypes} layerGsms={form.layerGsms} layerBFs={form.layerBFs} />
                        <div className="cs-diagram-caption">Wall Construction — {form.ply}-ply</div>
                      </>
                    ) : (
                      <>
                        <PlaceholderLayersIcon />
                        <div className="cs-diagram-caption">Wall Construction</div>
                        <div className="cs-diagram-hint">Enter box dimensions to preview</div>
                      </>
                    )}
                  </div>
                </div>
              </div>
            </div>

            <div ref={summaryRef} className={`cs-summary ${summaryVisible ? "cs-visible" : ""}`}>
              <div className="cs-summary-eyebrow">Estimated total</div>
              <div className="cs-summary-big">₹{fmt(animatedTotal)}</div>
              <div className="cs-summary-row"><span>Cost per box</span><span>₹{fmt(animatedPerBox)}</span></div>
              <div className="cs-gst-note">
                This is the basic cost. Applicable GST ({branding.gstRate}%) will be added during final billing.
              </div>
              <div className="cs-summary-row"><span>Weight per box</span><span>{fmt(displayWeightPerBox)} g</span></div>
              <div className="cs-summary-row"><span>Total weight</span><span>{fmt(displayTotalWeight)} kg</span></div>
              {sizeExceedsLimit && (
                <div className="cs-size-warning">
                  This size is larger than our standard board capacity
                  {maxReelSize > 0 && exceedsReelSize ? ` (max reel size ${fmt(maxReelSize)} cm)` : ""}
                  {maxCuttingSize > 0 && exceedsCuttingSize ? ` (max cutting size ${fmt(maxCuttingSize)} cm)` : ""}.
                  You can still submit — this request will be marked as subject to review before we confirm feasibility and final pricing.
                </div>
              )}
              <button className="cs-btn-primary" onClick={submitQuote}>Submit — request this order</button>
            </div>
          </div>
        </>
      )}
    </div>
  );
}

// ---- Top-level app: customer page by default, staff behind a password gate ----
function App() {
  const [staffAuthed, setStaffAuthed] = useState(false);
  const [showLogin, setShowLogin] = useState(false);
  const [authSettings, setAuthSettings] = useState(() => getCachedJSON("authSettings", FACTORY_AUTH));
  const [username, setUsername] = useState("");
  const [password, setPassword] = useState("");
  const [loginError, setLoginError] = useState("");

  // Stop the browser's default "scroll wheel over a focused number input
  // changes its value" behavior — but only when the scroll happens directly
  // on that field, not for unrelated scrolling elsewhere on the page.
  useEffect(() => {
    function handleWheel(e) {
      const el = document.activeElement;
      if (el && el.tagName === "INPUT" && el.type === "number" && e.target === el) {
        el.blur();
      }
    }
    document.addEventListener("wheel", handleWheel, { passive: true });
    return () => document.removeEventListener("wheel", handleWheel);
  }, []);

  useEffect(() => {
    try {
      if (sessionStorage.getItem("staffAuthed") === "1") setStaffAuthed(true);
    } catch (e) {
      // ignore
    }
  }, []);

  // Load employee login credentials (managed from the staff Branding tab)
  useEffect(() => {
    (async () => {
      try {
        const res = await localGet("authSettings");
        if (res && res.value) {
          const saved = JSON.parse(res.value);
          setAuthSettings({ ...FACTORY_AUTH, ...saved });
        }
      } catch (e) {
        // use factory credentials
      }
    })();
  }, []);

  function attemptLogin() {
    if (username.trim() === authSettings.username && password === authSettings.password) {
      try {
        sessionStorage.setItem("staffAuthed", "1");
      } catch (e) {
        // ignore
      }
      setStaffAuthed(true);
      setShowLogin(false);
      setUsername("");
      setPassword("");
      setLoginError("");
    } else {
      setLoginError("Incorrect username or password");
    }
  }

  function logout() {
    try {
      sessionStorage.removeItem("staffAuthed");
    } catch (e) {
      // ignore
    }
    setStaffAuthed(false);
  }

  if (staffAuthed) {
    return <StaffApp onExit={logout} />;
  }

  if (showLogin) {
    return (
      <div className="cs-root">
        <style>{PREMIUM_STYLES}</style>
        <div className="cs-login-wrap">
          <div className="cs-login-card">
            <div className="cs-login-icon">🔒</div>
            <div className="cs-login-title">Employee Portal</div>
            <div className="cs-login-sub">Sign in with your employee credentials</div>
            {loginError && <div className="cs-login-error">{loginError}</div>}
            <div className="cs-field">
              <label className="cs-label">Username</label>
              <input
                className="cs-input"
                value={username}
                onChange={(e) => { setUsername(e.target.value); setLoginError(""); }}
                onKeyDown={(e) => e.key === "Enter" && attemptLogin()}
                autoFocus
              />
            </div>
            <div className="cs-field">
              <label className="cs-label">Password</label>
              <input
                className="cs-input"
                type="password"
                value={password}
                onChange={(e) => { setPassword(e.target.value); setLoginError(""); }}
                onKeyDown={(e) => e.key === "Enter" && attemptLogin()}
              />
            </div>
            <button className="cs-btn-primary" style={{ background: "#1B2A4A", color: "#fff" }} onClick={attemptLogin}>
              Sign in
            </button>
            <button className="cs-login-cancel" onClick={() => { setShowLogin(false); setUsername(""); setPassword(""); setLoginError(""); }}>
              Back to quote page
            </button>
          </div>
        </div>
      </div>
    );
  }

  return <CustomerView onStaffLoginClick={() => setShowLogin(true)} />;
}

function RSCDiagram({ L, W, H }) {
  const maxDim = 100;
  const scale = maxDim / Math.max(L, W, H, 1);
  const w = Math.max(W * scale, 30);
  const h = Math.max(H * scale, 30);
  const dOffset = Math.max(Math.min(L * scale * 0.55, 50), 18); // depth (L) shown as isometric offset
  const ox = 70, oy = 55;

  const frontTL = [ox, oy], frontTR = [ox + w, oy], frontBL = [ox, oy + h], frontBR = [ox + w, oy + h];
  const backTL = [ox - dOffset, oy - dOffset * 0.55], backTR = [ox + w - dOffset, oy - dOffset * 0.55];
  const backBR = [ox + w - dOffset, oy + h - dOffset * 0.55];

  const topFace = [frontTL, frontTR, backTR, backTL].map((p) => p.join(",")).join(" ");
  const sideFace = [frontTR, frontBR, backBR, backTR].map((p) => p.join(",")).join(" ");

  return (
    <svg viewBox="0 0 240 230" width="100%" height="190" fontFamily="'IBM Plex Mono', monospace">
      <polygon points={topFace} fill="#EEF1F6" stroke="#2B4C7E" strokeWidth="1.2" />
      <polygon points={sideFace} fill="#E4E9F1" stroke="#2B4C7E" strokeWidth="1.2" />
      <rect x={ox} y={oy} width={w} height={h} fill="#FAFBFC" stroke="#2B4C7E" strokeWidth="1.4" />
      {/* top flap crease lines meeting at center, indicating RSC flaps */}
      <line x1={frontTL[0]} y1={frontTL[1]} x2={(frontTL[0] + backTR[0]) / 2} y2={(frontTL[1] + backTR[1]) / 2} stroke="#2B4C7E" strokeWidth="0.6" strokeDasharray="2,2" />
      <line x1={frontTR[0]} y1={frontTR[1]} x2={(frontTL[0] + backTR[0]) / 2} y2={(frontTL[1] + backTR[1]) / 2} stroke="#2B4C7E" strokeWidth="0.6" strokeDasharray="2,2" />
      <line x1={backTL[0]} y1={backTL[1]} x2={(frontTL[0] + backTR[0]) / 2} y2={(frontTL[1] + backTR[1]) / 2} stroke="#2B4C7E" strokeWidth="0.6" strokeDasharray="2,2" />
      <line x1={backTR[0]} y1={backTR[1]} x2={(frontTL[0] + backTR[0]) / 2} y2={(frontTL[1] + backTR[1]) / 2} stroke="#2B4C7E" strokeWidth="0.6" strokeDasharray="2,2" />

      {/* W label - front bottom edge */}
      <text x={ox + w / 2} y={oy + h + 20} textAnchor="middle" fontSize="10" fill="#1B2A4A" fontWeight="600">W {fmt(W)}</text>
      {/* H label - front left edge */}
      <text x={ox - 14} y={oy + h / 2} textAnchor="middle" fontSize="10" fill="#1B2A4A" fontWeight="600" transform={`rotate(-90 ${ox - 14} ${oy + h / 2})`}>H {fmt(H)}</text>
      {/* L label - top depth edge */}
      <text x={ox + w - dOffset / 2 + 4} y={oy - dOffset * 0.55 - 8} textAnchor="middle" fontSize="10" fill="#1B2A4A" fontWeight="600">L {fmt(L)}</text>
    </svg>
  );
}

// Simple stacked cross-section showing the ply construction
function PlyDiagram({ layerTypes, layerGsms, layerBFs }) {
  const bandH = 26, bandW = 90, ox = 50, oy = 20;
  return (
    <svg viewBox="0 0 260 200" width="100%" height="170" fontFamily="'IBM Plex Mono', monospace">
      <defs>
        <pattern id="fluteWave" patternUnits="userSpaceOnUse" width="12" height="10">
          <path d="M0,8 Q3,2 6,8 T12,8" stroke="#8A5A2B" strokeWidth="1.2" fill="none" />
        </pattern>
      </defs>
      {layerTypes.map((type, i) => (
        <g key={i}>
          <rect
            x={ox} y={oy + i * bandH} width={bandW} height={bandH - 3}
            fill={type === "flute" ? "#F3E7D6" : "#E4E9F1"}
            stroke="#2B4C7E" strokeWidth="1"
          />
          {type === "flute" && (
            <rect x={ox} y={oy + i * bandH} width={bandW} height={bandH - 3} fill="url(#fluteWave)" />
          )}
          <text x={ox + bandW + 8} y={oy + i * bandH + (bandH - 3) / 2 - 2} fontSize="9" fill="#1B2A4A" fontWeight="600">
            {type === "flute" ? "Flute" : "Liner"}
          </text>
          <text x={ox + bandW + 8} y={oy + i * bandH + (bandH - 3) / 2 + 10} fontSize="8" fill="#8A5A2B">
            {layerGsms[i] ?? "—"} GSM · {layerBFs[i] ?? "—"}BF
          </text>
        </g>
      ))}
    </svg>
  );
}
