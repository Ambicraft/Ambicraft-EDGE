  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getFirestore, doc, getDoc, setDoc,
    collection, addDoc, getDocs, deleteDoc
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import {
    getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBDL7MFUrNdNzyiXNp3i9BOnNSdHDi8ZYU",
    authDomain: "ambicraft-edge.firebaseapp.com",
    projectId: "ambicraft-edge",
    storageBucket: "ambicraft-edge.firebasestorage.app",
    messagingSenderId: "543900828526",
    appId: "1:543900828526:web:889ecb805a5c7717d4777f"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  window.__fbGet = async (key) => {
    const snap = await getDoc(doc(db, "boxcalc", key));
    return snap.exists() ? { value: snap.data().value } : null;
  };
  window.__fbSet = async (key, value) => {
    await setDoc(doc(db, "boxcalc", key), { value });
    return true;
  };

  // Submissions live in their own top-level Firestore collection (not the
  // single-document "boxcalc" store used for everything else), so that
  // Firestore security rules can allow customers to add a new submission
  // without granting them read access to anyone else's.
  window.__fbSubmissionAdd = async (record) => {
    const ref = await addDoc(collection(db, "submissions"), record);
    return ref.id;
  };
  window.__fbSubmissionGetAll = async () => {
    const snap = await getDocs(collection(db, "submissions"));
    return snap.docs.map((d) => ({ id: d.id, ...d.data() }));
  };
  window.__fbSubmissionDelete = async (id) => {
    await deleteDoc(doc(db, "submissions", id));
  };

  // Real Firebase Authentication for staff login — the password is verified
  // by Firebase's own servers, never stored as plain text in the database.
  window.__fbSignIn = async (email, password) => {
    const cred = await signInWithEmailAndPassword(auth, email, password);
    return cred.user;
  };
  window.__fbSignOut = async () => {
    await signOut(auth);
  };
  window.__fbOnAuthStateChanged = (callback) => {
    return onAuthStateChanged(auth, callback);
  };

  window.__fbReady = true;
  window.dispatchEvent(new Event("firebase-ready"));
</script>

const { useState, useEffect, useMemo, useCallback, useRef } = React;

function waitForFirebase() {
  return new Promise((resolve) => {
    if (window.__fbReady) return resolve();
    window.addEventListener("firebase-ready", () => resolve(), { once: true });
    setTimeout(resolve, 4000);
  });
}

async function localGet(key) {
  try {
    await waitForFirebase();
    if (window.__fbGet) {
      const result = await window.__fbGet(key);
      if (result) {
        try { localStorage.setItem("boxcalc_" + key, result.value); } catch (e) {}
      }
      return result;
    }
    throw new Error("Firebase not available");
  } catch (e) {
    console.error("Firestore get failed, using local cache", e);
    try {
      const raw = localStorage.getItem("boxcalc_" + key);
      return raw ? { value: raw } : null;
    } catch (e2) {
      return null;
    }
  }
}

async function localSet(key, value) {
  try { localStorage.setItem("boxcalc_" + key, value); } catch (e) {}
  try {
    await waitForFirebase();
    if (window.__fbSet) {
      await window.__fbSet(key, value);
      return true;
    }
    throw new Error("Firebase not available");
  } catch (e) {
    console.error("Firestore set failed, saved locally only — will not sync to other devices", e);
    return true;
  }
}

function layerTypesForPly(ply) {
  const n = parseInt(ply, 10) || 3;
  const types = [];
  for (let i = 0; i < n; i++) types.push(i % 2 === 0 ? "liner" : "flute");
  return types;
}

function defaultLayerGsms(ply) {
  return layerTypesForPly(ply).map((t) => (t === "liner" ? "150" : "130"));
}

function layerLabel(type, index, types) {
  if (type === "flute") return `Flute ${types.slice(0, index).filter((t) => t === "flute").length + 1}`;
  const linerIndex = types.slice(0, index).filter((t) => t === "liner").length;
  const linerCount = types.filter((t) => t === "liner").length;
  if (linerIndex === 0) return "Top liner";
  if (linerIndex === linerCount - 1) return "Bottom liner";
  return `Middle liner ${linerIndex}`;
}

function defaultLayerBFs(ply) {
  return layerTypesForPly(ply).map(() => "20");
}

const BF_OPTIONS = ["16", "18", "20", "22", "24"];
const GSM_OPTIONS = ["120", "130", "150", "180"]; // fixed options for the customer-facing GSM dropdown
const UNIT_TO_CM = { cm: 1, mm: 0.1, in: 2.54 };
const UNIT_LABELS = { cm: "cm", mm: "mm", in: "inches" };
const HIGHEST_GSM = "180";
const HIGHEST_BF = "24";
function highestLayerGsms(ply) {
  return layerTypesForPly(ply).map(() => HIGHEST_GSM);
}
function highestLayerBFs(ply) {
  return layerTypesForPly(ply).map(() => HIGHEST_BF);
}

// Builds a { "3": [...], "5": [...], "7": [...] } layer-array structure with
// every layer set to the same value — used to seed packaging quality presets.
function uniformByPly(value) {
  return {
    "3": layerTypesForPly("3").map(() => value),
    "5": layerTypesForPly("5").map(() => value),
    "7": layerTypesForPly("7").map(() => value),
  };
}

// Reads a locally-cached copy of a settings object (if this browser has one
// from a previous visit) so the very first render can show the real saved
// values instead of a brief flash of the factory defaults while the network
// request to fetch the latest data is still in flight. Safe no-op if this
// storage isn't available (e.g. inside the Claude artifact preview) — falls
// back to the given default with no error.
// Submissions are stored as individual documents (not one shared list) so that,
// on the deployed site, Firestore security rules can allow customers to add a
// new submission without granting them read access to anyone else's. When a
// real Firestore-backed override is present (deployed site), it's used;
// otherwise this falls back to the generic key-value storage (in-chat preview).
async function submissionStoreAdd(record) {
  const clean = JSON.parse(JSON.stringify(record)); // drop any undefined fields — Firestore rejects them outright
  if (window.__fbSubmissionAdd) return window.__fbSubmissionAdd(clean);
  const id = `sub_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
  await window.storage.set(`submission_${id}`, JSON.stringify(clean), true);
  return id;
}

async function submissionStoreGetAll() {
  if (window.__fbSubmissionGetAll) return window.__fbSubmissionGetAll();
  try {
    const listRes = await window.storage.list("submission_", true);
    if (!listRes || !listRes.keys) return [];
    const items = await Promise.all(listRes.keys.map(async (key) => {
      try {
        const res = await window.storage.get(key, true);
        if (!res) return null;
        return { id: key.replace("submission_", ""), ...JSON.parse(res.value) };
      } catch (e) {
        return null;
      }
    }));
    return items.filter(Boolean);
  } catch (e) {
    return [];
  }
}

async function submissionStoreDelete(id) {
  if (window.__fbSubmissionDelete) return window.__fbSubmissionDelete(id);
  try {
    await window.storage.delete(`submission_${id}`, true);
  } catch (e) {
    // ignore
  }
}

function generateOrderNumber() {
  const now = new Date();
  const y = now.getFullYear().toString().slice(-2);
  const m = String(now.getMonth() + 1).padStart(2, "0");
  const d = String(now.getDate()).padStart(2, "0");
  const rand = Math.floor(1000 + Math.random() * 9000);
  return `AMB-${y}${m}${d}-${rand}`;
}

function prefersReducedMotion() {
  return typeof window !== "undefined" && window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
}

// Animates a displayed number smoothly toward `value`; snaps instantly if the
// person has requested reduced motion.
function useCountUp(value, duration = 500) {
  const [display, setDisplay] = useState(value);
  const prevRef = useRef(value);
  useEffect(() => {
    if (prefersReducedMotion()) {
      setDisplay(value);
      prevRef.current = value;
      return;
    }
    const start = prevRef.current;
    const end = value;
    if (start === end) return;
    const startTime = performance.now();
    let raf;
    function tick(now) {
      const t = Math.min(1, (now - startTime) / duration);
      const eased = 1 - Math.pow(1 - t, 3);
      setDisplay(start + (end - start) * eased);
      if (t < 1) {
        raf = requestAnimationFrame(tick);
      } else {
        prevRef.current = end;
      }
    }
    raf = requestAnimationFrame(tick);
    return () => raf && cancelAnimationFrame(raf);
  }, [value, duration]);
  return display;
}

// Returns a ref to attach to a section and whether it has scrolled into view,
// for a gentle fade/slide-in reveal. Reveals immediately if motion is reduced.
function useReveal() {
  const ref = useRef(null);
  const [visible, setVisible] = useState(prefersReducedMotion());
  useEffect(() => {
    if (prefersReducedMotion()) return;
    const el = ref.current;
    if (!el || typeof IntersectionObserver === "undefined") {
      setVisible(true);
      return;
    }
    const obs = new IntersectionObserver(
      ([entry]) => {
        if (entry.isIntersecting) {
          setVisible(true);
          obs.disconnect();
        }
      },
      { threshold: 0.12 }
    );
    obs.observe(el);
    return () => obs.disconnect();
  }, []);
  return [ref, visible];
}

// Generates a sensible spread of dropdown options centered on the current value,
// always including the current value itself so nothing already set is ever lost.
function costOptionsAround(value) {
  const base = parseFloat(value);
  const b = isNaN(base) || base <= 0 ? 1 : base;
  const multipliers = [0.5, 0.75, 0.9, 1, 1.1, 1.25, 1.5, 2];
  const raw = multipliers.map((m) => Math.round(b * m * 100) / 100);
  if (!isNaN(base) && base > 0 && !raw.includes(Math.round(base * 100) / 100)) {
    raw.push(Math.round(base * 100) / 100);
  }
  const unique = Array.from(new Set(raw)).sort((a, b2) => a - b2);
  return unique.map((n) => n.toString());
}

// Finds the ₹/box additional charge for the matching quantity slab.
// Min and Max are both inclusive; a blank Max means "and above". Returns 0
// if no slab matches (e.g. quantity is blank/zero, or slabs are empty).
function findQtySlabExtra(qtySlabs, qty) {
  if (!qtySlabs || !qty || qty <= 0) return 0;
  for (const slab of qtySlabs) {
    const min = parseFloat(slab.min);
    const maxRaw = slab.max;
    const max = maxRaw === "" || maxRaw === undefined || maxRaw === null ? Infinity : parseFloat(maxRaw);
    if (isNaN(min)) continue;
    if (qty >= min && qty <= (isNaN(max) ? Infinity : max)) {
      const extra = parseFloat(slab.extra);
      return isNaN(extra) ? 0 : extra;
    }
  }
  return 0;
}

function computeReelSize(n, H, W, flap, reelTrim) {
  return n * (H + W + flap) + reelTrim;

function computeCuttingSize(L, W, joint, cuttingTrim) {
  return 2 * (L + W) + joint + cuttingTrim;
}

  function updateField(key, value) {
    setForm((f) => ({ ...f, [key]: value }));
    if (key === "customerId") {

    if (key === "flap") setFlapOverridden(true);
    if (key === "ply" && !flapOverridden) {
      setForm((f) => ({ ...f, ply: value, flap: String(defaults.flapByPly[value] ?? "0.5") }));
    }
    if (key === "ply") {
      setForm((f) => {
        const newTypes = layerTypesForPly(value);
        const plyDefaults = defaults.layerGsmsByPly[value] || defaultLayerGsms(value);
        const bfDefaults = defaults.layerBFsByPly[value] || defaultLayerBFs(value);
        // If the user hasn't manually edited any layer values this session, always take the
        // current saved defaults for the new ply — don't reuse stale values left over from
        // whatever ply was selected before.
        const mergedGsm = layersOverridden
          ? newTypes.map((_, i) => (f.layerGsms[i] !== undefined ? f.layerGsms[i] : plyDefaults[i]))
          : [...plyDefaults];
        const mergedBF = layersOverridden
          ? newTypes.map((_, i) => (f.layerBFs[i] !== undefined ? f.layerBFs[i] : bfDefaults[i]))
          : [...bfDefaults];
        return { ...f, layerGsms: mergedGsm, layerBFs: mergedBF };
      });

  const L = num(form.L),
    W = num(form.W),
    H = num(form.H),
    nUp = Math.max(1, Math.round(num(form.nUp) || 1)),
    joint = num(form.joint),
    reelTrim = num(form.reelTrim),
    cuttingTrim = num(form.cuttingTrim),
    flap = num(form.flap);

  const reelSize = useMemo(() => computeReelSize(nUp, H, W, flap, reelTrim), [nUp, H, W, flap, reelTrim]);
  const cuttingSize = useMemo(() => computeCuttingSize(L, W, joint, cuttingTrim), [L, W, joint, cuttingTrim]);

  const qtyNum = num(form.qty);
  const boardsRequired = qtyNum > 0 ? Math.ceil(qtyNum / nUp) : null;

  const layerTypes = useMemo(() => layerTypesForPly(form.ply), [form.ply]);

  const totalGsm = useMemo(() => {
    return layerTypes.reduce((sum, type, i) => {
      const g = num(form.layerGsms[i]);
      return sum + (type === "flute" ? 1.5 * g : g);
    }, 0);
  }, [layerTypes, form.layerGsms]);

  const reelSize1Up = useMemo(() => computeReelSize(1, H, W, flap, reelTrim), [H, W, flap, reelTrim]);

  const boardAreaIn2 = useMemo(() => {
    return (reelSize1Up * CM_TO_IN) * (cuttingSize * CM_TO_IN);
  }, [reelSize1Up, cuttingSize]);

  const weightPerBox = useMemo(() => {
    const base = (boardAreaIn2 * totalGsm) / WEIGHT_CONSTANT;
    return base + num(form.weightAddition);
  }, [boardAreaIn2, totalGsm, form.weightAddition]);

  const kraftPaperCost = useMemo(() => {
    return layerTypes.reduce((sum, type, i) => {
      const g = num(form.layerGsms[i]);
      const eff = type === "flute" ? 1.5 * g : g;
      const layerWeightG = (boardAreaIn2 * eff) / WEIGHT_CONSTANT;
      const bf = form.layerBFs[i];
      const rate = num(defaults.bfPrices[bf]);
      return sum + (layerWeightG / 1000) * rate;
    }, 0);
  }, [layerTypes, form.layerGsms, form.layerBFs, boardAreaIn2, defaults.bfPrices]);

  const otherCostPerKg = useMemo(() => {
    return COST_FIELD_LABELS.reduce((sum, [key]) => sum + num(form.costComponents[key]), 0);
  }, [form.costComponents]);

  const otherCost = (otherCostPerKg / 1000) * weightPerBox;
  const costPerBox = kraftPaperCost + otherCost;
  const totalCostPerKg = otherCostPerKg; // process costs only, paper priced separately by BF
  const totalOrderCost = qtyNum > 0 ? costPerBox * qtyNum : null;


  const comparisonRows = useMemo(() => {
    const rows = [];
    for (let n = 1; n <= 5; n++) {
      const rs = computeReelSize(n, H, W, flap, reelTrim);
      const boardsNeeded = qtyNum > 0 ? Math.ceil(qtyNum / n) : null;
      rows.push({ n, reelSize: rs, cuttingSize, board: `${fmt(rs)} × ${fmt(cuttingSize)}`, boardsNeeded });
    }
    return rows;
  }, [H, W, flap, reelTrim, cuttingSize, qtyNum]);

  function validate() {
    if (!form.customerName.trim()) return "Customer name is required";
    if (!form.itemName.trim()) return "Item name is required";
    if (!form.qty || num(form.qty) <= 0) return "Quantity must be greater than 0";
    if (L <= 0 || W <= 0 || H <= 0) return "Box dimensions must be greater than 0";
    return null;
  }

  async function saveOrder() {
    const err = validate();
    if (err) {
      showToast("error", err);
      return;
    }
    const record = {
      id: editingId || `ord_${Date.now()}`,
      orderNumber: (form.orderNumber || "").trim(),
      customerId: (form.customerId || "").trim(),
      customerName: form.customerName.trim(),
      phone: (form.phone || "").trim(),
      email: (form.email || "").trim(),
      itemName: form.itemName.trim(),
      qty: num(form.qty),
      L, W, H,
      ply: form.ply,
      nUp,
      joint, reelTrim, cuttingTrim, flap,
      reelSizeCm: reelSize,
      cuttingSizeCm: cuttingSize,
      boardsRequired: Math.ceil(num(form.qty) / nUp),
      layerGsms: form.layerGsms,
      layerBFs: form.layerBFs,
      weightAddition: num(form.weightAddition),
      totalGsm,
      weightPerBoxG: weightPerBox,
      costComponents: form.costComponents,
      kraftPaperCost,
      totalCostPerKg,
      costPerBox,
      totalOrderCost,
      date: editingId
        ? orders.find((o) => o.id === editingId)?.date || new Date().toISOString()
        : new Date().toISOString(),
    };
    let next;
    if (editingId) {
      next = orders.map((o) => (o.id === editingId ? record : o));
    } else {
      next = [record, ...orders];
    }
    await persistOrders(next);
    showToast("success", editingId ? "Order updated" : "Order saved");
    setEditingId(null);
    setForm(buildEmptyForm(defaults, form.ply));
    setFlapOverridden(false);
    setLayersOverridden(false);
    setTab("orders");
  }

  function editOrder(o) {
    setForm({
      customerId: o.customerId || "",
      customerName: o.customerName,
      phone: o.phone || "",
      email: o.email || "",
      orderNumber: o.orderNumber || "",
      itemName: o.itemName,
      qty: String(o.qty),
      L: String(o.L),
      W: String(o.W),
      H: String(o.H),
      ply: o.ply,
      nUp: String(o.nUp),
      joint: String(o.joint),
      reelTrim: String(o.reelTrim),
      cuttingTrim: String(o.cuttingTrim),
      flap: String(o.flap),
      layerGsms: o.layerGsms || defaultLayerGsms(o.ply),
      layerBFs: o.layerBFs || defaultLayerBFs(o.ply),
      weightAddition: String(o.weightAddition ?? 15),
      costComponents: o.costComponents || { ...defaults.costComponents },
    });
    setFlapOverridden(true);
    setLayersOverridden(true);
    setEditingId(o.id);
    setTab("calc");
  }

  async function deleteOrder(id) {
    const next = orders.filter((o) => o.id !== id);
    await persistOrders(next);
    setConfirmDelete(null);
    showToast("success", "Order deleted");
  }

  function cancelEdit() {
    setEditingId(null);
    setForm(buildEmptyForm(defaults, "3"));
    setFlapOverridden(false);
    setLayersOverridden(false);
  }

  const filteredOrders = orders.filter((o) => {
    const q = search.trim().toLowerCase();
    if (!q) return true;
    return (
      o.customerName.toLowerCase().includes(q) ||
      o.itemName.toLowerCase().includes(q) ||
      (o.customerId || "").toLowerCase() === q
    );
  });

  // One row per unique Customer ID (orders without an ID are grouped together),
  // using the most recent order's name for each — orders are already newest-first.
  const customerList = useMemo(() => {
    const map = new Map();
    for (const o of orders) {
      const key = (o.customerId || "").trim() || "__none__";
      if (!map.has(key)) {
        map.set(key, {
          key,
          customerId: (o.customerId || "").trim(),
          customerName: o.customerName,
          count: 0,
          latestDate: o.date,
        });
      }
      map.get(key).count += 1;
    }
    return Array.from(map.values());
  }, [orders]);

  const filteredCustomerList = customerList.filter((c) => {
    const q = search.trim().toLowerCase();
    if (!q) return true;
    return c.customerName.toLowerCase().includes(q) || c.customerId.toLowerCase().includes(q);
  });

  const ordersForSelectedCustomer = selectedCustomerId
    ? orders.filter((o) => ((o.customerId || "").trim() || "__none__") === selectedCustomerId)
    : [];

  // ---- Diagram scaling ----
  const diagram = useMemo(() => {
    const maxW = 340, maxH = 300;
    const scale = Math.min(maxW / Math.max(cuttingSize, 1), maxH / Math.max(reelSize, 1));
    const bw = cuttingSize * scale;
    const bh = reelSize * scale;
    const bandH = (H + W + flap) * scale;
    const trimHalfH = (reelTrim / 2) * scale;
    const cuttingTrimW = cuttingTrim * scale;
    return { scale, bw, bh, bandH, trimHalfH, cuttingTrimW };
  }, [cuttingSize, reelSize, H, W, flap, reelTrim, cuttingTrim]);


  return (
    <div style={styles.app}>
      <style>{`
        * { box-sizing: border-box; }
        input[type=number]::-webkit-inner-spin-button { opacity: 1; }
        .bc-input:focus, .bc-select:focus {
          outline: none; border-color: #1B2A4A !important; box-shadow: 0 0 0 4px rgba(27,42,74,0.07); background: #fff !important;
        }
        .bc-btn:focus-visible {
          outline: 2px solid #1B2A4A; outline-offset: 1px;
        }
        .bc-row:hover { background: #FAFAFA !important; }
        @media (max-width: 760px) {
          .bc-grid { grid-template-columns: 1fr !important; }
        }
      `}</style>

      <header style={styles.header}>
        <div style={styles.headerInner}>
          <div style={styles.brandRow}>
            {branding.logoDataUrl ? (
              <img src={branding.logoDataUrl} alt="Logo" style={{ height: Math.min(Number(branding.logoHeight) || 40, 44), width: "auto", maxWidth: 180, objectFit: "contain" }} />
            ) : (
              <svg width="30" height="30" viewBox="0 0 30 30" fill="none">
                <path d="M2 9 L15 3 L28 9 L28 24 L15 30 L2 24 Z" stroke="#2B4C7E" strokeWidth="1.6" fill="#F0EEE6"/>
                <path d="M2 9 L15 15 L28 9 M15 15 L15 30" stroke="#2B4C7E" strokeWidth="1.6"/>
              </svg>
            )}
            <div>
              <div style={styles.brandTitle}>{branding.staffHeading || "Employee Portal"}</div>
              <div style={styles.brandSub}>{branding.staffSubheading || "Packaging Design, Estimation & Costing"}</div>
            </div>
          </div>
          <nav style={styles.tabs}>
            <button
              className="bc-btn"
              style={{ ...styles.tabBtn, ...(tab === "calc" ? styles.tabBtnActive : {}) }}
              onClick={() => setTab("calc")}
            >
              Workspace
            </button>
            <button
              className="bc-btn"
              style={{ ...styles.tabBtn, ...(tab === "orders" ? styles.tabBtnActive : {}) }}
              onClick={() => setTab("orders")}
            >
              Sales Orders {orders.length > 0 ? `(${orders.length})` : ""}
            </button>
            <button
              className="bc-btn"
              style={{ ...styles.tabBtn, ...(tab === "customerOrders" ? styles.tabBtnActive : {}) }}
              onClick={() => setTab("customerOrders")}
            >
              Online Order Requests {customerSubmissions.length > 0 ? `(${customerSubmissions.length})` : ""}
            </button>
            <button
              className="bc-btn"
              style={{ ...styles.tabBtn, ...(tab === "defaults" ? styles.tabBtnActive : {}) }}
              onClick={() => setTab("defaults")}
            >
              Internal Presets
            </button>
            <button
              className="bc-btn"
              style={{ ...styles.tabBtn, ...(tab === "customerDefaults" ? styles.tabBtnActive : {}) }}
              onClick={() => setTab("customerDefaults")}
            >
              Customer Presets
            </button>
            <button
              className="bc-btn"
              style={{ ...styles.tabBtn, ...(tab === "branding" ? styles.tabBtnActive : {}) }}
              onClick={() => setTab("branding")}
            >
              Settings
            </button>
          </nav>
          <button className="bc-btn" style={styles.logoutBtn} onClick={onExit}>Log out</button>
        </div>
      </header>

      {toast && (
        <div style={{ ...styles.toast, ...(toast.type === "error" ? styles.toastError : styles.toastSuccess) }}>
          {toast.msg}
        </div>
      )}

      <main style={styles.main}>
        {tab === "calc" && (
          <div className="bc-grid" style={styles.grid}>
            {/* LEFT: form */}
            <div style={styles.panel}>
              <div style={styles.panelLabel}>ORDER DETAILS</div>
              <Field label="Order number (optional)">
                <input className="bc-input" style={styles.input} value={form.orderNumber}
                  onChange={(e) => updateField("orderNumber", e.target.value)} placeholder="e.g. AMB-260722-1234" />
              </Field>
              <Field label="Customer ID">
                <input className="bc-input" style={styles.input} value={form.customerId}
                  onChange={(e) => updateField("customerId", e.target.value)} placeholder="e.g. 1" />
              </Field>
              <Field label="Customer name">
                <input className="bc-input" style={styles.input} value={form.customerName}
                  onChange={(e) => updateField("customerName", e.target.value)} placeholder="e.g. Sunrise Traders" />
              </Field>
              <div style={styles.dimRow2}>
                <Field label="Phone number">
                  <input className="bc-input" style={styles.inputSm} type="tel" value={form.phone}
                    onChange={(e) => updateField("phone", e.target.value)} placeholder="e.g. 98765 43210" />
                </Field>
                <Field label="Email ID">
                  <input className="bc-input" style={styles.inputSm} type="email" value={form.email}
                    onChange={(e) => updateField("email", e.target.value)} placeholder="e.g. you@company.com" />
                </Field>
              </div>
              <Field label="Item name">
                <input className="bc-input" style={styles.input} value={form.itemName}
                  onChange={(e) => updateField("itemName", e.target.value)} placeholder="e.g. Mango box 5kg" />
              </Field>
              <Field label="Quantity">
                <input className="bc-input" style={styles.input} type="number" min="0" value={form.qty}
                  onChange={(e) => updateField("qty", e.target.value)} placeholder="e.g. 500" />
              </Field>

              <div style={styles.divider} />
              <div style={styles.panelLabel}>BOX DIMENSIONS (cm, external)</div>
              <div style={styles.dimRow}>
                <Field label="L"><input className="bc-input" style={styles.inputSm} type="number" value={form.L} onChange={(e) => updateField("L", e.target.value)} /></Field>
                <Field label="W"><input className="bc-input" style={styles.inputSm} type="number" value={form.W} onChange={(e) => updateField("W", e.target.value)} /></Field>
                <Field label="H"><input className="bc-input" style={styles.inputSm} type="number" value={form.H} onChange={(e) => updateField("H", e.target.value)} /></Field>
              </div>
              <div style={styles.dimRow}>
                <Field label="Ply">
                  <select className="bc-select" style={styles.inputSm} value={form.ply} onChange={(e) => updateField("ply", e.target.value)}>
                    <option value="3">3-ply</option>
                    <option value="5">5-ply</option>
                    <option value="7">7-ply</option>

                <Field label="Boxes/reel (N-up)">
                  <input className="bc-input" style={styles.inputSm} type="number" min="1" value={form.nUp} onChange={(e) => updateField("nUp", e.target.value)} />

              <button className="bc-btn" style={styles.advToggle} onClick={() => setAdvancedOpen((v) => !v)}>

              {advancedOpen && (

                    <Field label="Flap bending"><input className="bc-input" style={styles.inputSm} type="number" value={form.flap} onChange={(e) => updateField("flap", e.target.value)} /></Field>
                  </div>
                  <div style={styles.dimRow}>
                    <Field label="Reel trim"><input className="bc-input" style={styles.inputSm} type="number" value={form.reelTrim} onChange={(e) => updateField("reelTrim", e.target.value)} /></Field>
                    <Field label="Cutting trim"><input className="bc-input" style={styles.inputSm} type="number" value={form.cuttingTrim} onChange={(e) => updateField("cuttingTrim", e.target.value)} /></Field>
                  </div>
                  <button className="bc-btn" style={styles.linkBtn} onClick={resetAllowancesToDefault}>Reset to defaults</button>
                </div>

              <div style={styles.divider} />
              <div style={styles.panelLabel}>PAPER SPECIFICATION (GSM &amp; BF)</div>
              {layerTypes.map((type, i) => (
                <div key={i} style={styles.dimRow2}>
                  <Field label={`${layerLabel(type, i, layerTypes)}${type === "flute" ? " (fluting)" : ""} GSM`}>
                    <input
                      className="bc-input"
                      style={styles.inputSm}
                      type="number"
                      value={form.layerGsms[i] ?? ""}
                      onChange={(e) => updateLayerGsm(i, e.target.value)}
                    />
                  </Field>
                  <Field label="BF grade">
                    <select className="bc-select" style={styles.inputSm} value={form.layerBFs[i] ?? "20"}
                      onChange={(e) => updateLayerBF(i, e.target.value)}>
                      {BF_OPTIONS.map((bf) => <option key={bf} value={bf}>{bf}BF</option>)}
                    </select>
                  </Field>
                </div>
              ))}
              <Field label="Weight addition (g)">
                <input className="bc-input" style={styles.inputSm} type="number" value={form.weightAddition}
                  onChange={(e) => updateField("weightAddition", e.target.value)} />
              </Field>

              <div style={styles.divider} />
              <button className="bc-btn" style={styles.advToggle} onClick={() => setCostsOpen((v) => !v)}>
                {costsOpen ? "▾" : "▸"} Other Process Costs (₹ per kg) — paper priced separately above by BF
              </button>
              {costsOpen && (
                <div style={styles.advBox}>
                  <div style={styles.dimRow}>
                    {COST_FIELD_LABELS.slice(0, 3).map(([key, label]) => (
                      <Field key={key} label={label}>
                        <input className="bc-input" style={styles.inputSm} type="number" value={form.costComponents[key]}
                          onChange={(e) => updateCostField(key, e.target.value)} />
                      </Field>
                    ))}
                  </div>
                  <div style={styles.dimRow}>
                    {COST_FIELD_LABELS.slice(3, 6).map(([key, label]) => (
                      <Field key={key} label={label}>
                        <input className="bc-input" style={styles.inputSm} type="number" value={form.costComponents[key]}
                          onChange={(e) => updateCostField(key, e.target.value)} />
                      </Field>
                    ))}
                  </div>
                  <div style={styles.dimRow}>
                    {COST_FIELD_LABELS.slice(6, 9).map(([key, label]) => (
                      <Field key={key} label={label}>
                        <input className="bc-input" style={styles.inputSm} type="number" value={form.costComponents[key]}
                          onChange={(e) => updateCostField(key, e.target.value)} />
                      </Field>
                    ))}
                  </div>
                </div>
              )}
              <Field label="Total process cost/kg (auto)">
                <input className="bc-input" style={{ ...styles.inputSm, background: "#F0EEE6", fontWeight: 700 }} value={fmt(otherCostPerKg)} readOnly />
              </Field>
              <button className="bc-btn" style={styles.linkBtn} onClick={resetCostsToDefault}>Reset to defaults</button>

              <div style={styles.divider} />
              <div style={styles.formActions}>
                <button className="bc-btn" style={styles.primaryBtn} onClick={saveOrder}>
                  {editingId ? "Update order" : "Save order"}
                </button>
                {editingId && (
                  <button className="bc-btn" style={styles.ghostBtn} onClick={cancelEdit}>Cancel edit</button>
                )}
              </div>
            </div>

            {/* RIGHT: diagram + results */}
            <div style={styles.panel}>
              <div style={styles.panelLabel}>BOARD LAYOUT</div>
              <svg width="100%" height="300" viewBox="0 0 380 300" style={{ overflow: "visible" }}>
                <defs>
                  <pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
                    <line x1="0" y1="0" x2="0" y2="6" stroke="#C98A4B" strokeWidth="1.4" />
                  </pattern>
                </defs>
                {(() => {
                  const ox = 55, oy = 20;
                  const { bw, bh, bandH, trimHalfH, cuttingTrimW } = diagram;
                  const bands = [];
                  for (let i = 0; i < nUp; i++) {
                    bands.push(
                      <rect key={i} x={ox} y={oy + trimHalfH + i * bandH} width={bw - cuttingTrimW} height={bandH}
                        fill={i % 2 === 0 ? "#EEF1F6" : "#E4E9F1"} stroke="#2B4C7E" strokeWidth="0.75" />
                    );
                  }
                  return (
                    <g fontFamily="'IBM Plex Mono', monospace">
                      <rect x={ox} y={oy} width={bw} height={bh} fill="#fff" stroke="#2B4C7E" strokeWidth="1.4" />
                      {/* top reel-trim strip */}
                      <rect x={ox} y={oy} width={bw - cuttingTrimW} height={trimHalfH} fill="url(#hatch)" stroke="#2B4C7E" strokeWidth="0.75" />
                      {bands}
                      {/* bottom reel-trim strip */}
                      <rect x={ox} y={oy + trimHalfH + nUp * bandH} width={bw - cuttingTrimW} height={trimHalfH} fill="url(#hatch)" stroke="#2B4C7E" strokeWidth="0.75" />
                      {/* cutting-trim strip, single side (right edge) */}
                      <rect x={ox + bw - cuttingTrimW} y={oy} width={cuttingTrimW} height={bh} fill="url(#hatch)" stroke="#2B4C7E" strokeWidth="0.75" />
                      {/* cutting size dimension line (top) */}
                      <line x1={ox} y1={oy - 12} x2={ox + bw} y2={oy - 12} stroke="#1B2A4A" strokeWidth="1" />
                      <line x1={ox} y1={oy - 16} x2={ox} y2={oy - 8} stroke="#1B2A4A" strokeWidth="1" />
                      <line x1={ox + bw} y1={oy - 16} x2={ox + bw} y2={oy - 8} stroke="#1B2A4A" strokeWidth="1" />
                      <text x={ox + bw / 2} y={oy - 20} textAnchor="middle" fontSize="11" fill="#1B2A4A" fontWeight="600">
                        {fmt(cuttingSize)} cm
                      </text>
                      {/* reel size dimension line (left) */}
                      <line x1={ox - 12} y1={oy} x2={ox - 12} y2={oy + bh} stroke="#1B2A4A" strokeWidth="1" />
                      <line x1={ox - 16} y1={oy} x2={ox - 8} y2={oy} stroke="#1B2A4A" strokeWidth="1" />
                      <line x1={ox - 16} y1={oy + bh} x2={ox - 8} y2={oy + bh} stroke="#1B2A4A" strokeWidth="1" />
                      <text x={ox - 20} y={oy + bh / 2} textAnchor="middle" fontSize="11" fill="#1B2A4A" fontWeight="600"
                        transform={`rotate(-90 ${ox - 20} ${oy + bh / 2})`}>
                        {fmt(reelSize)} cm
                      </text>
                      <text x={ox + 4} y={oy + trimHalfH / 2 + 3} fontSize="8" fill="#8A5A2B">reel trim/2</text>
                      <text x={ox + 4} y={oy + trimHalfH + nUp * bandH + trimHalfH / 2 + 3} fontSize="8" fill="#8A5A2B">reel trim/2</text>
                      <text x={ox + bw - cuttingTrimW / 2} y={oy + bh + 14} textAnchor="middle" fontSize="8" fill="#8A5A2B">cutting trim</text>
                      <text x={ox + 4} y={oy + trimHalfH + bandH / 2 + 3} fontSize="9" fill="#556077">box {nUp > 1 ? "1" : ""}</text>
                    </g>
                  );
                })()}
              </svg>

              <div style={styles.divider} />
              <div style={styles.resultsGrid}>
                <Result label="Reel size" value={`${fmt(reelSize)} cm`} />
                <Result label="Cutting size" value={`${fmt(cuttingSize)} cm`} />
                <Result label="Board size" value={`${fmt(reelSize)} × ${fmt(cuttingSize)} cm`} big />
                <Result
                  label={`Boards required (${nUp}-up)`}
                  value={boardsRequired !== null ? `${boardsRequired}` : "Enter quantity"}
                  big
                />
                <Result label="Total GSM" value={`${fmt(totalGsm)}`} />
                <Result label="Weight per box" value={`${fmt(weightPerBox)} g`} big />
                <Result
                  label="Total order weight"
                  value={qtyNum > 0 ? `${fmt((weightPerBox * qtyNum) / 1000)} kg` : "Enter quantity"}
                  big
                />
                <Result label="Kraft paper cost (by BF)" value={`₹${fmt(kraftPaperCost)}`} />
                <Result label="Other process cost" value={`₹${fmt(otherCost)}`} />
                <Result label="Cost per box" value={`₹${fmt(costPerBox)}`} big />
                <Result
                  label="Total order cost"
                  value={totalOrderCost !== null ? `₹${fmt(totalOrderCost)}` : "Enter quantity"}
                  big
                />
              </div>

              <div style={styles.divider} />
              <div style={styles.panelLabel}>COMPARE N-UP</div>
              <table style={styles.table}>
                <thead>
                  <tr>
                    <th style={styles.th}>N-up</th>
                    <th style={styles.th}>Reel</th>
                    <th style={styles.th}>Cutting</th>
                    <th style={styles.th}>Board size</th>
                    <th style={styles.th}>Boards needed</th>
                  </tr>
                </thead>
                <tbody>
                  {comparisonRows.map((r) => (
                    <tr key={r.n} style={r.n === nUp ? styles.trHighlight : undefined}>
                      <td style={styles.td}>{r.n}</td>
                      <td style={styles.td}>{fmt(r.reelSize)}</td>
                      <td style={styles.td}>{fmt(r.cuttingSize)}</td>
                      <td style={styles.td}>{r.board}</td>
                      <td style={styles.tdMono}>{r.boardsNeeded !== null ? r.boardsNeeded : "—"}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        )}

        {tab === "orders" && !selectedCustomerId && (
          <div style={styles.panel}>
            <div style={styles.ordersHeader}>
              <div style={styles.panelLabel}>CUSTOMERS</div>
              <input
                className="bc-input"
                style={styles.searchInput}
                placeholder="Search customer or ID…"
                value={search}
                onChange={(e) => setSearch(e.target.value)}
              />
            </div>
            {loading ? (
              <div style={styles.emptyState}>Loading…</div>
            ) : filteredCustomerList.length === 0 ? (
              <div style={styles.emptyState}>
                {customerList.length === 0
                  ? "No orders yet. Use the Workspace tab to size a box and save it here."
                  : "No customers match your search."}
              </div>
            ) : (
              <div style={{ overflowX: "auto" }}>
                <table style={styles.table}>
                  <thead>
                    <tr>
                      <th style={styles.th}>Customer ID</th>
                      <th style={styles.th}>Customer name</th>
                      <th style={styles.th}>Orders</th>
                    </tr>
                  </thead>
                  <tbody>
                    {filteredCustomerList.map((c) => (
                      <tr
                        key={c.key}
                        className="bc-row"
                        style={{ cursor: "pointer" }}
                        onClick={() => { setSelectedCustomerId(c.key); setSearch(""); }}
                      >
                        <td style={styles.tdMono}>{c.customerId || "No Customer ID"}</td>
                        <td style={styles.td}>{c.customerName}</td>
                        <td style={styles.td}>{c.count}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        )}

        {tab === "orders" && selectedCustomerId && (
          <div style={styles.panel}>
            <div style={styles.ordersHeader}>
              <div>
                <button className="bc-btn" style={styles.linkBtn} onClick={() => setSelectedCustomerId(null)}>
                  ← Back to customers
                </button>
                <div style={{ ...styles.panelLabel, marginTop: 8, marginBottom: 0 }}>
                  {ordersForSelectedCustomer[0]?.customerName || "Customer"}
                  {ordersForSelectedCustomer[0]?.customerId ? ` (ID: ${ordersForSelectedCustomer[0].customerId})` : ""}

              </div>
              <input
                className="bc-input"
                style={styles.searchInput}
                placeholder="Search item…"
                value={search}
                onChange={(e) => setSearch(e.target.value)}
              />
            </div>
            {(() => {
              const q = search.trim().toLowerCase();
              const rows = q
                ? ordersForSelectedCustomer.filter((o) => o.itemName.toLowerCase().includes(q))

                <div style={styles.emptyState}>No orders match your search.</div>

              <div style={{ overflowX: "auto" }}>
                <table style={styles.table}>
                  <thead>
                    <tr>
                      <th style={styles.th}>Phone</th>
                      <th style={styles.th}>Email</th>
                      <th style={styles.th}>Item</th>

  useEffect(() => {

          const merged = {
            ...FACTORY_DEFAULTS,

              printingMode: f.printingMode, referencePhotos: f.referencePhotos, designNotes: f.designNotes, boxStyle: f.boxStyle,
              printingSides: f.printingSides, printingPhotoMode: f.printingPhotoMode, printingSidePhotos: f.printingSidePhotos,

      }

  }, []);

  useEffect(() => {
    try {
      const raw = localStorage.getItem("boxcalc_customIcons");
      if (raw) setCustomIcons(JSON.parse(raw));
    } catch (e) {}
    (async () => {
      try {
        const res = await localGet("customIcons");
        if (res && res.value) {
          const saved = JSON.parse(res.value);
          if (Array.isArray(saved)) {
            setCustomIcons(saved);
            try { localStorage.setItem("boxcalc_customIcons", res.value); } catch (e) {}
          }
        }
      } catch (e) {
        // use whatever was cached, or empty
      }
    })();
  }, []);

  function showToast(type, msg) {
    setToast({ type, msg });
    setTimeout(() => setToast(null), 2400);
  }

  function getPresetLayers(level, ply) {
    const preset = defaults.qualityPresets && defaults.qualityPresets[level];
    const gsmArr = preset && preset.layerGsmsByPly && preset.layerGsmsByPly[ply];
    const bfArr = preset && preset.layerBFsByPly && preset.layerBFsByPly[ply];
    return {
      layerGsms: gsmArr ? [...gsmArr] : defaultLayerGsms(ply),
      layerBFs: bfArr ? [...bfArr] : defaultLayerBFs(ply),
    };
  }

  function updateField(key, value) {
    setForm((f) => ({ ...f, [key]: value }));
    if (key === "ply") {
      setForm((f) => {
        if (f.qualityLevel !== "custom") {
          const { layerGsms, layerBFs } = getPresetLayers(f.qualityLevel, value);
          return { ...f, ply: value, layerGsms, layerBFs };
        }
        const newTypes = layerTypesForPly(value);
        const plyDefaults = highestLayerGsms(value);
        const bfDefaults = highestLayerBFs(value);
        const mergedGsm = layersOverridden
          ? newTypes.map((_, i) => (f.layerGsms[i] !== undefined ? f.layerGsms[i] : plyDefaults[i]))
          : [...plyDefaults];
        const mergedBF = layersOverridden
          ? newTypes.map((_, i) => (f.layerBFs[i] !== undefined ? f.layerBFs[i] : bfDefaults[i]))
          : [...bfDefaults];
        return { ...f, ply: value, layerGsms: mergedGsm, layerBFs: mergedBF };
      });
    }
  }

  function selectQualityLevel(level) {
    setForm((f) => {
      if (level === "custom") {
        return { ...f, qualityLevel: "custom" };
      }
      const { layerGsms, layerBFs } = getPresetLayers(level, f.ply);
      return { ...f, qualityLevel: level, layerGsms, layerBFs };
    });
    setLayersOverridden(false);
  }

  function updateLayerGsm(index, value) {
    setLayersOverridden(true);
    setForm((f) => {
      const next = [...f.layerGsms];
      next[index] = value;
      return { ...f, layerGsms: next };
    });
  }

  function updateLayerBF(index, value) {
    setLayersOverridden(true);
    setForm((f) => {
      const next = [...f.layerBFs];
      next[index] = value;
      return { ...f, layerBFs: next };
    });
  }

  function addIconToFace(face, icon, mode) {
    if (mode === "image" || mode === "both") {
      addFaceImage(face, icon.dataUrl, icon.aspectRatio || 1, !!icon.isVector, mode === "both" ? { posY: 0.36, widthFrac: 0.26 } : undefined);
    }
    if (mode === "text" || mode === "both") {
      addFaceText(face, icon.label, mode === "both" ? { posY: 0.64, size: "26", boxWidth: 0.6 } : undefined);
    }
  }

  function pushUndoSnapshot() {
    const snapshot = JSON.parse(JSON.stringify(form.faceTexts || {}));
    setUndoStack((stack) => {
      const next = [...stack, snapshot];
      return next.length > UNDO_LIMIT ? next.slice(next.length - UNDO_LIMIT) : next;
    });
    setRedoStack([]);
  }

  function undoDesign() {
    if (undoStack.length === 0) return;
    const prev = undoStack[undoStack.length - 1];
    const current = JSON.parse(JSON.stringify(form.faceTexts || {}));
    setRedoStack((r) => [...r, current]);
    setUndoStack((stack) => stack.slice(0, -1));
    setForm((f) => ({ ...f, faceTexts: prev }));
  }

  function redoDesign() {
    if (redoStack.length === 0) return;
    const next = redoStack[redoStack.length - 1];
    const current = JSON.parse(JSON.stringify(form.faceTexts || {}));
    setUndoStack((stack) => [...stack, current]);
    setRedoStack((r) => r.slice(0, -1));
    setForm((f) => ({ ...f, faceTexts: next }));
  }

  useEffect(() => {
    function handleKeyDown(e) {
      const isMod = e.ctrlKey || e.metaKey;
      if (!isMod) return;
      if (e.key.toLowerCase() === "z" && !e.shiftKey) {
        e.preventDefault();
        undoDesign();
      } else if ((e.key.toLowerCase() === "z" && e.shiftKey) || e.key.toLowerCase() === "y") {
        e.preventDefault();
        redoDesign();
      }
    }
    window.addEventListener("keydown", handleKeyDown);
    return () => window.removeEventListener("keydown", handleKeyDown);
  });

  function selectPrintingMode(mode) {
    if (!hasValidDims) {
      showToast("error", "Please enter your box dimensions (Length, Width, Height) before choosing a printing option.");
      return;
    }
    const printMin = num(defaults.printMinQty);
    if (printMin > 0 && qtyNum < printMin) {
      showToast("error", `Printing service requires a minimum order of ${printMin} boxes. Please update your quantity to continue.`);
      return;
    }
    if (mode === "diy") setFacePicked(false);
    updateField("printingMode", mode);
  }

  function togglePrintingSide(face) {
    const wasSelected = (form.printingSides || []).includes(face);
    setForm((f) => {
      const current = f.printingSides || [];
      const next = wasSelected ? current.filter((x) => x !== face) : [...current, face];
      return { ...f, printingSides: next };
    });
    setLastSideAction({ face, selected: !wasSelected });
  }

  async function handlePerSidePhotoUpload(face, file) {
    if (!file) return;
    try {
      const dataUrl = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error("Could not read that file"));
        reader.onload = () => resolve(String(reader.result));
        reader.readAsDataURL(file);
      });
      setForm((f) => ({ ...f, printingSidePhotos: { ...(f.printingSidePhotos || {}), [face]: dataUrl } }));
    } catch (err) {
      showToast("error", err.message || "Couldn't upload that photo.");
    }
  }

  function removePerSidePhoto(face) {
    setForm((f) => {
      const next = { ...(f.printingSidePhotos || {}) };
      delete next[face];
      return { ...f, printingSidePhotos: next };
    });
  }

  function addFaceText(face, text, overrides) {
    pushUndoSnapshot();
    const id = `t_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`;
    const newItem = {
      id, text,
      font: FONT_OPTIONS[0].value,
      style: "normal",
      size: "48",
      color: "#1B2A4A",
      posX: 0.5,
      posY: 0.5,
      rotation: 0,
      boxWidth: 0.75,
      align: "center",
      ...overrides,
    };
    setForm((f) => ({
      ...f,
      faceTexts: {
        ...f.faceTexts,
        [face]: [...(f.faceTexts?.[face] || []), newItem],
      },
    }));
    setSelectedTextId(id);
  }

  // Adds text sized to start within the printable safe area — long text gets a
  // smaller starting font size instead of overflowing off-panel, so the resize
  // handle stays reachable. The customer can still drag it to any size after.
  function addFaceTextAutoFit(face, text) {
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");
    const panelDims = (() => {
      if (face === "front" || face === "back") return { w: L || 1, h: H || 1 };
      if (face === "left" || face === "right") return { w: W || 1, h: H || 1 };
      return { w: L || 1, h: W || 1 };
    })();
    const marginCmVal = Math.max(0, num(defaults.printSafeMarginCm) || 1);
    const marginX = Math.min(200, (marginCmVal / (panelDims.w || 1)) * 512);
    const marginY = Math.min(200, (marginCmVal / (panelDims.h || 1)) * 512);
    const safeW = Math.max(40, 512 - marginX * 2);
    const safeH = Math.max(40, 512 - marginY * 2);

    const defaultSize = 48;
    const testCfg = { text, size: String(defaultSize), font: FONT_OPTIONS[0].value, style: "normal", boxWidth: 0.75 };
    const { blockWidth, blockHeight } = measureWrappedText(ctx, testCfg, 512);

    let finalSize = defaultSize;
    if (blockWidth > safeW || blockHeight > safeH) {
      const scale = Math.min(safeW / blockWidth, safeH / blockHeight) * 0.92;
      finalSize = Math.max(14, Math.round(defaultSize * scale));
    }
    addFaceText(face, text, { size: String(finalSize) });
  }

  function addFaceImage(face, dataUrl, aspectRatio, isVector, overrides) {
    pushUndoSnapshot();
    const id = `i_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`;
    const newItem = {
      id, type: "image", src: dataUrl, aspectRatio: aspectRatio || 1, isVector: !!isVector,
      posX: 0.5, posY: 0.5, rotation: 0, widthFrac: 0.4, flipX: false, flipY: false,
      useInkColor: false, inkColor: "#1B2A4A",
      ...overrides,
    };
    setForm((f) => ({
      ...f,
      faceTexts: {
        ...f.faceTexts,
        [face]: [...(f.faceTexts?.[face] || []), newItem],
      },
    }));
    setSelectedTextId(id);
  }

  function updateOutlineThickness(face, id, shapeId, newStrokeWidth) {
    const baseShape = SHAPE_LIBRARY.find((s) => s.id === shapeId);
    if (!baseShape) return;
    const newSvg = toOutlineShapeSvg(baseShape.svg, newStrokeWidth);
    const newDataUrl = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(newSvg);
    updateFaceTextItem(face, id, "src", newDataUrl);
    updateFaceTextItem(face, id, "strokeWidth", newStrokeWidth);
  }

  function updateFaceTextItem(face, id, field, value) {
    setForm((f) => ({
      ...f,
      faceTexts: {
        ...f.faceTexts,
        [face]: (f.faceTexts?.[face] || []).map((it) => (it.id === id ? { ...it, [field]: value } : it)),
      },
    }));
  }

  function updateFaceTextItemPos(face, id, posX, posY) {
    let px = posX;
    if (face === "top" || face === "bottom") {
      const creaseHalfWidth = 0.08; // keep text clear of the fold seam
      if (px > 0.5 - creaseHalfWidth && px < 0.5 + creaseHalfWidth) {
        px = px < 0.5 ? 0.5 - creaseHalfWidth : 0.5 + creaseHalfWidth;
      }
    }
    setForm((f) => ({
      ...f,
      faceTexts: {
        ...f.faceTexts,
        [face]: (f.faceTexts?.[face] || []).map((it) => (it.id === id ? { ...it, posX: px, posY } : it)),
      },
    }));
  }

  function removeFaceTextItem(face, id) {
    pushUndoSnapshot();
    setForm((f) => ({
      ...f,
      faceTexts: {
        ...f.faceTexts,
        [face]: (f.faceTexts?.[face] || []).filter((it) => it.id !== id),
      },
    }));
    setSelectedTextId((cur) => (cur === id ? null : cur));
  }

  function duplicateFaceTextItem(face, id) {
    pushUndoSnapshot();
    const newId = `t_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`;
    setForm((f) => {
      const items = f.faceTexts?.[face] || [];
      const original = items.find((it) => it.id === id);
      if (!original) return f;
      const clone = {
        ...original,
        id: newId,
        posX: Math.min(0.92, (original.posX ?? 0.5) + 0.05),
        posY: Math.min(0.92, (original.posY ?? 0.5) + 0.05),
      };
      return { ...f, faceTexts: { ...f.faceTexts, [face]: [...items, clone] } };
    });
    setSelectedTextId(newId);
  }

  function toggleFaceTextFlip(face, id, axis) {
    pushUndoSnapshot();
    const field = axis === "h" ? "flipX" : "flipY";
    setForm((f) => ({
      ...f,
      faceTexts: {
        ...f.faceTexts,
        [face]: (f.faceTexts?.[face] || []).map((it) => (it.id === id ? { ...it, [field]: !it[field] } : it)),
      },
    }));
  }

  function toggleFaceTextLock(face, id) {
    setForm((f) => ({
      ...f,
      faceTexts: {
        ...f.faceTexts,
        [face]: (f.faceTexts?.[face] || []).map((it) => (it.id === id ? { ...it, locked: !it.locked } : it)),
      },
    }));
  }

  const unitFactor = UNIT_TO_CM[form.dimUnit] ?? 1;
  const enteredL = num(form.L) * unitFactor, enteredW = num(form.W) * unitFactor, enteredH = num(form.H) * unitFactor;
  const qtyNum = num(form.qty);
  const dimAllowance =
    (defaults.internalToExternal && defaults.internalToExternal[form.ply]) ||
    FACTORY_DEFAULTS.internalToExternal[form.ply] || { L: "0", W: "0", H: "0" };
  const isInternalDims = form.dimType === "internal";
  const L = isInternalDims ? enteredL + num(dimAllowance.L) : enteredL;
  const W = isInternalDims ? enteredW + num(dimAllowance.W) : enteredW;
  const H = isInternalDims ? enteredH + num(dimAllowance.H) : enteredH;
  const layerTypes = useMemo(() => layerTypesForPly(form.ply), [form.ply]);
  const totalGsm = useMemo(() => {
    return layerTypes.reduce((sum, type, i) => {
      const g = num(form.layerGsms[i]);
      return sum + (type === "flute" ? 1.5 * g : g);
    }, 0);
  }, [layerTypes, form.layerGsms]);

  const flap = num(defaults.flapByPly[form.ply] ?? "0.5");
  const reelSize1Up = computeReelSize(1, H, W, flap, num(defaults.reelTrim));
  const cuttingSize = computeCuttingSize(L, W, num(defaults.joint), num(defaults.cuttingTrim));
  const boardAreaIn2 = (reelSize1Up * CM_TO_IN) * (cuttingSize * CM_TO_IN);
  const weightPerBox = (boardAreaIn2 * totalGsm) / WEIGHT_CONSTANT + num(defaults.weightAddition);

  const kraftPaperCost = layerTypes.reduce((sum, type, i) => {
    const g = num(form.layerGsms[i]);
    const eff = type === "flute" ? 1.5 * g : g;
    const layerWeightG = (boardAreaIn2 * eff) / WEIGHT_CONSTANT;
    const bf = form.layerBFs[i];
    const rate = num(defaults.bfPrices[bf]);
    return sum + (layerWeightG / 1000) * rate;
  }, 0);

  const otherCostPerKg = COST_FIELD_LABELS.reduce((sum, [key]) => sum + num(defaults.costComponents[key]), 0);
  const otherCost = (otherCostPerKg / 1000) * weightPerBox;
  const qtySlabExtra = findQtySlabExtra(defaults.qtySlabs, qtyNum);
  const printPlateRate = num(defaults.printPlateCostPerCm2);
  const printPlateSides = form.printingMode === "outsource"
    ? (form.printingSides || [])
    : Object.keys(form.faceTexts || {}).filter((face) => (form.faceTexts[face] || []).length > 0);
  const printPlateAreaCm2 = printPlateSides.reduce((sum, face) => sum + faceAreaCm2(face, L, W, H), 0);
  const printPlateCostTotal = printPlateRate * printPlateAreaCm2;
  const printPlateCostPerBox = qtyNum > 0 ? printPlateCostTotal / qtyNum : 0;
  const costPerBox = kraftPaperCost + otherCost + qtySlabExtra + printPlateCostPerBox;
  const totalCost = qtyNum > 0 ? costPerBox * qtyNum : null;
  const hasValidDims = enteredL > 0 && enteredW > 0 && enteredH > 0;
  const displayCostPerBox = hasValidDims ? costPerBox : 0;
  const displayTotalCost = hasValidDims && qtyNum > 0 ? costPerBox * qtyNum : 0;
  const displayWeightPerBox = hasValidDims ? weightPerBox : 0;

      let current = sectionRefs[0].key;
      for (const { key, ref } of sectionRefs) {

      else if (y < lastScrollYRef.current - 1) setScrollingDown(false);
      lastScrollYRef.current = y;

// ---- Top-level app: customer page by default, staff behind a password gate ----
function App() {
  const [staffAuthed, setStaffAuthed] = useState(false);
  const [showLogin, setShowLogin] = useState(false);
  const [authSettings, setAuthSettings] = useState(() => getCachedJSON("authSettings", FACTORY_AUTH));
  const [branding, setBranding] = useState(() => getCachedJSON("branding", FACTORY_BRANDING));
  const [username, setUsername] = useState("");
  const [password, setPassword] = useState("");
  const [loginError, setLoginError] = useState("");

  // Stop the browser's default "scroll wheel over a focused number input
  // changes its value" behavior — but only when the scroll happens directly
  // on that field, not for unrelated scrolling elsewhere on the page.
  useEffect(() => {
    function handleWheel(e) {
      const el = document.activeElement;
      if (el && el.tagName === "INPUT" && el.type === "number" && e.target === el) {
        el.blur();
      }
    }
    document.addEventListener("wheel", handleWheel, { passive: true });
    return () => document.removeEventListener("wheel", handleWheel);
  }, []);

  useEffect(() => {
    try {
      if (sessionStorage.getItem("staffAuthed") === "1") setStaffAuthed(true);
    } catch (e) {
      // ignore
    }
  }, []);

  useEffect(() => {
    if (!window.__fbOnAuthStateChanged) return;
    const unsubscribe = window.__fbOnAuthStateChanged((user) => {
      if (user) {
        try {
          sessionStorage.setItem("staffAuthed", "1");
        } catch (e) {
          // ignore
        }
        setStaffAuthed(true);
      }
    });
    return () => { if (typeof unsubscribe === "function") unsubscribe(); };
  }, []);

  // Load employee login credentials (managed from the Employee Portal Settings tab)
  useEffect(() => {
    (async () => {
      try {
        const res = await localGet("authSettings");
        if (res && res.value) {
          const saved = JSON.parse(res.value);
          setAuthSettings({ ...FACTORY_AUTH, ...saved });
        }
      } catch (e) {
        // use factory credentials
      }
    })();
  }, []);

  // Load branding (used for the login screen's heading text)
  useEffect(() => {
    (async () => {
      try {
        const res = await localGet("branding");
        if (res && res.value) {
          const saved = JSON.parse(res.value);
          setBranding({ ...FACTORY_BRANDING, ...saved });
        }
      } catch (e) {
        // use factory branding
      }
    })();
  }, []);

  async function attemptLogin() {
    setLoginError("");
    try {
      await staffSignIn(username, password);
      try {
        sessionStorage.setItem("staffAuthed", "1");
      } catch (e) {
        // ignore
      }
      setStaffAuthed(true);
      setShowLogin(false);
      setUsername("");
      setPassword("");
      setLoginError("");
    } catch (e) {
      setLoginError("Incorrect email or password");
    }
  }

  async function logout() {
    try {
      sessionStorage.removeItem("staffAuthed");
    } catch (e) {
      // ignore
    }
    await staffSignOut();
    setStaffAuthed(false);
  }

  if (staffAuthed) {
    return <StaffApp onExit={logout} />;
  }

  if (showLogin) {
    return (
      <div className="cs-root">
        <style>{PREMIUM_STYLES}</style>
        <div className="cs-login-wrap">
          <div className="cs-login-card">
            <div className="cs-login-icon">🔒</div>
            <div className="cs-login-title">{branding.staffHeading || "Employee Portal"}</div>
            <div className="cs-login-sub">Sign in with your employee credentials</div>
            {loginError && <div className="cs-login-error">{loginError}</div>}
            <div className="cs-field">
              <label className="cs-label">Email</label>
              <input
                className="cs-input"
                type="email"
                value={username}
                onChange={(e) => { setUsername(e.target.value); setLoginError(""); }}
                onKeyDown={(e) => e.key === "Enter" && attemptLogin()}
                autoFocus
              />
            </div>
            <div className="cs-field">
              <label className="cs-label">Password</label>
              <input
                className="cs-input"
                type="password"
                value={password}
                onChange={(e) => { setPassword(e.target.value); setLoginError(""); }}
                onKeyDown={(e) => e.key === "Enter" && attemptLogin()}
              />
            </div>
            <button className="cs-btn-primary" style={{ background: "#1B2A4A", color: "#fff" }} onClick={attemptLogin}>
              Sign in
            </button>
            <button className="cs-login-cancel" onClick={() => { setShowLogin(false); setUsername(""); setPassword(""); setLoginError(""); }}>
              Back to quote page
            </button>
          </div>
        </div>
      </div>
    );
  }

  return <CustomerView onStaffLoginClick={() => setShowLogin(true)} />;
}

// printing/customization feature: shows the box shape only, no artwork yet.
// Order matches THREE.BoxGeometry's default material group order: +X, -X, +Y, -Y, +Z, -Z
const BOX_FACE_ORDER = ["right", "left", "top", "bottom", "front", "back"];
const BOX_FACE_LABELS = { front: "Front Panel", back: "Rear Panel", left: "Left Side Panel", right: "Right Side Panel", top: "Top Panel", bottom: "Bottom Panel" };
// Order the face tabs are shown to the customer in — kept separate from BOX_FACE_ORDER,

// Breaks text into lines that fit within maxWidth, breaking at word boundaries
// (never mid-word) using the context's currently-set font.
// True if (px,py) falls within a rectangle centered at (cx,cy), rotated by
// rotationRad, with the given half-width/half-height — used so dragging only
// activates when the touch/click is genuinely on the text's own shape.
// For left/right-aligned text, the visible text sits off-center within its
// configured box width — this computes how far off-center, in local
// (unrotated) coordinates, so selection/handles/hit-testing can track the
// text's actual position instead of assuming it's always centered.
function textAlignOffsetX(align, maxWidth, blockWidth) {
  if (align === "left") return -maxWidth / 2 + blockWidth / 2;
  if (align === "right") return maxWidth / 2 - blockWidth / 2;
  return 0;
}

// World-space center of an item's actual visible content, accounting for
// text alignment and the item's rotation.
function effectiveItemCenter(item, cx, cy, rotationRad, blockWidth, maxWidth) {
  if (item.type === "image") return { cx, cy };
  const offsetX = textAlignOffsetX(item.align || "center", maxWidth, blockWidth);
  if (!offsetX) return { cx, cy };
  const cos = Math.cos(rotationRad), sin = Math.sin(rotationRad);
  return { cx: cx + offsetX * cos, cy: cy + offsetX * sin };
}

function pointInRotatedRect(px, py, cx, cy, halfW, halfH, rotationRad) {
  const dx = px - cx, dy = py - cy;
  const cos = Math.cos(-rotationRad), sin = Math.sin(-rotationRad);
  const localX = dx * cos - dy * sin;
  const localY = dx * sin + dy * cos;
  return Math.abs(localX) <= halfW && Math.abs(localY) <= halfH;
}

// Strips the well-known attack surface from an uploaded SVG before it's ever
// rendered: <script> tags, inline event-handler attributes (onclick etc.),
// <foreignObject> (can embed arbitrary HTML), and any external/remote
// references — so a malicious file can't execute code or phone home.

// Generates an SVG points string for a regular polygon centered in a 100x100 box
function regularPolygonPoints(sides, r = 44, rotationDeg = -90) {
  const pts = [];
  for (let i = 0; i < sides; i++) {
    const angle = ((rotationDeg + (i * 360) / sides) * Math.PI) / 180;
    pts.push(`${(50 + r * Math.cos(angle)).toFixed(2)},${(50 + r * Math.sin(angle)).toFixed(2)}`);
  }
  return pts.join(" ");
}

// Generates an SVG points string for an n-pointed star centered in a 100x100 box
function starPoints(points, outerR = 45, innerR = 19, rotationDeg = -90) {
  const pts = [];
  for (let i = 0; i < points * 2; i++) {
    const r = i % 2 === 0 ? outerR : innerR;
    const angle = ((rotationDeg + (i * 360) / (points * 2)) * Math.PI) / 180;
    pts.push(`${(50 + r * Math.cos(angle)).toFixed(2)},${(50 + r * Math.sin(angle)).toFixed(2)}`);
  }
  return pts.join(" ");
}
