<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ambicraft EDGE — Packaging Design, Estimation & Costing</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: #FAFAF7; }
  #root { min-height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useCallback } = React;


const FONT_LINK_ID = "boxcalc-fonts";

const DEFAULT_FLAP_BY_PLY = { 3: 0.5, 5: 0.6, 7: 0.7 };
const CM_TO_IN = 1 / 2.54;
const WEIGHT_CONSTANT = 1550;

function layerTypesForPly(ply) {
  const n = parseInt(ply, 10) || 3;
  const types = [];
  for (let i = 0; i < n; i++) types.push(i % 2 === 0 ? "liner" : "flute");
  return types;
}

function defaultLayerGsms(ply) {
  return layerTypesForPly(ply).map((t) => (t === "liner" ? "150" : "130"));
}

function layerLabel(type, index, types) {
  if (type === "flute") return `Flute ${types.slice(0, index).filter((t) => t === "flute").length + 1}`;
  const linerIndex = types.slice(0, index).filter((t) => t === "liner").length;
  const linerCount = types.filter((t) => t === "liner").length;
  if (linerIndex === 0) return "Top liner";
  if (linerIndex === linerCount - 1) return "Bottom liner";
  return `Middle liner ${linerIndex}`;
}

const DEFAULT_COST_COMPONENTS = {
  kraftPaper: "38",
  labour: "3.5",
  power: "1.5",
  corrugationGum: "1.5",
  jointGlue: "1",
  printingInk: "1",
  maintenance: "1",
  profit: "1",
  transportation: "1.5",
  bundling: "1",
};

const COST_FIELD_LABELS = [
  ["kraftPaper", "Kraft paper"],
  ["labour", "Labour cost"],
  ["power", "Power"],
  ["corrugationGum", "Corrugation & pasting gum"],
  ["jointGlue", "Manufacturing joint glue/pin"],
  ["printingInk", "Printing ink"],
  ["maintenance", "Maintenance"],
  ["profit", "Profit"],
  ["transportation", "Transportation"],
  ["bundling", "Bundling"],
];

const emptyForm = {
  customerName: "",
  itemName: "",
  qty: "",
  L: "30",
  W: "20",
  H: "25",
  ply: "3",
  nUp: "1",
  joint: "3.5",
  reelTrim: "2",
  cuttingTrim: "1.5",
  flap: "0.5",
  layerGsms: defaultLayerGsms("3"),
  weightAddition: "15",
  costComponents: { ...DEFAULT_COST_COMPONENTS },
};

function num(v) {
  const n = parseFloat(v);
  return isNaN(n) ? 0 : n;
}

function fmt(n) {
  return (Math.round(n * 100) / 100).toString();
}

function computeReelSize(n, H, W, flap, reelTrim) {
  return n * (H + W + flap) + reelTrim;
}
function computeCuttingSize(L, W, joint, cuttingTrim) {
  return 2 * (L + W) + joint + cuttingTrim;
}

function BoxCalc() {
  const [tab, setTab] = useState("calc");
  const [form, setForm] = useState(emptyForm);
  const [flapOverridden, setFlapOverridden] = useState(false);
  const [orders, setOrders] = useState([]);
  const [editingId, setEditingId] = useState(null);
  const [search, setSearch] = useState("");
  const [toast, setToast] = useState(null);
  const [loading, setLoading] = useState(true);
  const [advancedOpen, setAdvancedOpen] = useState(false);
  const [confirmDelete, setConfirmDelete] = useState(null);

  // Load Google Fonts
  useEffect(() => {
    if (!document.getElementById(FONT_LINK_ID)) {
      const link = document.createElement("link");
      link.id = FONT_LINK_ID;
      link.rel = "stylesheet";
      link.href =
        "https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap";
      document.head.appendChild(link);
    }
  }, []);

  // Load orders from storage
  useEffect(() => {
    try {
      const raw = localStorage.getItem("boxcalc_orders");
      if (raw) setOrders(JSON.parse(raw));
    } catch (e) {
      // no orders yet
    } finally {
      setLoading(false);
    }
  }, []);

  const persistOrders = useCallback(async (next) => {
    setOrders(next);
    try {
      localStorage.setItem("boxcalc_orders", JSON.stringify(next));
    } catch (e) {
      console.error("Failed to save orders", e);
      setToast({ type: "error", msg: "Could not save — try again" });
    }
  }, []);

  function showToast(type, msg) {
    setToast({ type, msg });
    setTimeout(() => setToast(null), 2200);
  }

  function updateField(key, value) {
    setForm((f) => ({ ...f, [key]: value }));
    if (key === "flap") setFlapOverridden(true);
    if (key === "ply" && !flapOverridden) {
      setForm((f) => ({ ...f, ply: value, flap: String(DEFAULT_FLAP_BY_PLY[value] ?? 0.5) }));
    }
    if (key === "ply") {
      setForm((f) => {
        const newTypes = layerTypesForPly(value);
        const defaults = defaultLayerGsms(value);
        const merged = newTypes.map((_, i) => (f.layerGsms[i] !== undefined ? f.layerGsms[i] : defaults[i]));
        return { ...f, layerGsms: merged };
      });
    }
  }

  function updateLayerGsm(index, value) {
    setForm((f) => {
      const next = [...f.layerGsms];
      next[index] = value;
      return { ...f, layerGsms: next };
    });
  }

  function updateCostField(key, value) {
    setForm((f) => ({ ...f, costComponents: { ...f.costComponents, [key]: value } }));
  }

  function resetCostsToDefault() {
    setForm((f) => ({ ...f, costComponents: { ...DEFAULT_COST_COMPONENTS } }));
  }

  function resetAllowancesToDefault() {
    setFlapOverridden(false);
    setForm((f) => ({
      ...f,
      joint: "3.5",
      reelTrim: "2",
      cuttingTrim: "1.5",
      flap: String(DEFAULT_FLAP_BY_PLY[f.ply] ?? 0.5),
    }));
  }

  const L = num(form.L),
    W = num(form.W),
    H = num(form.H),
    nUp = Math.max(1, Math.round(num(form.nUp) || 1)),
    joint = num(form.joint),
    reelTrim = num(form.reelTrim),
    cuttingTrim = num(form.cuttingTrim),
    flap = num(form.flap);

  const reelSize = useMemo(() => computeReelSize(nUp, H, W, flap, reelTrim), [nUp, H, W, flap, reelTrim]);
  const cuttingSize = useMemo(() => computeCuttingSize(L, W, joint, cuttingTrim), [L, W, joint, cuttingTrim]);

  const qtyNum = num(form.qty);
  const boardsRequired = qtyNum > 0 ? Math.ceil(qtyNum / nUp) : null;

  const layerTypes = useMemo(() => layerTypesForPly(form.ply), [form.ply]);

  const totalGsm = useMemo(() => {
    return layerTypes.reduce((sum, type, i) => {
      const g = num(form.layerGsms[i]);
      return sum + (type === "flute" ? 1.5 * g : g);
    }, 0);
  }, [layerTypes, form.layerGsms]);

  const reelSize1Up = useMemo(() => computeReelSize(1, H, W, flap, reelTrim), [H, W, flap, reelTrim]);

  const weightPerBox = useMemo(() => {
    const lenIn = reelSize1Up * CM_TO_IN;
    const widIn = cuttingSize * CM_TO_IN;
    const base = (lenIn * widIn * totalGsm) / WEIGHT_CONSTANT;
    return base + num(form.weightAddition);
  }, [reelSize1Up, cuttingSize, totalGsm, form.weightAddition]);

  const totalCostPerKg = useMemo(() => {
    return COST_FIELD_LABELS.reduce((sum, [key]) => sum + num(form.costComponents[key]), 0);
  }, [form.costComponents]);

  const costPerGram = totalCostPerKg / 1000;
  const costPerBox = costPerGram * weightPerBox;
  const totalOrderCost = qtyNum > 0 ? costPerBox * qtyNum : null;


  const comparisonRows = useMemo(() => {
    const rows = [];
    for (let n = 1; n <= 5; n++) {
      const rs = computeReelSize(n, H, W, flap, reelTrim);
      const boardsNeeded = qtyNum > 0 ? Math.ceil(qtyNum / n) : null;
      rows.push({ n, reelSize: rs, cuttingSize, board: `${fmt(rs)} × ${fmt(cuttingSize)}`, boardsNeeded });
    }
    return rows;
  }, [H, W, flap, reelTrim, cuttingSize, qtyNum]);

  function validate() {
    if (!form.customerName.trim()) return "Customer name is required";
    if (!form.itemName.trim()) return "Item name is required";
    if (!form.qty || num(form.qty) <= 0) return "Quantity must be greater than 0";
    if (L <= 0 || W <= 0 || H <= 0) return "Box dimensions must be greater than 0";
    return null;
  }

  async function saveOrder() {
    const err = validate();
    if (err) {
      showToast("error", err);
      return;
    }
    const record = {
      id: editingId || `ord_${Date.now()}`,
      customerName: form.customerName.trim(),
      itemName: form.itemName.trim(),
      qty: num(form.qty),
      L, W, H,
      ply: form.ply,
      nUp,
      joint, reelTrim, cuttingTrim, flap,
      reelSizeCm: reelSize,
      cuttingSizeCm: cuttingSize,
      boardsRequired: Math.ceil(num(form.qty) / nUp),
      layerGsms: form.layerGsms,
      weightAddition: num(form.weightAddition),
      totalGsm,
      weightPerBoxG: weightPerBox,
      costComponents: form.costComponents,
      totalCostPerKg,
      costPerBox,
      totalOrderCost,
      date: editingId
        ? orders.find((o) => o.id === editingId)?.date || new Date().toISOString()
        : new Date().toISOString(),
    };
    let next;
    if (editingId) {
      next = orders.map((o) => (o.id === editingId ? record : o));
    } else {
      next = [record, ...orders];
    }
    await persistOrders(next);
    showToast("success", editingId ? "Order updated" : "Order saved");
    setEditingId(null);
    setForm(emptyForm);
    setFlapOverridden(false);
    setTab("orders");
  }

  function editOrder(o) {
    setForm({
      customerName: o.customerName,
      itemName: o.itemName,
      qty: String(o.qty),
      L: String(o.L),
      W: String(o.W),
      H: String(o.H),
      ply: o.ply,
      nUp: String(o.nUp),
      joint: String(o.joint),
      reelTrim: String(o.reelTrim),
      cuttingTrim: String(o.cuttingTrim),
      flap: String(o.flap),
      layerGsms: o.layerGsms || defaultLayerGsms(o.ply),
      weightAddition: String(o.weightAddition ?? 15),
      costComponents: o.costComponents || { ...DEFAULT_COST_COMPONENTS },
    });
    setFlapOverridden(true);
    setEditingId(o.id);
    setTab("calc");
  }

  async function deleteOrder(id) {
    const next = orders.filter((o) => o.id !== id);
    await persistOrders(next);
    setConfirmDelete(null);
    showToast("success", "Order deleted");
  }

  function cancelEdit() {
    setEditingId(null);
    setForm(emptyForm);
    setFlapOverridden(false);
  }

  const filteredOrders = orders.filter((o) => {
    const q = search.trim().toLowerCase();
    if (!q) return true;
    return o.customerName.toLowerCase().includes(q) || o.itemName.toLowerCase().includes(q);
  });

  // ---- Diagram scaling ----
  const diagram = useMemo(() => {
    const maxW = 340, maxH = 300;
    const scale = Math.min(maxW / Math.max(cuttingSize, 1), maxH / Math.max(reelSize, 1));
    const bw = cuttingSize * scale;
    const bh = reelSize * scale;
    const bandH = (H + W + flap) * scale;
    const trimH = reelTrim * scale;
    const wasteW = (joint + cuttingTrim) * scale;
    return { scale, bw, bh, bandH, trimH, wasteW };
  }, [cuttingSize, reelSize, H, W, flap, reelTrim, joint, cuttingTrim]);

  return (
    <div style={styles.app}>
      <style>{`
        * { box-sizing: border-box; }
        input[type=number]::-webkit-inner-spin-button { opacity: 1; }
        .bc-input:focus, .bc-select:focus, .bc-btn:focus-visible {
          outline: 2px solid #2B4C7E; outline-offset: 1px;
        }
        .bc-row:hover { background: #F0EEE6 !important; }
        @media (max-width: 760px) {
          .bc-grid { grid-template-columns: 1fr !important; }
        }
      `}</style>

      <header style={styles.header}>
        <div style={styles.headerInner}>
          <div style={styles.brandRow}>
            <svg width="30" height="30" viewBox="0 0 30 30" fill="none">
              <path d="M2 9 L15 3 L28 9 L28 24 L15 30 L2 24 Z" stroke="#2B4C7E" strokeWidth="1.6" fill="#F0EEE6"/>
              <path d="M2 9 L15 15 L28 9 M15 15 L15 30" stroke="#2B4C7E" strokeWidth="1.6"/>
            </svg>
            <div>
              <div style={styles.brandTitle}>Ambicraft&nbsp;EDGE</div>
              <div style={styles.brandSub}>Packaging Design, Estimation &amp; Costing</div>
            </div>
          </div>
          <nav style={styles.tabs}>
            <button
              className="bc-btn"
              style={{ ...styles.tabBtn, ...(tab === "calc" ? styles.tabBtnActive : {}) }}
              onClick={() => setTab("calc")}
            >
              Calculator
            </button>
            <button
              className="bc-btn"
              style={{ ...styles.tabBtn, ...(tab === "orders" ? styles.tabBtnActive : {}) }}
              onClick={() => setTab("orders")}
            >
              Orders {orders.length > 0 ? `(${orders.length})` : ""}
            </button>
          </nav>
        </div>
      </header>

      {toast && (
        <div style={{ ...styles.toast, ...(toast.type === "error" ? styles.toastError : styles.toastSuccess) }}>
          {toast.msg}
        </div>
      )}

      <main style={styles.main}>
        {tab === "calc" && (
          <div className="bc-grid" style={styles.grid}>
            {/* LEFT: form */}
            <div style={styles.panel}>
              <div style={styles.panelLabel}>ORDER DETAILS</div>
              <Field label="Customer name">
                <input className="bc-input" style={styles.input} value={form.customerName}
                  onChange={(e) => updateField("customerName", e.target.value)} placeholder="e.g. Sunrise Traders" />
              </Field>
              <Field label="Item name">
                <input className="bc-input" style={styles.input} value={form.itemName}
                  onChange={(e) => updateField("itemName", e.target.value)} placeholder="e.g. Mango box 5kg" />
              </Field>
              <Field label="Quantity">
                <input className="bc-input" style={styles.input} type="number" min="0" value={form.qty}
                  onChange={(e) => updateField("qty", e.target.value)} placeholder="e.g. 500" />
              </Field>

              <div style={styles.divider} />
              <div style={styles.panelLabel}>BOX DIMENSIONS (cm, external)</div>
              <div style={styles.dimRow}>
                <Field label="L"><input className="bc-input" style={styles.inputSm} type="number" value={form.L} onChange={(e) => updateField("L", e.target.value)} /></Field>
                <Field label="W"><input className="bc-input" style={styles.inputSm} type="number" value={form.W} onChange={(e) => updateField("W", e.target.value)} /></Field>
                <Field label="H"><input className="bc-input" style={styles.inputSm} type="number" value={form.H} onChange={(e) => updateField("H", e.target.value)} /></Field>
              </div>
              <div style={styles.dimRow}>
                <Field label="Ply">
                  <select className="bc-select" style={styles.inputSm} value={form.ply} onChange={(e) => updateField("ply", e.target.value)}>
                    <option value="3">3-ply</option>
                    <option value="5">5-ply</option>
                    <option value="7">7-ply</option>
                  </select>
                </Field>
                <Field label="Boxes/reel (N-up)">
                  <input className="bc-input" style={styles.inputSm} type="number" min="1" value={form.nUp} onChange={(e) => updateField("nUp", e.target.value)} />
                </Field>
              </div>

              <button className="bc-btn" style={styles.advToggle} onClick={() => setAdvancedOpen((v) => !v)}>
                {advancedOpen ? "▾" : "▸"} Allowances {flapOverridden ? "(customized)" : "(defaults)"}
              </button>
              {advancedOpen && (
                <div style={styles.advBox}>
                  <div style={styles.dimRow}>
                    <Field label="Manufacturing joint"><input className="bc-input" style={styles.inputSm} type="number" value={form.joint} onChange={(e) => updateField("joint", e.target.value)} /></Field>
                    <Field label="Flap bending"><input className="bc-input" style={styles.inputSm} type="number" value={form.flap} onChange={(e) => updateField("flap", e.target.value)} /></Field>
                  </div>
                  <div style={styles.dimRow}>
                    <Field label="Reel trim"><input className="bc-input" style={styles.inputSm} type="number" value={form.reelTrim} onChange={(e) => updateField("reelTrim", e.target.value)} /></Field>
                    <Field label="Cutting trim"><input className="bc-input" style={styles.inputSm} type="number" value={form.cuttingTrim} onChange={(e) => updateField("cuttingTrim", e.target.value)} /></Field>
                  </div>
                  <button className="bc-btn" style={styles.linkBtn} onClick={resetAllowancesToDefault}>Reset to defaults</button>
                </div>
              )}

              <div style={styles.divider} />
              <div style={styles.panelLabel}>PAPER SPECIFICATION (GSM)</div>
              {layerTypes.map((type, i) => (
                <Field key={i} label={`${layerLabel(type, i, layerTypes)}${type === "flute" ? " (fluting medium)" : ""}`}>
                  <input
                    className="bc-input"
                    style={styles.inputSm}
                    type="number"
                    value={form.layerGsms[i] ?? ""}
                    onChange={(e) => updateLayerGsm(i, e.target.value)}
                  />
                </Field>
              ))}
              <Field label="Weight addition (g)">
                <input className="bc-input" style={styles.inputSm} type="number" value={form.weightAddition}
                  onChange={(e) => updateField("weightAddition", e.target.value)} />
              </Field>

              <div style={styles.divider} />
              <div style={styles.panelLabel}>COSTING (₹ per kg of finished box)</div>
              <div style={styles.dimRow}>
                {COST_FIELD_LABELS.slice(0, 3).map(([key, label]) => (
                  <Field key={key} label={label}>
                    <input className="bc-input" style={styles.inputSm} type="number" value={form.costComponents[key]}
                      onChange={(e) => updateCostField(key, e.target.value)} />
                  </Field>
                ))}
              </div>
              <div style={styles.dimRow}>
                {COST_FIELD_LABELS.slice(3, 6).map(([key, label]) => (
                  <Field key={key} label={label}>
                    <input className="bc-input" style={styles.inputSm} type="number" value={form.costComponents[key]}
                      onChange={(e) => updateCostField(key, e.target.value)} />
                  </Field>
                ))}
              </div>
              <div style={styles.dimRow}>
                {COST_FIELD_LABELS.slice(6, 9).map(([key, label]) => (
                  <Field key={key} label={label}>
                    <input className="bc-input" style={styles.inputSm} type="number" value={form.costComponents[key]}
                      onChange={(e) => updateCostField(key, e.target.value)} />
                  </Field>
                ))}
              </div>
              <div style={styles.dimRow}>
                {COST_FIELD_LABELS.slice(9, 10).map(([key, label]) => (
                  <Field key={key} label={label}>
                    <input className="bc-input" style={styles.inputSm} type="number" value={form.costComponents[key]}
                      onChange={(e) => updateCostField(key, e.target.value)} />
                  </Field>
                ))}
                <Field label="Total cost/kg (auto)">
                  <input className="bc-input" style={{ ...styles.inputSm, background: "#F0EEE6", fontWeight: 700 }} value={fmt(totalCostPerKg)} readOnly />
                </Field>
              </div>
              <button className="bc-btn" style={styles.linkBtn} onClick={resetCostsToDefault}>Reset to defaults</button>

              <div style={styles.divider} />
              <div style={styles.formActions}>
                <button className="bc-btn" style={styles.primaryBtn} onClick={saveOrder}>
                  {editingId ? "Update order" : "Save order"}
                </button>
                {editingId && (
                  <button className="bc-btn" style={styles.ghostBtn} onClick={cancelEdit}>Cancel edit</button>
                )}
              </div>
            </div>

            {/* RIGHT: diagram + results */}
            <div style={styles.panel}>
              <div style={styles.panelLabel}>BOARD LAYOUT</div>
              <svg width="100%" height="300" viewBox="0 0 380 300" style={{ overflow: "visible" }}>
                <defs>
                  <pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
                    <line x1="0" y1="0" x2="0" y2="6" stroke="#C98A4B" strokeWidth="1.4" />
                  </pattern>
                </defs>
                {(() => {
                  const ox = 55, oy = 20;
                  const { bw, bh, bandH, trimH } = diagram;
                  const bands = [];
                  for (let i = 0; i < nUp; i++) {
                    bands.push(
                      <rect key={i} x={ox} y={oy + i * bandH} width={bw} height={bandH}
                        fill={i % 2 === 0 ? "#EEF1F6" : "#E4E9F1"} stroke="#2B4C7E" strokeWidth="0.75" />
                    );
                  }
                  return (
                    <g fontFamily="'IBM Plex Mono', monospace">
                      <rect x={ox} y={oy} width={bw} height={bh} fill="#fff" stroke="#2B4C7E" strokeWidth="1.4" />
                      {bands}
                      <rect x={ox} y={oy + nUp * bandH} width={bw} height={trimH} fill="url(#hatch)" stroke="#2B4C7E" strokeWidth="0.75" />
                      {/* cutting size dimension line (top) */}
                      <line x1={ox} y1={oy - 12} x2={ox + bw} y2={oy - 12} stroke="#1B2A4A" strokeWidth="1" />
                      <line x1={ox} y1={oy - 16} x2={ox} y2={oy - 8} stroke="#1B2A4A" strokeWidth="1" />
                      <line x1={ox + bw} y1={oy - 16} x2={ox + bw} y2={oy - 8} stroke="#1B2A4A" strokeWidth="1" />
                      <text x={ox + bw / 2} y={oy - 20} textAnchor="middle" fontSize="11" fill="#1B2A4A" fontWeight="600">
                        {fmt(cuttingSize)} cm
                      </text>
                      {/* reel size dimension line (left) */}
                      <line x1={ox - 12} y1={oy} x2={ox - 12} y2={oy + bh} stroke="#1B2A4A" strokeWidth="1" />
                      <line x1={ox - 16} y1={oy} x2={ox - 8} y2={oy} stroke="#1B2A4A" strokeWidth="1" />
                      <line x1={ox - 16} y1={oy + bh} x2={ox - 8} y2={oy + bh} stroke="#1B2A4A" strokeWidth="1" />
                      <text x={ox - 20} y={oy + bh / 2} textAnchor="middle" fontSize="11" fill="#1B2A4A" fontWeight="600"
                        transform={`rotate(-90 ${ox - 20} ${oy + bh / 2})`}>
                        {fmt(reelSize)} cm
                      </text>
                      <text x={ox + bw + 10} y={oy + nUp * bandH + trimH / 2 + 3} fontSize="9" fill="#8A5A2B">trim</text>
                      <text x={ox + 4} y={oy + bandH / 2 + 3} fontSize="9" fill="#556077">box {nUp > 1 ? "1" : ""}</text>
                    </g>
                  );
                })()}
              </svg>

              <div style={styles.divider} />
              <div style={styles.resultsGrid}>
                <Result label="Reel size" value={`${fmt(reelSize)} cm`} />
                <Result label="Cutting size" value={`${fmt(cuttingSize)} cm`} />
                <Result label="Board size" value={`${fmt(reelSize)} × ${fmt(cuttingSize)} cm`} big />
                <Result
                  label={`Boards required (${nUp}-up)`}
                  value={boardsRequired !== null ? `${boardsRequired}` : "Enter quantity"}
                  big
                />
                <Result label="Total GSM" value={`${fmt(totalGsm)}`} />
                <Result label="Weight per box" value={`${fmt(weightPerBox)} g`} big />
                <Result
                  label="Total order weight"
                  value={qtyNum > 0 ? `${fmt((weightPerBox * qtyNum) / 1000)} kg` : "Enter quantity"}
                  big
                />
                <Result label="Cost per box" value={`₹${fmt(costPerBox)}`} big />
                <Result
                  label="Total order cost"
                  value={totalOrderCost !== null ? `₹${fmt(totalOrderCost)}` : "Enter quantity"}
                  big
                />
              </div>

              <div style={styles.divider} />
              <div style={styles.panelLabel}>COMPARE N-UP</div>
              <table style={styles.table}>
                <thead>
                  <tr>
                    <th style={styles.th}>N-up</th>
                    <th style={styles.th}>Reel</th>
                    <th style={styles.th}>Cutting</th>
                    <th style={styles.th}>Board size</th>
                    <th style={styles.th}>Boards needed</th>
                  </tr>
                </thead>
                <tbody>
                  {comparisonRows.map((r) => (
                    <tr key={r.n} style={r.n === nUp ? styles.trHighlight : undefined}>
                      <td style={styles.td}>{r.n}</td>
                      <td style={styles.td}>{fmt(r.reelSize)}</td>
                      <td style={styles.td}>{fmt(r.cuttingSize)}</td>
                      <td style={styles.td}>{r.board}</td>
                      <td style={styles.tdMono}>{r.boardsNeeded !== null ? r.boardsNeeded : "—"}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        )}

        {tab === "orders" && (
          <div style={styles.panel}>
            <div style={styles.ordersHeader}>
              <div style={styles.panelLabel}>ORDERS</div>
              <input
                className="bc-input"
                style={styles.searchInput}
                placeholder="Search customer or item…"
                value={search}
                onChange={(e) => setSearch(e.target.value)}
              />
            </div>
            {loading ? (
              <div style={styles.emptyState}>Loading…</div>
            ) : filteredOrders.length === 0 ? (
              <div style={styles.emptyState}>
                {orders.length === 0
                  ? "No orders yet. Use the Calculator tab to size a box and save it here."
                  : "No orders match your search."}
              </div>
            ) : (
              <div style={{ overflowX: "auto" }}>
                <table style={styles.table}>
                  <thead>
                    <tr>
                      <th style={styles.th}>Customer</th>
                      <th style={styles.th}>Item</th>
                      <th style={styles.th}>L×W×H</th>
                      <th style={styles.th}>Ply</th>
                      <th style={styles.th}>Qty</th>
                      <th style={styles.th}>N-up</th>
                      <th style={styles.th}>Board size</th>
                      <th style={styles.th}>Boards</th>
                      <th style={styles.th}>Wt/box</th>
                      <th style={styles.th}>Cost/box</th>
                      <th style={styles.th}>Total cost</th>
                      <th style={styles.th}>Date</th>
                      <th style={styles.th}></th>
                    </tr>
                  </thead>
                  <tbody>
                    {filteredOrders.map((o) => (
                      <tr key={o.id} className="bc-row">
                        <td style={styles.td}>{o.customerName}</td>
                        <td style={styles.td}>{o.itemName}</td>
                        <td style={styles.td}>{o.L}×{o.W}×{o.H}</td>
                        <td style={styles.td}>{o.ply}-ply</td>
                        <td style={styles.td}>{o.qty}</td>
                        <td style={styles.td}>{o.nUp}</td>
                        <td style={styles.tdMono}>{fmt(o.reelSizeCm)} × {fmt(o.cuttingSizeCm)}</td>
                        <td style={styles.tdMono}>{o.boardsRequired ?? "—"}</td>
                        <td style={styles.tdMono}>{o.weightPerBoxG ? `${fmt(o.weightPerBoxG)} g` : "—"}</td>
                        <td style={styles.tdMono}>{o.costPerBox ? `₹${fmt(o.costPerBox)}` : "—"}</td>
                        <td style={styles.tdMono}>{o.totalOrderCost ? `₹${fmt(o.totalOrderCost)}` : "—"}</td>
                        <td style={styles.td}>{new Date(o.date).toLocaleDateString()}</td>
                        <td style={styles.td}>
                          <button className="bc-btn" style={styles.linkBtn} onClick={() => editOrder(o)}>Edit</button>
                          {confirmDelete === o.id ? (
                            <span>
                              <button className="bc-btn" style={styles.linkBtnDanger} onClick={() => deleteOrder(o.id)}>Confirm</button>
                              <button className="bc-btn" style={styles.linkBtn} onClick={() => setConfirmDelete(null)}>Cancel</button>
                            </span>
                          ) : (
                            <button className="bc-btn" style={styles.linkBtnDanger} onClick={() => setConfirmDelete(o.id)}>Delete</button>
                          )}
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        )}
      </main>
    </div>
  );
}

function Field({ label, children }) {
  return (
    <label style={styles.field}>
      <span style={styles.fieldLabel}>{label}</span>
      {children}
    </label>
  );
}

function Result({ label, value, big }) {
  return (
    <div style={styles.resultCell}>
      <div style={styles.resultLabel}>{label}</div>
      <div style={{ ...styles.resultValue, ...(big ? styles.resultValueBig : {}) }}>{value}</div>
    </div>
  );
}
