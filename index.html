const SHAPE_CATEGORIES = ["Basic Shapes", "Stars", "Arrows", "Lines"];

function sanitizeSvgText(svgText) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(svgText, "image/svg+xml");
  if (doc.querySelector("parsererror")) {
    throw new Error("That SVG file couldn't be read");
  }
  doc.querySelectorAll("script").forEach((el) => el.remove());
  doc.querySelectorAll("foreignObject").forEach((el) => el.remove());
  doc.querySelectorAll("*").forEach((el) => {
    [...el.attributes].forEach((attr) => {
      const name = attr.name.toLowerCase();
      if (name.startsWith("on")) {
        el.removeAttribute(attr.name);
        return;
      }
      if (name === "href" || name === "xlink:href") {
        const val = attr.value.trim();
        if (/^(https?:)?\/\//i.test(val) || /^javascript:/i.test(val) || /^data:(?!image\/)/i.test(val)) {
          el.removeAttribute(attr.name);
        }
      }
    });
  });
  doc.querySelectorAll("style").forEach((el) => {
    if (/@import/i.test(el.textContent || "")) el.remove();
  });
  const root = doc.documentElement;
  if (!root || root.nodeName.toLowerCase() !== "svg") {
    throw new Error("That file doesn't look like a valid SVG");
  }
  return new XMLSerializer().serializeToString(root);
}

// Reads an uploaded image file. PNGs get resized to a sane max dimension and
// compressed — keeps things well under Firestore's ~1MB document limit
// without needing any external file storage. SVGs get sanitized and kept as
// real vector data, so they stay sharp at any size.
function processUploadedImage(file) {
  return new Promise((resolve, reject) => {
    const isSvg = file.type === "image/svg+xml" || /\.svg$/i.test(file.name || "");

    if (isSvg) {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error("Could not read the file"));
      reader.onload = () => {
        let sanitized;
        try {
          sanitized = sanitizeSvgText(String(reader.result));
        } catch (err) {
          reject(err);
          return;
        }
        const dataUrl = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(sanitized);
        const img = new Image();
        img.onerror = () => reject(new Error("Could not read that SVG"));
        img.onload = () => {
          let w = img.naturalWidth, h = img.naturalHeight;
          if (!w || !h) {
            const vb = sanitized.match(/viewBox=["']([^"']+)["']/i);
            if (vb) {
              const parts = vb[1].trim().split(/\s+/).map(Number);
              if (parts.length === 4 && parts[2] > 0 && parts[3] > 0) { w = parts[2]; h = parts[3]; }
            }
          }
          resolve({ dataUrl, aspectRatio: (w && h) ? w / h : 1, isVector: true });
        };
        img.src = dataUrl;
      };
      reader.readAsText(file);
      return;
    }

    const isHeic = /\.(heic|heif)$/i.test(file.name || "") || file.type === "image/heic" || file.type === "image/heif";
    if (isHeic) {
      reject(new Error("HEIC/HEIF photos (common on iPhone) can't be read by most browsers. Please convert it to JPEG first, or set your phone's camera to save photos as JPEG."));
      return;
    }
    const ACCEPTED_RASTER_TYPES = ["image/png", "image/jpeg", "image/webp", "image/gif", "image/bmp"];
    if (!ACCEPTED_RASTER_TYPES.includes(file.type)) {
      reject(new Error("Please upload a PNG, JPG, WebP, GIF, BMP, or SVG file"));
      return;
    }
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("Could not read the file"));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("Could not read the image"));
      img.onload = () => {
        const MAX_DIM = 900;
        let w = img.naturalWidth, h = img.naturalHeight;
        if (w > MAX_DIM || h > MAX_DIM) {
          const scale = MAX_DIM / Math.max(w, h);
          w = Math.round(w * scale);
          h = Math.round(h * scale);
        }
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        const dataUrl = canvas.toDataURL("image/png");
        resolve({ dataUrl, aspectRatio: w / h, isVector: false });
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function wrapTextLines(ctx, text, maxWidth) {
  const paragraphs = text.split("\n");
  const lines = [];
  paragraphs.forEach((para) => {
    const words = para.split(/\s+/).filter(Boolean);
    if (words.length === 0) {
      lines.push(""); // preserve intentional blank lines
      return;
    }
    let current = "";
    words.forEach((word) => {
      const test = current ? current + " " + word : word;
      if (current && ctx.measureText(test).width > maxWidth) {
        lines.push(current);
        current = word;
      } else {
        current = test;
      }
    });
    if (current) lines.push(current);
  });
  return lines.length ? lines : [text];
}

// Computes the wrapped-line layout for a text item — shared by drawing and hit-testing
// Shared across every canvas (3D texture and the 2D panel editor) — avoids
// reloading the same uploaded image repeatedly. Supports multiple independent
// "notify me when ready" callbacks per image, since both the 3D preview and
// the 2D Workspace request the same image and each needs its own redraw.
const IMAGE_CACHE = new Map(); // src -> { img, loaded, listeners }
function getImageEl(src, onLoad) {
  let entry = IMAGE_CACHE.get(src);
  if (!entry) {
    const img = new Image();
    entry = { img, loaded: false, listeners: new Set() };
    img.onload = () => {
      entry.loaded = true;
      entry.listeners.forEach((fn) => fn());
      entry.listeners.clear();
    };
    img.src = src;
    IMAGE_CACHE.set(src, entry);
  }
  if (onLoad && !entry.loaded) entry.listeners.add(onLoad);
  return entry;
}

// Recolors a PNG to a single flat ink color, using its own transparency as the
// shape mask — for single-tone printing, where the source file's original
// colors don't matter, only its silhouette does.
const RECOLOR_CACHE = new Map(); // `${src}|${color}` -> { canvas, ready, listeners }
function getRecoloredImage(src, color, onReady) {
  const key = `${src}|${color}`;
  let entry = RECOLOR_CACHE.get(key);
  if (!entry) {
    entry = { canvas: null, ready: false, listeners: new Set() };
    RECOLOR_CACHE.set(key, entry);
    const build = (base) => {
      const c = document.createElement("canvas");
      c.width = base.naturalWidth;
      c.height = base.naturalHeight;
      const cctx = c.getContext("2d");
      cctx.drawImage(base, 0, 0);
      cctx.globalCompositeOperation = "source-in";
      cctx.fillStyle = color;
      cctx.fillRect(0, 0, c.width, c.height);
      entry.canvas = c;
      entry.ready = true;
      entry.listeners.forEach((fn) => fn());
      entry.listeners.clear();
    };
    const base = getImageEl(src, () => build(base.img));
    if (base.loaded) build(base.img);
  }
  if (onReady && !entry.ready) entry.listeners.add(onReady);
  return entry;
}

// Resolves whichever drawable source (original image or recolored canvas) an
// image item should use, based on its "use single ink color" setting.
function resolveImageDrawable(cfg, onReady) {
  if (cfg.useInkColor) {
    const entry = getRecoloredImage(cfg.src, cfg.inkColor || "#1B2A4A", onReady);
    return { drawable: entry.canvas, ready: entry.ready };
  }
  const entry = getImageEl(cfg.src, onReady);
  return { drawable: entry.img, ready: entry.loaded };
}

// Returns the on-canvas footprint of any item (text or image), so hit-testing,
// dragging, and smart guides can treat both uniformly.
// Every stored font size assumes a 512px-wide reference canvas (matching the
// 2D panel editor). This scales it correctly for any actual canvas width —
// e.g. a higher-resolution 3D texture — without changing the relative size
// the customer sees.
function scaledFontSize(cfg, canvasWidth) {
  return (Number(cfg.size) || 48) * (canvasWidth / 512);
}

function getItemBlockSize(ctx, item, canvasWidth) {
  if (item.type === "image") {
    const w = Math.max(0.05, Math.min(0.95, Number(item.widthFrac) || 0.4)) * canvasWidth;
    const h = item.heightFrac != null
      ? Math.max(0.05, Math.min(0.95, Number(item.heightFrac))) * canvasWidth
      : w / (item.aspectRatio || 1);
    return { blockWidth: w, blockHeight: h, maxWidth: w };
  }
  return measureWrappedText(ctx, item, canvasWidth);
}

function measureWrappedText(ctx, cfg, canvasWidth) {
  const text = (cfg && cfg.text || "").trim();
  const style = cfg.style === "italic" ? "italic" : "normal";
  const weight = cfg.style === "bold" ? "700" : "400";
  const size = scaledFontSize(cfg, canvasWidth);
  ctx.font = `${style} ${weight} ${size}px ${cfg.font || "Arial, sans-serif"}`;
  const widthFraction = Math.max(0.15, Math.min(0.95, Number(cfg.boxWidth) || 0.75));
  const maxWidth = widthFraction * canvasWidth;
  const lines = text ? wrapTextLines(ctx, text, maxWidth) : [];
  const lineHeight = size * 1.2;
  const blockWidth = Math.min(maxWidth, Math.max(0, ...lines.map((l) => ctx.measureText(l).width)));
  const blockHeight = lines.length * lineHeight;
  return { lines, size, lineHeight, blockWidth, blockHeight, maxWidth };
}

// With Length now on the same axis used for Top/Bottom's natural horizontal
// direction, no per-face rotation correction is needed anymore — 0° reads as
// horizontal on every face, including Top/Bottom.
function faceTextRotationOffsetDeg(face) {
  return 0;
}

// Box surface style options — box color paired with a suitable scene background
// Real-world area (cm²) of a given box face, based on external L/W/H
function faceAreaCm2(face, L, W, H) {
  if (face === "front" || face === "back") return (L || 0) * (H || 0);
  if (face === "left" || face === "right") return (W || 0) * (H || 0);
  return (W || 0) * (L || 0); // top/bottom
}

// A simple unfolded box-net diagram (cross layout), highlighting one face —
// helps the customer identify which side is which without ambiguity.
function BoxNetIcon({ highlight }) {
  const cw = 15, ch = 11, gap = 1.5;
  const cells = {
    top: { col: 1, row: 0 },
    left: { col: 0, row: 1 },
    front: { col: 1, row: 1 },
    right: { col: 2, row: 1 },
    back: { col: 3, row: 1 },
    bottom: { col: 1, row: 2 },
  };
  return (
    <svg width="46" height="36" viewBox="0 0 46 36">
      {Object.entries(cells).map(([face, pos]) => (
        <rect
          key={face}
          x={pos.col * (cw + gap)} y={pos.row * (ch + gap)}
          width={cw} height={ch} rx="2"
          fill={face === highlight ? "#1B2A4A" : "#F2F3F5"}
          stroke="#C7CCD6" strokeWidth="1"
        />
      ))}
    </svg>
  );
}

const BOX_STYLE_COLORS = {
  none: { boxHex: "#e4e6ea", borderHex: "#c7ccd6", sceneBg: 0xf7f7f8 },
  white: { boxHex: "#ffffff", borderHex: "#d8dade", sceneBg: 0x1b2a4a },
  kraft: { boxHex: "#c49a6c", borderHex: "#a87d51", sceneBg: 0xffffff },
};
function boxStyleColors(boxStyle) {
  return BOX_STYLE_COLORS[boxStyle] || BOX_STYLE_COLORS.none;
}

function drawFaceCanvas(canvas, items, face, guides, onImageLoad, boxStyle, overrideBoxHex) {
  const ctx = canvas.getContext("2d");
  const colors = boxStyleColors(boxStyle);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = overrideBoxHex || colors.boxHex;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = colors.borderHex;
  ctx.lineWidth = 4;
  ctx.strokeRect(2, 2, canvas.width - 4, canvas.height - 4);
  const offsetDeg = faceTextRotationOffsetDeg(face);
  (items || []).forEach((cfg) => {
    const px = (cfg.posX ?? 0.5) * canvas.width;
    const py = (cfg.posY ?? 0.5) * canvas.height;
    const rotationRad = ((Number(cfg.rotation) || 0) + offsetDeg) * Math.PI / 180;

    if (cfg.type === "image") {
      const { drawable, ready } = resolveImageDrawable(cfg, onImageLoad);
      if (!ready) return;
      const w = Math.max(0.05, Math.min(0.95, Number(cfg.widthFrac) || 0.4)) * canvas.width;
      const h = cfg.heightFrac != null
        ? Math.max(0.05, Math.min(0.95, Number(cfg.heightFrac))) * canvas.width
        : w / (cfg.aspectRatio || 1);
      ctx.save();
      ctx.translate(px, py);
      ctx.rotate(rotationRad);
      ctx.scale(cfg.flipX ? -1 : 1, cfg.flipY ? -1 : 1);
      ctx.drawImage(drawable, -w / 2, -h / 2, w, h);
      ctx.restore();
      return;
    }

    const text = (cfg && cfg.text || "").trim();
    if (!text) return;
    const style = cfg.style === "italic" ? "italic" : "normal";
    const weight = cfg.style === "bold" ? "700" : "400";
    ctx.font = `${style} ${weight} ${scaledFontSize(cfg, canvas.width)}px ${cfg.font || "Arial, sans-serif"}`;
    const { lines, lineHeight, maxWidth } = measureWrappedText(ctx, cfg, canvas.width);
    const align = cfg.align || "center";
    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(rotationRad);
    ctx.scale(cfg.flipX ? -1 : 1, cfg.flipY ? -1 : 1);
    ctx.fillStyle = cfg.color || "#1B2A4A";
    ctx.textBaseline = "middle";
    ctx.textAlign = align === "left" ? "left" : align === "right" ? "right" : "center";
    const lineX = align === "left" ? -maxWidth / 2 : align === "right" ? maxWidth / 2 : 0;
    const totalHeight = lines.length * lineHeight;
    lines.forEach((line, i) => {
      const y = -totalHeight / 2 + lineHeight / 2 + i * lineHeight;
      ctx.fillText(line, lineX, y, maxWidth);
    });
    ctx.restore();
  });
  (guides || []).forEach((g) => {
    ctx.save();
    ctx.strokeStyle = "#FF3B9A";
    ctx.lineWidth = 2;
    ctx.setLineDash([7, 5]);
    ctx.beginPath();
    if (g.axis === "x") {
      ctx.moveTo(g.pos, 0);
      ctx.lineTo(g.pos, canvas.height);
    } else {
      ctx.moveTo(0, g.pos);
      ctx.lineTo(canvas.width, g.pos);
    }
    ctx.stroke();
    ctx.restore();
  });
}

// Compares a dragged text's tentative box against the face boundary and every
// other text on the face; snaps its position when close to an aligned edge or
// center, and returns which guide lines to draw for that snap.
const SMART_GUIDE_SNAP_PX = 7;
function computeSmartGuideSnap(dragCenterX, dragCenterY, halfW, halfH, targets) {
  const dragLeft = dragCenterX - halfW, dragRight = dragCenterX + halfW;
  const dragTop = dragCenterY - halfH, dragBottom = dragCenterY + halfH;

  let bestXDelta = null, bestXPos = null, snappedX = dragCenterX;
  let bestYDelta = null, bestYPos = null, snappedY = dragCenterY;

  targets.forEach((t) => {
    const xCandidates = [
      { drag: dragLeft, target: t.left, newCenter: t.left + halfW },
      { drag: dragRight, target: t.right, newCenter: t.right - halfW },
      { drag: dragCenterX, target: t.centerX, newCenter: t.centerX },
    ];
    xCandidates.forEach((c) => {
      const delta = Math.abs(c.drag - c.target);
      if (delta <= SMART_GUIDE_SNAP_PX && (bestXDelta === null || delta < bestXDelta)) {
        bestXDelta = delta;
        bestXPos = c.target;
        snappedX = c.newCenter;
      }
    });
    const yCandidates = [
      { drag: dragTop, target: t.top, newCenter: t.top + halfH },
      { drag: dragBottom, target: t.bottom, newCenter: t.bottom - halfH },
      { drag: dragCenterY, target: t.centerY, newCenter: t.centerY },
    ];
    yCandidates.forEach((c) => {
      const delta = Math.abs(c.drag - c.target);
      if (delta <= SMART_GUIDE_SNAP_PX && (bestYDelta === null || delta < bestYDelta)) {
        bestYDelta = delta;
        bestYPos = c.target;
        snappedY = c.newCenter;
      }
    });
  });

  const guides = [];
  if (bestXPos !== null) guides.push({ axis: "x", pos: bestXPos });
  if (bestYPos !== null) guides.push({ axis: "y", pos: bestYPos });
  return { x: snappedX, y: snappedY, guides };
}

// Detects when the dragged item sits between two other items with roughly-equal
// gaps on either side, and snaps it so those gaps become exactly equal —
// mirrors Figma/Canva's "equal spacing" indicator.
function computeEqualSpacingSnap(dragLeft, dragRight, dragTop, dragBottom, others) {
  const THRESH = SMART_GUIDE_SNAP_PX;
  let dx = 0, dy = 0;
  const spacingGuides = [];

  // Horizontal: nearest neighbor whose right edge is left of the dragged item,
  // and nearest neighbor whose left edge is right of it.
  let leftN = null, rightN = null;
  others.forEach((o) => {
    if (o.right <= dragRight && (!leftN || o.right > leftN.right)) leftN = o;
    if (o.left >= dragLeft && (!rightN || o.left < rightN.left)) rightN = o;
  });
  if (leftN && rightN && leftN !== rightN) {
    const gapLeft = dragLeft - leftN.right;
    const gapRight = rightN.left - dragRight;
    if (gapLeft > 0 && gapRight > 0 && Math.abs(gapLeft - gapRight) <= THRESH) {
      const avgGap = (gapLeft + gapRight) / 2;
      dx = (leftN.right + avgGap) - dragLeft;
      const midY = (Math.max(leftN.top, dragTop) + Math.min(leftN.bottom, dragBottom)) / 2 || (dragTop + dragBottom) / 2;
      spacingGuides.push({ type: "spacing", x1: leftN.right, x2: dragLeft + dx, y: midY });
      spacingGuides.push({ type: "spacing", x1: dragRight + dx, x2: rightN.left, y: midY });
    }
  }

  // Vertical: same idea, top/bottom neighbors
  let topN = null, bottomN = null;
  others.forEach((o) => {
    if (o.bottom <= dragBottom && (!topN || o.bottom > topN.bottom)) topN = o;
    if (o.top >= dragTop && (!bottomN || o.top < bottomN.top)) bottomN = o;
  });
  if (topN && bottomN && topN !== bottomN) {
    const gapTop = dragTop - topN.bottom;
    const gapBottom = bottomN.top - dragBottom;
    if (gapTop > 0 && gapBottom > 0 && Math.abs(gapTop - gapBottom) <= THRESH) {
      const avgGap = (gapTop + gapBottom) / 2;
      dy = (topN.bottom + avgGap) - dragTop;
      const midX = (Math.max(topN.left, dragLeft) + Math.min(topN.right, dragRight)) / 2 || (dragLeft + dragRight) / 2;
      spacingGuides.push({ type: "spacing-v", y1: topN.bottom, y2: dragTop + dy, x: midX });
      spacingGuides.push({ type: "spacing-v", y1: dragBottom + dy, y2: bottomN.top, x: midX });
    }
  }

  return { dx, dy, spacingGuides };
}

// Target camera angles (theta, phi) to look straight at each face
const FACE_VIEW_ANGLES = {
  front: { theta: 0, phi: Math.PI / 2 },
  back: { theta: Math.PI, phi: Math.PI / 2 },
  right: { theta: Math.PI / 2, phi: Math.PI / 2 },
  left: { theta: -Math.PI / 2, phi: Math.PI / 2 },
  top: { theta: 0, phi: 0.05 },
  bottom: { theta: 0, phi: Math.PI - 0.05 },
};

// Pure live-preview 3D box — drag to rotate, scroll to zoom, and it auto-orients
// to whichever face is selected. All artwork editing happens in the 2D panel
// editor; this view only ever reflects that data, it's never edited directly.
// The primary artwork editing surface — a flat 2D view of one panel, matching
// the 512x512 reference space used for the 3D texture pixel-for-pixel, so
// nothing needs separate scale bookkeeping between the two views. Supports
// click-to-select, drag-to-move, a rotate handle, and a resize handle —
// Canva/Figma-style direct manipulation, with a visible printable-safe-area
// guide and a warning when artwork extends past it.
// A focused crop tool for an uploaded image — drag the rectangle to move it,
// drag any corner to resize it, then Apply Crop replaces the image with just
// that region. Tracks the crop box as fractions (0–1) of the image's own
// rendered size, measured fresh on every interaction — so it stays correct
// no matter what size the browser actually renders the image at.
// Makes pixels close to a chosen color transparent — a simple, fully
// client-side "magic wand" style background removal. Works best on a plain,
// solid-color background; a soft-edge falloff avoids a harsh cutout line.
function removeBackgroundColor(imgEl, targetColor, tolerancePct) {
  const canvas = document.createElement("canvas");
  canvas.width = imgEl.naturalWidth;
  canvas.height = imgEl.naturalHeight;
  const ctx = canvas.getContext("2d");
  ctx.drawImage(imgEl, 0, 0);
  const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const data = imageData.data;
  const [tr, tg, tb] = targetColor;
  const maxDist = Math.sqrt(3 * 255 * 255);
  const threshold = (tolerancePct / 100) * maxDist;
  const softEdge = Math.max(4, threshold * 0.3);

  for (let i = 0; i < data.length; i += 4) {
    const dr = data[i] - tr, dg = data[i + 1] - tg, db = data[i + 2] - tb;
    const dist = Math.sqrt(dr * dr + dg * dg + db * db);
    if (dist < threshold - softEdge) {
      data[i + 3] = 0;
    } else if (dist < threshold) {
      const t = (dist - (threshold - softEdge)) / softEdge;
      data[i + 3] = Math.round(data[i + 3] * t);
    }
  }
  ctx.putImageData(imageData, 0, 0);
  return canvas;
}

// Converts an image to flat single-tone artwork based on brightness — pixels
// darker than the threshold become solid ink color, lighter ones become
// transparent. Unlike color-based background removal, this reads light vs.
// dark, so it works on busy/photographic images, not just plain backgrounds.
function applyThreshold(imgEl, thresholdPct, color) {
  const canvas = document.createElement("canvas");
  canvas.width = imgEl.naturalWidth;
  canvas.height = imgEl.naturalHeight;
  const ctx = canvas.getContext("2d");
  ctx.drawImage(imgEl, 0, 0);
  const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const data = imageData.data;
  const [cr, cg, cb] = color;
  const threshold = (thresholdPct / 100) * 255;
  const softEdge = 22;

  for (let i = 0; i < data.length; i += 4) {
    const lum = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
    let a;
    if (lum <= threshold - softEdge) a = 255;
    else if (lum >= threshold + softEdge) a = 0;
    else a = Math.round(255 * ((threshold + softEdge - lum) / (2 * softEdge)));
    const finalAlpha = Math.round((a / 255) * data[i + 3]);
    data[i] = cr; data[i + 1] = cg; data[i + 2] = cb; data[i + 3] = finalAlpha;
  }
  ctx.putImageData(imageData, 0, 0);
  return canvas;
}

function AutoThresholdModal({ item, onApply, onCancel }) {
  const previewCanvasRef = useRef(null);
  const imgElRef = useRef(null);
  const [imgLoaded, setImgLoaded] = useState(false);
  const [displaySize, setDisplaySize] = useState({ w: 380, h: 380 });
  const [threshold, setThreshold] = useState(50);
  const [inkColor, setInkColor] = useState("#1B2A4A");

  useEffect(() => {
    const img = new Image();
    img.onload = () => {
      const MAX = 380;
      let dw = MAX, dh = MAX * (img.naturalHeight / img.naturalWidth);
      if (dh > MAX) { dh = MAX; dw = MAX * (img.naturalWidth / img.naturalHeight); }
      setDisplaySize({ w: dw, h: dh });
      imgElRef.current = img;
      setImgLoaded(true);
    };
    img.src = item.src;
  }, [item.src]);

  useEffect(() => {
    if (!imgLoaded || !previewCanvasRef.current) return;
    const hex = inkColor.replace("#", "");
    const rgb = [parseInt(hex.slice(0, 2), 16), parseInt(hex.slice(2, 4), 16), parseInt(hex.slice(4, 6), 16)];
    const resultCanvas = applyThreshold(imgElRef.current, threshold, rgb);
    const pctx = previewCanvasRef.current.getContext("2d");
    previewCanvasRef.current.width = resultCanvas.width;
    previewCanvasRef.current.height = resultCanvas.height;
    pctx.clearRect(0, 0, resultCanvas.width, resultCanvas.height);
    const tile = 10;
    for (let y = 0; y < resultCanvas.height; y += tile) {
      for (let x = 0; x < resultCanvas.width; x += tile) {
        pctx.fillStyle = ((x / tile + y / tile) % 2 === 0) ? "#eee" : "#fff";
        pctx.fillRect(x, y, tile, tile);
      }
    }
    pctx.drawImage(resultCanvas, 0, 0);
  }, [imgLoaded, threshold, inkColor]);

  function apply() {
    const hex = inkColor.replace("#", "");
    const rgb = [parseInt(hex.slice(0, 2), 16), parseInt(hex.slice(2, 4), 16), parseInt(hex.slice(4, 6), 16)];
    const resultCanvas = applyThreshold(imgElRef.current, threshold, rgb);
    onApply(resultCanvas.toDataURL("image/png"), resultCanvas.width / resultCanvas.height);
  }

  return (
    <div className="cs-modal-overlay" onClick={onCancel}>
      <div className="cs-modal-card" onClick={(e) => e.stopPropagation()} style={{ maxWidth: 460 }}>
        <h3 style={{ margin: "0 0 8px", fontSize: 16, fontWeight: 700, color: "#1B2A4A" }}>Auto single-tone</h3>
        <p className="cs-sub" style={{ marginBottom: 14 }}>
          Turns this image into flat single-tone artwork based on light vs. dark — works even on busy photos,
          not just plain backgrounds. Adjust the slider to control how much becomes ink vs. transparent.
        </p>
        {imgLoaded && (
          <div style={{ display: "flex", gap: 16, flexWrap: "wrap" }}>
            <div>
              <div style={{ fontSize: 11, fontWeight: 600, color: "#6B7280", marginBottom: 6 }}>Original</div>
              <img src={item.src} alt="" style={{ width: displaySize.w, height: displaySize.h, display: "block", borderRadius: 8, border: "1px solid #ECEDF0" }} draggable={false} />
            </div>
            <div>
              <div style={{ fontSize: 11, fontWeight: 600, color: "#6B7280", marginBottom: 6 }}>Preview</div>
              <canvas ref={previewCanvasRef} style={{ width: displaySize.w, height: displaySize.h, display: "block", borderRadius: 8, border: "1px solid #ECEDF0" }} />
            </div>
          </div>
        )}

        <div className="cs-field" style={{ marginTop: 16 }}>
          <label className="cs-label">Ink color</label>
          <input type="color" value={inkColor} onChange={(e) => setInkColor(e.target.value)} className="cs-color-input" />
        </div>
        <div className="cs-field" style={{ marginTop: 12 }}>
          <label className="cs-label">Threshold ({threshold}%)</label>
          <input type="range" min="5" max="95" value={threshold} onChange={(e) => setThreshold(Number(e.target.value))} className="cs-rotation-slider" />
        </div>

        <div style={{ display: "flex", gap: 10, marginTop: 18, justifyContent: "flex-end" }}>
          <button type="button" className="cs-item-toolbar-btn" onClick={onCancel}>Cancel</button>
          <button type="button" className="cs-item-toolbar-btn" style={{ background: "#1B2A4A", color: "#fff", borderColor: "#1B2A4A" }} onClick={apply}>Apply</button>
        </div>
      </div>
    </div>
  );
}

// A small checklist for picking one or more of the other 5 faces to copy to.
// A popup shape library — category tabs across the top, click a shape to add
// it to the current face. Stays open so multiple shapes can be added at once.
// Converts a filled shape's SVG into an outline-only version (transparent
// inside, colored border). Not meaningful for Lines, which are already
// stroke-only.
function toOutlineShapeSvg(svg, strokeWidth) {
  return svg.replace(/fill="#000"/g, `fill="none" stroke="#000" stroke-width="${strokeWidth || 6}"`);
}

function ShapePickerModal({ onInsert, onClose }) {
  const [activeCategory, setActiveCategory] = useState(SHAPE_CATEGORIES[0]);

        <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 10 }}>

            </button>
          ))}
        </div>
        {showStyleToggle && (
          <div style={{ display: "flex", gap: 6, marginBottom: 14 }}>

              type="button" className="cs-icon-mode-btn"

              Filled

            <button

            </button>
          </div>
        )}

    </div>

}

function CopyToFaceModal({ currentFace, onConfirm, onCancel }) {
