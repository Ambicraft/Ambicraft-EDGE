function BackgroundRemovalModal({ item, onApply, onCancel }) {
  const previewCanvasRef = useRef(null);
  const imgElRef = useRef(null);
  const [imgLoaded, setImgLoaded] = useState(false);
  const [displaySize, setDisplaySize] = useState({ w: 400, h: 400 });
  const [targetColor, setTargetColor] = useState([255, 255, 255]);
  const [tolerance, setTolerance] = useState(28);

  useEffect(() => {
    const img = new Image();
    img.onload = () => {
      const MAX = 380;
      let dw = MAX, dh = MAX * (img.naturalHeight / img.naturalWidth);
      if (dh > MAX) { dh = MAX; dw = MAX * (img.naturalWidth / img.naturalHeight); }
      setDisplaySize({ w: dw, h: dh });
      imgElRef.current = img;
      // sample a corner pixel as a sensible starting guess for the background color
      const c = document.createElement("canvas");
      c.width = img.naturalWidth; c.height = img.naturalHeight;
      const cctx = c.getContext("2d");
      cctx.drawImage(img, 0, 0);
      const px = cctx.getImageData(0, 0, 1, 1).data;
      setTargetColor([px[0], px[1], px[2]]);
      setImgLoaded(true);
    };
    img.src = item.src;
  }, [item.src]);

  useEffect(() => {
    if (!imgLoaded || !previewCanvasRef.current) return;
    const resultCanvas = removeBackgroundColor(imgElRef.current, targetColor, tolerance);
    const pctx = previewCanvasRef.current.getContext("2d");
    previewCanvasRef.current.width = resultCanvas.width;
    previewCanvasRef.current.height = resultCanvas.height;
    pctx.clearRect(0, 0, resultCanvas.width, resultCanvas.height);
    // checkerboard so transparency is visible
    const tile = 10;
    for (let y = 0; y < resultCanvas.height; y += tile) {
      for (let x = 0; x < resultCanvas.width; x += tile) {
        pctx.fillStyle = ((x / tile + y / tile) % 2 === 0) ? "#eee" : "#fff";
        pctx.fillRect(x, y, tile, tile);
      }
    }
    pctx.drawImage(resultCanvas, 0, 0);
  }, [imgLoaded, targetColor, tolerance]);

  function handlePick(e) {
    const rect = e.target.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    const fracX = (clientX - rect.left) / rect.width;
    const fracY = (clientY - rect.top) / rect.height;
    const img = imgElRef.current;
    const c = document.createElement("canvas");
    c.width = img.naturalWidth; c.height = img.naturalHeight;
    const cctx = c.getContext("2d");
    cctx.drawImage(img, 0, 0);
    const px = cctx.getImageData(
      Math.min(img.naturalWidth - 1, Math.floor(fracX * img.naturalWidth)),
      Math.min(img.naturalHeight - 1, Math.floor(fracY * img.naturalHeight)),
      1, 1
    ).data;
    setTargetColor([px[0], px[1], px[2]]);
  }

  function apply() {
    const resultCanvas = removeBackgroundColor(imgElRef.current, targetColor, tolerance);
    onApply(resultCanvas.toDataURL("image/png"), resultCanvas.width / resultCanvas.height);
  }

  const swatchHex = `rgb(${targetColor[0]}, ${targetColor[1]}, ${targetColor[2]})`;

  return (
    <div className="cs-modal-overlay" onClick={onCancel}>
      <div className="cs-modal-card" onClick={(e) => e.stopPropagation()} style={{ maxWidth: 460 }}>
        <h3 style={{ margin: "0 0 8px", fontSize: 16, fontWeight: 700, color: "#1B2A4A" }}>Remove background</h3>
        <p className="cs-sub" style={{ marginBottom: 14 }}>
          Click anywhere on the background in the image below to pick that color — works best on a plain,
          solid-color background. Adjust the slider to fine-tune how much gets removed.
        </p>
        {imgLoaded && (
          <div style={{ display: "flex", gap: 16, flexWrap: "wrap" }}>
            <div>
              <div style={{ fontSize: 11, fontWeight: 600, color: "#6B7280", marginBottom: 6 }}>Click to pick background</div>
              <img
                src={item.src} alt=""
                style={{ width: displaySize.w, height: displaySize.h, display: "block", cursor: "crosshair", borderRadius: 8, border: "1px solid #ECEDF0" }}
                onClick={handlePick}
                draggable={false}
              />
            </div>
            <div>
              <div style={{ fontSize: 11, fontWeight: 600, color: "#6B7280", marginBottom: 6 }}>Preview</div>
              <canvas
                ref={previewCanvasRef}
                style={{ width: displaySize.w, height: displaySize.h, display: "block", borderRadius: 8, border: "1px solid #ECEDF0" }}
              />
            </div>
          </div>
        )}

        <div style={{ display: "flex", alignItems: "center", gap: 10, marginTop: 16 }}>
          <span style={{ width: 22, height: 22, borderRadius: 5, background: swatchHex, border: "1px solid #D8DAE0", flexShrink: 0 }} />
          <span style={{ fontSize: 12, color: "#6B7280" }}>Picked color</span>
        </div>

        <div className="cs-field" style={{ marginTop: 12 }}>
          <label className="cs-label">Tolerance ({tolerance}%)</label>
          <input
            type="range" min="2" max="80" value={tolerance}
            onChange={(e) => setTolerance(Number(e.target.value))}
            className="cs-rotation-slider"
          />
        </div>

        <div style={{ display: "flex", gap: 10, marginTop: 18, justifyContent: "flex-end" }}>
          <button type="button" className="cs-item-toolbar-btn" onClick={onCancel}>Cancel</button>
          <button
            type="button"
            className="cs-item-toolbar-btn"
            style={{ background: "#1B2A4A", color: "#fff", borderColor: "#1B2A4A" }}
            onClick={apply}
          >
            Apply
          </button>
        </div>
      </div>
    </div>
  );
}

function ImageCropModal({ item, onApply, onCancel }) {
  const containerRef = useRef(null);
  const imgElRef = useRef(null);
  const [imgLoaded, setImgLoaded] = useState(false);
  const [naturalSize, setNaturalSize] = useState({ w: 1, h: 1 });
  // rect is in fractions of the rendered image box: 0–1 for x/y/w/h
  const [rect, setRect] = useState({ x: 0.1, y: 0.1, w: 0.8, h: 0.8 });
  const dragRef = useRef(null);

  useEffect(() => {
    const img = new Image();
    img.onload = () => {
      setNaturalSize({ w: img.naturalWidth, h: img.naturalHeight });
      setImgLoaded(true);
    };
    img.src = item.src;
    imgElRef.current = img;
  }, [item.src]);

  function fracPos(e) {
    const r = containerRef.current.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: (clientX - r.left) / r.width, y: (clientY - r.top) / r.height };
  }

  function handlePointerDown(e, mode) {
    e.stopPropagation();
    e.preventDefault();
    const p = fracPos(e);
    dragRef.current = { mode, startX: p.x, startY: p.y, startRect: { ...rect } };
  }
  function handlePointerMove(e) {
    if (!dragRef.current) return;
    const p = fracPos(e);
    const dx = p.x - dragRef.current.startX, dy = p.y - dragRef.current.startY;
    const sr = dragRef.current.startRect;
    const mode = dragRef.current.mode;
    const MIN = 0.06;
    let next = { ...sr };
    if (mode === "move") {
      next.x = Math.max(0, Math.min(1 - sr.w, sr.x + dx));
      next.y = Math.max(0, Math.min(1 - sr.h, sr.y + dy));
    } else if (mode === "br") {
      next.w = Math.max(MIN, Math.min(1 - sr.x, sr.w + dx));
      next.h = Math.max(MIN, Math.min(1 - sr.y, sr.h + dy));
    } else if (mode === "tl") {
      const newX = Math.max(0, Math.min(sr.x + sr.w - MIN, sr.x + dx));
      const newY = Math.max(0, Math.min(sr.y + sr.h - MIN, sr.y + dy));
      next.w = sr.w + (sr.x - newX);
      next.h = sr.h + (sr.y - newY);
      next.x = newX; next.y = newY;
    } else if (mode === "tr") {
      const newY = Math.max(0, Math.min(sr.y + sr.h - MIN, sr.y + dy));
      next.h = sr.h + (sr.y - newY);
      next.y = newY;
      next.w = Math.max(MIN, Math.min(1 - sr.x, sr.w + dx));
    } else if (mode === "bl") {
      const newX = Math.max(0, Math.min(sr.x + sr.w - MIN, sr.x + dx));
      next.w = sr.w + (sr.x - newX);
      next.x = newX;
      next.h = Math.max(MIN, Math.min(1 - sr.y, sr.h + dy));
    }
    setRect(next);
  }
  function handlePointerUp() { dragRef.current = null; }

  function apply() {
    const sx = rect.x * naturalSize.w, sy = rect.y * naturalSize.h;
    const sw = rect.w * naturalSize.w, sh = rect.h * naturalSize.h;
    const canvas = document.createElement("canvas");
    canvas.width = Math.max(1, Math.round(sw));
    canvas.height = Math.max(1, Math.round(sh));
    const ctx = canvas.getContext("2d");
    ctx.drawImage(imgElRef.current, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
    onApply(canvas.toDataURL("image/png"), canvas.width / canvas.height);
  }

  const handleStyle = (corner) => ({
    position: "absolute", width: 16, height: 16, background: "#fff",
    border: "2.5px solid #1B2A4A", borderRadius: "50%",
    cursor: corner === "tl" || corner === "br" ? "nwse-resize" : "nesw-resize",
    top: corner.includes("t") ? -8 : undefined, bottom: corner.includes("b") ? -8 : undefined,
    left: corner.includes("l") ? -8 : undefined, right: corner.includes("r") ? -8 : undefined,
  });

  const aspect = naturalSize.w / naturalSize.h;

  return (
    <div className="cs-modal-overlay" onClick={onCancel}>
      <div className="cs-modal-card" onClick={(e) => e.stopPropagation()}>
        <h3 style={{ margin: "0 0 14px", fontSize: 16, fontWeight: 700, color: "#1B2A4A" }}>Crop image</h3>
        {item.isVector && (
          <div className="cs-print-warning" style={{ marginBottom: 14, background: "#FFF6E6", borderColor: "#F0D9A0", color: "#8A6416" }}>
            This is a vector (SVG) image — cropping it will convert it into a flattened PNG.
          </div>
        )}
        {imgLoaded && (
          <div
            ref={containerRef}
            style={{
              position: "relative", width: "100%", maxWidth: 420,
              aspectRatio: `${naturalSize.w} / ${naturalSize.h}`,
              margin: "0 auto", touchAction: "none", userSelect: "none",
            }}
            onPointerMove={handlePointerMove}
            onPointerUp={handlePointerUp}
            onPointerLeave={handlePointerUp}
          >
            <img
              src={item.src}
              alt=""
              style={{ width: "100%", height: "100%", display: "block", pointerEvents: "none" }}
              draggable={false}
            />
            <div
              style={{
                position: "absolute",
                left: `${rect.x * 100}%`, top: `${rect.y * 100}%`,
                width: `${rect.w * 100}%`, height: `${rect.h * 100}%`,
                boxShadow: "0 0 0 9999px rgba(0,0,0,0.55)", border: "2px solid #fff", cursor: "move",
              }}
              onPointerDown={(e) => handlePointerDown(e, "move")}
            >
              <div style={handleStyle("tl")} onPointerDown={(e) => handlePointerDown(e, "tl")} />
              <div style={handleStyle("tr")} onPointerDown={(e) => handlePointerDown(e, "tr")} />
              <div style={handleStyle("bl")} onPointerDown={(e) => handlePointerDown(e, "bl")} />
              <div style={handleStyle("br")} onPointerDown={(e) => handlePointerDown(e, "br")} />
            </div>
          </div>
        )}
        <div style={{ display: "flex", gap: 10, marginTop: 18, justifyContent: "flex-end" }}>
          <button type="button" className="cs-item-toolbar-btn" onClick={onCancel}>Cancel</button>
          <button
            type="button"
            className="cs-item-toolbar-btn"
            style={{ background: "#1B2A4A", color: "#fff", borderColor: "#1B2A4A" }}
            onClick={apply}
          >
            Apply Crop
          </button>
        </div>
      </div>
    </div>
  );
}

// The primary artwork editing surface — a flat 2D view of one panel, matching
// the 512x512 reference space used for the 3D texture pixel-for-pixel, so
// nothing needs separate scale bookkeeping between the two views.
function PanelEditor2D({ items, selectedId, onSelect, onUpdateItem, onDeleteItem, onDragStart, face, L, W, H, marginCm, boxStyle, dimUnit, hasValidDims }) {
  const canvasRef = useRef(null);
  const dragRef = useRef(null);
  const guidesRef = useRef([]);
  const activeRotationRef = useRef(null);
  const activeSizeMatchRef = useRef(null);
  const lastTapRef = useRef({ time: 0, x: 0, y: 0, id: null });
  const [outOfBounds, setOutOfBounds] = useState(false);
  const [editingItemId, setEditingItemId] = useState(null);
  const [editDraft, setEditDraft] = useState("");
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const PIXEL_RES = Math.round(512 * dpr);

  function redraw() {
    const canvas = canvasRef.current;
    if (!canvas) return false;
    const ctx = canvas.getContext("2d");
    const colors = boxStyleColors(boxStyle);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); // draw in the same 512-unit logical space at full screen sharpness
    ctx.clearRect(0, 0, 512, 512);
    ctx.fillStyle = colors.boxHex;
    ctx.fillRect(0, 0, 512, 512);
    ctx.strokeStyle = colors.borderHex;
    ctx.lineWidth = 4;
    ctx.strokeRect(2, 2, 508, 508);

    const marginCmVal = Math.max(0, Number(marginCm) || 1);
    const marginX = Math.min(200, (marginCmVal / (panelDims.w || 1)) * 512);
    const marginY = Math.min(200, (marginCmVal / (panelDims.h || 1)) * 512);
    ctx.save();
    ctx.strokeStyle = "#9AA3B8";
    ctx.setLineDash([8, 5]);
    ctx.lineWidth = 1.5;
    ctx.strokeRect(marginX, marginY, 512 - marginX * 2, 512 - marginY * 2);
    ctx.restore();
    const safe = { left: marginX, top: marginY, right: 512 - marginX, bottom: 512 - marginY };

    if (face === "top" || face === "bottom") {
      ctx.save();
      ctx.strokeStyle = "#8a93ac";
      ctx.setLineDash([9, 6]);
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, 256);
      ctx.lineTo(512, 256);
      ctx.stroke();
      ctx.restore();
    }

    let anyOut = false;

    (items || []).forEach((cfg) => {
      const px = (cfg.posX ?? 0.5) * 512;
      const py = (cfg.posY ?? 0.5) * 512;
      const rotationRad = ((Number(cfg.rotation) || 0) * Math.PI) / 180;

      if (cfg.type === "image") {
        const { drawable, ready } = resolveImageDrawable(cfg, () => requestAnimationFrame(redraw));
        const { blockWidth, blockHeight } = getItemBlockSize(ctx, cfg, 512);
        if (ready) {
          ctx.save();
          ctx.translate(px, py);
          ctx.rotate(rotationRad);
          ctx.scale(cfg.flipX ? -1 : 1, cfg.flipY ? -1 : 1);
          ctx.drawImage(drawable, -blockWidth / 2, -blockHeight / 2, blockWidth, blockHeight);
          ctx.restore();
        }
        const isOut =
          px - blockWidth / 2 < safe.left || px + blockWidth / 2 > safe.right ||
          py - blockHeight / 2 < safe.top || py + blockHeight / 2 > safe.bottom;
        if (isOut) anyOut = true;
        if (cfg.id === selectedId) {
          drawSelectionChrome(ctx, px, py, rotationRad, blockWidth, blockHeight, isOut, 0, true, !!cfg.locked);
        }
        return;
      }

      if (cfg.id === editingItemId) return; // live overlay is showing instead

      const text = (cfg.text || "").trim();
      if (!text) return;
      const style = cfg.style === "italic" ? "italic" : "normal";
      const weight = cfg.style === "bold" ? "700" : "400";
      ctx.font = `${style} ${weight} ${Number(cfg.size) || 48}px ${cfg.font || "Arial, sans-serif"}`;
      const { lines, lineHeight, maxWidth, blockWidth, blockHeight } = measureWrappedText(ctx, cfg, 512);
      const align = cfg.align || "center";
      const offsetX = textAlignOffsetX(align, maxWidth, blockWidth);

      ctx.save();
      ctx.translate(px, py);
      ctx.rotate(rotationRad);
      ctx.scale(cfg.flipX ? -1 : 1, cfg.flipY ? -1 : 1);
      ctx.fillStyle = cfg.color || "#1B2A4A";
      ctx.textBaseline = "middle";
      ctx.textAlign = align === "left" ? "left" : align === "right" ? "right" : "center";
      const lineX = align === "left" ? -maxWidth / 2 : align === "right" ? maxWidth / 2 : 0;
      const totalHeight = lines.length * lineHeight;
      lines.forEach((line, i) => {
        const y = -totalHeight / 2 + lineHeight / 2 + i * lineHeight;
        ctx.fillText(line, lineX, y, maxWidth);
      });
      ctx.restore();

      const { cx: effCx, cy: effCy } = effectiveItemCenter(cfg, px, py, rotationRad, blockWidth, maxWidth);
      const isOut =
        effCx - blockWidth / 2 < safe.left || effCx + blockWidth / 2 > safe.right ||
        effCy - blockHeight / 2 < safe.top || effCy + blockHeight / 2 > safe.bottom;
      if (isOut) anyOut = true;

      if (cfg.id === selectedId) {
        drawSelectionChrome(ctx, px, py, rotationRad, blockWidth, blockHeight, isOut, offsetX, false, !!cfg.locked);
      }
    });

    function drawSelectionChrome(ctx, px, py, rotationRad, blockWidth, blockHeight, isOut, localOffsetX, isImage, isLocked) {
      ctx.save();
      ctx.translate(px, py);
      ctx.rotate(rotationRad);
      ctx.translate(localOffsetX || 0, 0);
      ctx.setLineDash([5, 3]);
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = isOut ? "#E24444" : "#1B2A4A";
      ctx.strokeRect(-blockWidth / 2 - 8, -blockHeight / 2 - 8, blockWidth + 16, blockHeight + 16);
      ctx.setLineDash([]);

      if (isLocked) {
        // Lock badge — shown in place of the rotate/resize handles, which are disabled while locked
        const lockY = -blockHeight / 2 - 8;
        ctx.beginPath();
        ctx.arc(-blockWidth / 2 - 8, lockY, 9, 0, Math.PI * 2);
        ctx.fillStyle = "#8A6416";
        ctx.fill();
        ctx.save();
        ctx.translate(-blockWidth / 2 - 8, lockY);
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 1.5;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.strokeRect(-2.8, -0.5, 5.6, 4.5);
        ctx.beginPath();
        ctx.arc(0, -1.5, 2.6, Math.PI, 0, false);
        ctx.stroke();
        ctx.restore();
      }

      if (!isLocked) {
      // Rotate handle: connecting line + badge with a curved rotate-arrow icon
      const rotY = -blockHeight / 2 - 34;
      ctx.beginPath();
      ctx.moveTo(0, -blockHeight / 2 - 8);
      ctx.lineTo(0, rotY);
      ctx.strokeStyle = "#1B2A4A";
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(0, rotY, 9, 0, Math.PI * 2);
      ctx.fillStyle = "#1B2A4A";
      ctx.fill();
      ctx.save();
      ctx.translate(0, rotY);
      ctx.strokeStyle = "#fff";
      ctx.lineWidth = 1.6;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.arc(0, 0, 4.5, -Math.PI * 0.15, Math.PI * 1.3);
      ctx.stroke();
      const headAngle = Math.PI * 1.3;
      const hx = 4.5 * Math.cos(headAngle), hy = 4.5 * Math.sin(headAngle);
      ctx.beginPath();
      ctx.moveTo(hx, hy);
      ctx.lineTo(hx - 2.2, hy - 1.4);
      ctx.moveTo(hx, hy);
      ctx.lineTo(hx - 0.6, hy + 2.3);
      ctx.stroke();
      ctx.restore();

      // Resize handle
      ctx.fillStyle = "#1B2A4A";
      ctx.fillRect(blockWidth / 2 + 8 - 6, blockHeight / 2 + 8 - 6, 12, 12);
      }

      // Delete button — small × badge at the top-right corner
      const delX = blockWidth / 2 + 8, delY = -blockHeight / 2 - 8;
      ctx.beginPath();
      ctx.arc(delX, delY, 9, 0, Math.PI * 2);
      ctx.fillStyle = "#E24444";
      ctx.fill();
      ctx.strokeStyle = "#fff";
      ctx.lineWidth = 1.8;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(delX - 3.2, delY - 3.2);
      ctx.lineTo(delX + 3.2, delY + 3.2);
      ctx.moveTo(delX + 3.2, delY - 3.2);
      ctx.lineTo(delX - 3.2, delY + 3.2);
      ctx.stroke();

      if (isImage) {
        // Width handle — middle of right edge, ↔ icon
        const wx = blockWidth / 2 + 8, wy = 0;
        ctx.beginPath();
        ctx.arc(wx, wy, 8, 0, Math.PI * 2);
        ctx.fillStyle = "#1B2A4A";
        ctx.fill();
        ctx.save();
        ctx.translate(wx, wy);
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 1.5;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(-4, 0); ctx.lineTo(4, 0);
        ctx.moveTo(-4, 0); ctx.lineTo(-1.5, -2.2);
        ctx.moveTo(-4, 0); ctx.lineTo(-1.5, 2.2);
        ctx.moveTo(4, 0); ctx.lineTo(1.5, -2.2);
        ctx.moveTo(4, 0); ctx.lineTo(1.5, 2.2);
        ctx.stroke();
        ctx.restore();

        // Height handle — middle of bottom edge, ↕ icon
        const hx = 0, hy = blockHeight / 2 + 8;
        ctx.beginPath();
        ctx.arc(hx, hy, 8, 0, Math.PI * 2);
        ctx.fillStyle = "#1B2A4A";
        ctx.fill();
        ctx.save();
        ctx.translate(hx, hy);
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 1.5;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(0, -4); ctx.lineTo(0, 4);
        ctx.moveTo(0, -4); ctx.lineTo(-2.2, -1.5);
        ctx.moveTo(0, -4); ctx.lineTo(2.2, -1.5);
        ctx.moveTo(0, 4); ctx.lineTo(-2.2, 1.5);
        ctx.moveTo(0, 4); ctx.lineTo(2.2, 1.5);
        ctx.stroke();
        ctx.restore();
      }

      ctx.restore();
    }

    (guidesRef.current || []).forEach((g) => {
      ctx.save();
      ctx.strokeStyle = "#FF3B9A";
      ctx.lineWidth = 2;
      if (g.type === "spacing") {
        // Horizontal gap indicator: short line with small end-ticks
        ctx.setLineDash([]);
        ctx.beginPath();
        ctx.moveTo(g.x1, g.y);
        ctx.lineTo(g.x2, g.y);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(g.x1, g.y - 5); ctx.lineTo(g.x1, g.y + 5);
        ctx.moveTo(g.x2, g.y - 5); ctx.lineTo(g.x2, g.y + 5);
        ctx.stroke();
      } else if (g.type === "spacing-v") {
        ctx.setLineDash([]);
        ctx.beginPath();
        ctx.moveTo(g.x, g.y1);
        ctx.lineTo(g.x, g.y2);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(g.x - 5, g.y1); ctx.lineTo(g.x + 5, g.y1);
        ctx.moveTo(g.x - 5, g.y2); ctx.lineTo(g.x + 5, g.y2);
        ctx.stroke();
      } else {
        ctx.setLineDash([7, 5]);
        ctx.beginPath();
        if (g.axis === "x") {
          ctx.moveTo(g.pos, 0);
          ctx.lineTo(g.pos, 512);
        } else {
          ctx.moveTo(0, g.pos);
          ctx.lineTo(512, g.pos);
        }
        ctx.stroke();
      }
      ctx.restore();
    });

    if (activeRotationRef.current) {
      const rot = activeRotationRef.current;
      const rotItem = (items || []).find((it) => it.id === rot.itemId);
      if (rotItem) {
        const rpx = (rotItem.posX ?? 0.5) * 512;
        const rpy = (rotItem.posY ?? 0.5) * 512;
        if (rot.snapped) {
          ctx.save();
          ctx.strokeStyle = "#FF3B9A";
          ctx.lineWidth = 2;
          ctx.setLineDash([7, 5]);
          ctx.beginPath();
          if (rot.deg === 0 || rot.deg === 180) {
            ctx.moveTo(0, rpy);
            ctx.lineTo(512, rpy);
          } else {
            ctx.moveTo(rpx, 0);
            ctx.lineTo(rpx, 512);
          }
          ctx.stroke();
          ctx.restore();
        }
        const { blockHeight } = getItemBlockSize(ctx, rotItem, 512);
        const labelY = rpy - blockHeight / 2 - 50;
        ctx.save();
        ctx.font = "600 12px Arial, sans-serif";
        const label = `${rot.deg}°`;
        const labelW = ctx.measureText(label).width + 12;
        ctx.fillStyle = rot.snapped ? "#FF3B9A" : "#1B2A4A";
        ctx.beginPath();
        ctx.roundRect ? ctx.roundRect(rpx - labelW / 2, labelY - 10, labelW, 20, 5) : ctx.rect(rpx - labelW / 2, labelY - 10, labelW, 20);
        ctx.fill();
        ctx.fillStyle = "#fff";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(label, rpx, labelY);
        ctx.restore();
      }
    }

    if (activeSizeMatchRef.current) {
      const sm = activeSizeMatchRef.current;
      const smItem = (items || []).find((it) => it.id === sm.itemId);
      if (smItem) {
        const spx = (smItem.posX ?? 0.5) * 512;
        const spy = (smItem.posY ?? 0.5) * 512;
        const { blockWidth: smW, blockHeight: smH } = getItemBlockSize(ctx, smItem, 512);
        const labelY = spy - smH / 2 - 50;
        ctx.save();
        ctx.font = "600 12px Arial, sans-serif";
        const label = "✓ Size matched";
        const labelW = ctx.measureText(label).width + 14;
        ctx.fillStyle = "#1FA97A";
        ctx.beginPath();
        ctx.roundRect ? ctx.roundRect(spx - labelW / 2, labelY - 10, labelW, 20, 5) : ctx.rect(spx - labelW / 2, labelY - 10, labelW, 20);
        ctx.fill();
        ctx.fillStyle = "#fff";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(label, spx, labelY);
        ctx.restore();
      }
    }

    return anyOut;
  }

  useEffect(() => {
    setOutOfBounds(!!redraw());
  }, [items, selectedId, face, L, W, H, marginCm, boxStyle, editingItemId]);

  function getCanvasPos(e) {
    const canvas = canvasRef.current;
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: (clientX - rect.left) * (512 / rect.width), y: (clientY - rect.top) * (512 / rect.height) };
  }

  function findTextItemAt(pos, ctx) {
    for (let i = (items || []).length - 1; i >= 0; i--) {
      const cfg = items[i];
      if (cfg.type === "image") continue;
      if (!cfg.text || !cfg.text.trim()) continue;
      const { blockWidth, blockHeight, maxWidth } = getItemBlockSize(ctx, cfg, 512);
      const rawCx = (cfg.posX ?? 0.5) * 512, rawCy = (cfg.posY ?? 0.5) * 512;
      const rotationRad = ((Number(cfg.rotation) || 0) * Math.PI) / 180;
      const { cx, cy } = effectiveItemCenter(cfg, rawCx, rawCy, rotationRad, blockWidth, maxWidth);
      if (pointInRotatedRect(pos.x, pos.y, cx, cy, blockWidth / 2 + 10, blockHeight / 2 + 10, rotationRad)) {
        return cfg;
      }
    }
    return null;
  }

  function startEditingText(item) {
    if (onDragStart) onDragStart();
    onSelect(item.id);
    setEditingItemId(item.id);
    setEditDraft(item.text || "");
  }

  function commitTextEdit() {
    if (editingItemId) onUpdateItem(editingItemId, "text", editDraft);
    setEditingItemId(null);
  }

  function cancelTextEdit() {
    setEditingItemId(null);
  }

  function handlePointerDown(e) {
    const pos = getCanvasPos(e);
    const canvas = canvasRef.current;
    const ctx = canvas.getContext("2d");

    if (e.pointerType === "touch") {
      const now = Date.now();
      const last = lastTapRef.current;
      const isDoubleTap = now - last.time < 350 && Math.hypot(pos.x - last.x, pos.y - last.y) < 20;
      lastTapRef.current = { time: now, x: pos.x, y: pos.y };
      if (isDoubleTap) {
        const hit = findTextItemAt(pos, ctx);
        if (hit) {
          startEditingText(hit);
          return;
        }
      }
    }

    if (selectedId) {
      const sel = (items || []).find((it) => it.id === selectedId);
      if (sel) {
        const rawCx = (sel.posX ?? 0.5) * 512, rawCy = (sel.posY ?? 0.5) * 512;
        const rotationRad = ((Number(sel.rotation) || 0) * Math.PI) / 180;
        const { blockWidth, blockHeight, maxWidth } = getItemBlockSize(ctx, sel, 512);
        const { cx, cy } = effectiveItemCenter(sel, rawCx, rawCy, rotationRad, blockWidth, maxWidth);
        const cos = Math.cos(rotationRad), sin = Math.sin(rotationRad);

        const delLocal = { x: blockWidth / 2 + 8, y: -blockHeight / 2 - 8 };
        const delAbs = { x: cx + delLocal.x * cos - delLocal.y * sin, y: cy + delLocal.x * sin + delLocal.y * cos };
        if (Math.hypot(pos.x - delAbs.x, pos.y - delAbs.y) <= 13) {
          if (onDeleteItem) onDeleteItem(sel.id);
          return;
        }

        const rotLocal = { x: 0, y: -blockHeight / 2 - 34 };
        const rotAbs = { x: cx + rotLocal.x * cos - rotLocal.y * sin, y: cy + rotLocal.x * sin + rotLocal.y * cos };
        if (!sel.locked && Math.hypot(pos.x - rotAbs.x, pos.y - rotAbs.y) <= 15) {
          if (onDragStart) onDragStart();
          dragRef.current = { mode: "rotate", itemId: sel.id, cx, cy };
          return;
        }

        const rsLocal = { x: blockWidth / 2 + 8, y: blockHeight / 2 + 8 };
        const rsAbs = { x: cx + rsLocal.x * cos - rsLocal.y * sin, y: cy + rsLocal.x * sin + rsLocal.y * cos };
        if (!sel.locked && Math.hypot(pos.x - rsAbs.x, pos.y - rsAbs.y) <= 15) {
          if (onDragStart) onDragStart();
          const startDist = Math.hypot(rsAbs.x - cx, rsAbs.y - cy);
          dragRef.current = {
            mode: "resize", itemId: sel.id, cx, cy, startDist,
            startSize: Number(sel.size) || 48,
            startWidthFrac: Number(sel.widthFrac) || 0.4,
            startHeightFrac: sel.heightFrac != null ? Number(sel.heightFrac) : blockHeight / 512,
          };
          return;
        }

        if (!sel.locked && sel.type === "image") {
          const widthLocal = { x: blockWidth / 2 + 8, y: 0 };
          const widthAbs = { x: cx + widthLocal.x * cos - widthLocal.y * sin, y: cy + widthLocal.x * sin + widthLocal.y * cos };
          if (Math.hypot(pos.x - widthAbs.x, pos.y - widthAbs.y) <= 13) {
            if (onDragStart) onDragStart();
            dragRef.current = {
              mode: "resize-width", itemId: sel.id, cx, cy, rotationRad,
              startWidthFrac: Number(sel.widthFrac) || 0.4,
              startDist: Math.hypot(widthAbs.x - cx, widthAbs.y - cy),
            };
            return;
          }

          const heightLocal = { x: 0, y: blockHeight / 2 + 8 };
          const heightAbs = { x: cx + heightLocal.x * cos - heightLocal.y * sin, y: cy + heightLocal.x * sin + heightLocal.y * cos };
          if (Math.hypot(pos.x - heightAbs.x, pos.y - heightAbs.y) <= 13) {
            if (onDragStart) onDragStart();
            dragRef.current = {
              mode: "resize-height", itemId: sel.id, cx, cy, rotationRad,
              startHeightFrac: sel.heightFrac != null ? Number(sel.heightFrac) : blockHeight / 512,
              startDist: Math.hypot(heightAbs.x - cx, heightAbs.y - cy),
            };
            return;
          }
        }
      }
    }

    for (let i = (items || []).length - 1; i >= 0; i--) {
      const cfg = items[i];
      if (cfg.type !== "image" && (!cfg.text || !cfg.text.trim())) continue;
      const { blockWidth, blockHeight, maxWidth } = getItemBlockSize(ctx, cfg, 512);
      const rawCx = (cfg.posX ?? 0.5) * 512, rawCy = (cfg.posY ?? 0.5) * 512;
      const rotationRad = ((Number(cfg.rotation) || 0) * Math.PI) / 180;
      const { cx, cy } = effectiveItemCenter(cfg, rawCx, rawCy, rotationRad, blockWidth, maxWidth);
      if (pointInRotatedRect(pos.x, pos.y, cx, cy, blockWidth / 2 + 10, blockHeight / 2 + 10, rotationRad)) {
        onSelect(cfg.id);
        if (!cfg.locked) {
          if (onDragStart) onDragStart();
          dragRef.current = { mode: "move", itemId: cfg.id, offsetX: pos.x - rawCx, offsetY: pos.y - rawCy };
        }
        return;
      }
    }
    onSelect(null);
  }

  function handlePointerMove(e) {
    if (!dragRef.current) return;
    const pos = getCanvasPos(e);
    const d = dragRef.current;

    if (d.mode === "move") {
      let cx = Math.max(0.02, Math.min(0.98, (pos.x - d.offsetX) / 512)) * 512;
      let cy = Math.max(0.02, Math.min(0.98, (pos.y - d.offsetY) / 512)) * 512;

      const canvas = canvasRef.current;
      const ctx = canvas.getContext("2d");
      const dragged = (items || []).find((it) => it.id === d.itemId);
      let guides = [];

      if (dragged) {
        const { blockWidth, blockHeight } = getItemBlockSize(ctx, dragged, 512);
        const halfW = blockWidth / 2, halfH = blockHeight / 2;

        const otherRects = [];
        (items || []).forEach((it) => {
          if (it.id === d.itemId) return;
          if (it.type !== "image" && (!it.text || !it.text.trim())) return;
          const m = getItemBlockSize(ctx, it, 512);
          const ocx = (it.posX ?? 0.5) * 512, ocy = (it.posY ?? 0.5) * 512;
          const rect = {
            left: ocx - m.blockWidth / 2, right: ocx + m.blockWidth / 2, centerX: ocx,
            top: ocy - m.blockHeight / 2, bottom: ocy + m.blockHeight / 2, centerY: ocy,
          };
          otherRects.push(rect);
        });
        const targets = [{ left: 0, right: 512, top: 0, bottom: 512, centerX: 256, centerY: 256 }, ...otherRects];

        const snap = computeSmartGuideSnap(cx, cy, halfW, halfH, targets);
        cx = snap.x;
        cy = snap.y;
        guides = snap.guides;

        const spacing = computeEqualSpacingSnap(cx - halfW, cx + halfW, cy - halfH, cy + halfH, otherRects);
        cx += spacing.dx;
        cy += spacing.dy;
        guides = [...guides, ...spacing.spacingGuides];
      }

      guidesRef.current = guides;
      redraw();

      const nx = Math.max(0.02, Math.min(0.98, cx / 512));
      const ny = Math.max(0.02, Math.min(0.98, cy / 512));
      onUpdateItem(d.itemId, "posX", nx);
      onUpdateItem(d.itemId, "posY", ny);
    } else if (d.mode === "rotate") {
      const angle = Math.atan2(pos.x - d.cx, -(pos.y - d.cy));
      let deg = Math.round((angle * 180) / Math.PI);
      const normalized = ((deg % 360) + 360) % 360;
      const SNAP_THRESHOLD = 4;
      let snapped = false;
      for (const sp of [0, 90, 180, 270, 360]) {
        if (Math.abs(normalized - sp) <= SNAP_THRESHOLD) {
          deg = sp === 360 ? 0 : sp;
          snapped = true;
          break;
        }
      }
      activeRotationRef.current = { itemId: d.itemId, deg, snapped };
      onUpdateItem(d.itemId, "rotation", deg);
      redraw();
    } else if (d.mode === "resize-width") {
      const dx = pos.x - d.cx, dy = pos.y - d.cy;
      const cos = Math.cos(d.rotationRad), sin = Math.sin(d.rotationRad);
      const localX = dx * cos + dy * sin;
      const newHalfWidth = Math.max(18, localX - 8);
      const newWidthFrac = Math.max(0.05, Math.min(0.95, (newHalfWidth * 2) / 512));
      onUpdateItem(d.itemId, "widthFrac", newWidthFrac);
      redraw();
    } else if (d.mode === "resize-height") {
      const dx = pos.x - d.cx, dy = pos.y - d.cy;
      const cos = Math.cos(d.rotationRad), sin = Math.sin(d.rotationRad);
      const localY = -dx * sin + dy * cos;
      const newHalfHeight = Math.max(18, localY - 8);
      const newHeightFrac = Math.max(0.05, Math.min(0.95, (newHalfHeight * 2) / 512));
      onUpdateItem(d.itemId, "heightFrac", newHeightFrac);
      redraw();
    } else if (d.mode === "resize") {
      const dist = Math.hypot(pos.x - d.cx, pos.y - d.cy);
      const scale = dist / (d.startDist || 1);
      const dragged = (items || []).find((it) => it.id === d.itemId);
      const canvas = canvasRef.current;
      const ctx = canvas.getContext("2d");

      let newFrac, newHeightFrac, newSize;
      if (dragged && dragged.type === "image") {
        newFrac = Math.max(0.05, Math.min(0.95, d.startWidthFrac * scale));
        newHeightFrac = Math.max(0.05, Math.min(0.95, d.startHeightFrac * scale));
      } else {
        newSize = Math.max(12, Math.min(160, Math.round(d.startSize * scale)));
      }

      const previewItem = dragged.type === "image" ? { ...dragged, widthFrac: newFrac, heightFrac: newHeightFrac } : { ...dragged, size: String(newSize) };
      const { blockWidth, blockHeight } = getItemBlockSize(ctx, previewItem, 512);

      let sizeMatch = null;
      const SIZE_SNAP_PX = 10;
      (items || []).forEach((it) => {
        if (it.id === d.itemId) return;
        if (it.type !== "image" && (!it.text || !it.text.trim())) return;
        const m = getItemBlockSize(ctx, it, 512);
        if (!sizeMatch && Math.abs(blockWidth - m.blockWidth) <= SIZE_SNAP_PX) {
          sizeMatch = { axis: "w", target: m.blockWidth, current: blockWidth };
        }
        if (!sizeMatch && Math.abs(blockHeight - m.blockHeight) <= SIZE_SNAP_PX) {
          sizeMatch = { axis: "h", target: m.blockHeight, current: blockHeight };
        }
      });

      if (sizeMatch) {
        const ratio = sizeMatch.target / (sizeMatch.current || 1);
        if (dragged.type === "image") {
          newFrac = Math.max(0.05, Math.min(0.95, newFrac * ratio));
          newHeightFrac = Math.max(0.05, Math.min(0.95, newHeightFrac * ratio));
        } else newSize = Math.max(12, Math.min(160, Math.round(newSize * ratio)));
        activeSizeMatchRef.current = { itemId: d.itemId };
      } else {
        activeSizeMatchRef.current = null;
      }

      if (dragged && dragged.type === "image") {
        onUpdateItem(d.itemId, "widthFrac", newFrac);
        onUpdateItem(d.itemId, "heightFrac", newHeightFrac);
      } else {
        onUpdateItem(d.itemId, "size", String(newSize));
      }
      redraw();
    }
  }

  function handlePointerUp() {
    dragRef.current = null;
    const hadRotation = !!activeRotationRef.current;
    const hadSizeMatch = !!activeSizeMatchRef.current;
    activeRotationRef.current = null;
    activeSizeMatchRef.current = null;
    if (guidesRef.current.length || hadRotation || hadSizeMatch) {
      guidesRef.current = [];
      redraw();
    }
  }

  const panelDims = (() => {
    if (face === "front" || face === "back") return { w: L || 1, h: H || 1 };
    if (face === "left" || face === "right") return { w: W || 1, h: H || 1 };
    return { w: L || 1, h: W || 1 }; // top/bottom
  })();
  const MAX_DIM = 420;
  const aspect = panelDims.w / panelDims.h;
  let dispW = MAX_DIM, dispH = MAX_DIM / aspect;
  if (dispH > MAX_DIM) { dispH = MAX_DIM; dispW = MAX_DIM * aspect; }

  const unitFactor = UNIT_TO_CM[dimUnit] ?? 1;
  const unitLabel = UNIT_LABELS[dimUnit] || "cm";
  const fmtDim = (v) => {
    const r = Math.round((v / unitFactor) * 100) / 100;
    return r;
  };
  const showDims = !!hasValidDims;
  const DIM_GUTTER = showDims ? 46 : 0;
  const DIM_BOTTOM = showDims ? 34 : 0;

  return (
    <div>
      <div style={{ position: "relative", width: "100%", maxWidth: dispW + DIM_GUTTER, margin: "0 auto", paddingRight: DIM_GUTTER, paddingBottom: DIM_BOTTOM }}>
      <div style={{ position: "relative", width: "100%", maxWidth: dispW, margin: "0 auto" }}>
        <canvas
          ref={canvasRef}
          width={PIXEL_RES}
          height={PIXEL_RES}
          style={{
            width: "100%", maxWidth: dispW, aspectRatio: `${panelDims.w} / ${panelDims.h}`, borderRadius: 14,
            cursor: "pointer", display: "block", margin: "0 auto", touchAction: "none",
          }}
          onPointerDown={handlePointerDown}
          onPointerMove={handlePointerMove}
          onPointerUp={handlePointerUp}
          onPointerLeave={handlePointerUp}
          onDoubleClick={(e) => {
            const pos = getCanvasPos(e);
            const ctx = canvasRef.current.getContext("2d");
            const hit = findTextItemAt(pos, ctx);
            if (hit) startEditingText(hit);
          }}
        />
        {editingItemId && (() => {
          const item = (items || []).find((it) => it.id === editingItemId);
          const canvas = canvasRef.current;
          if (!item || !canvas) return null;
          const cw = canvas.clientWidth, ch = canvas.clientHeight;
          const scale = cw / 512;
          const ctx = canvas.getContext("2d");
          const { blockWidth, blockHeight, maxWidth } = getItemBlockSize(ctx, item, 512);
          const rotationRad = ((Number(item.rotation) || 0) * Math.PI) / 180;
          const { cx: effCx, cy: effCy } = effectiveItemCenter(
            item, (item.posX ?? 0.5) * 512, (item.posY ?? 0.5) * 512, rotationRad, blockWidth, maxWidth
          );
          const cx = effCx * scale, cy = effCy * scale;
          const w = blockWidth * scale, h = blockHeight * scale;
          return (
            <textarea
              autoFocus
              value={editDraft}
              onChange={(e) => setEditDraft(e.target.value)}
              onFocus={(e) => e.target.select()}
              onBlur={commitTextEdit}
              onKeyDown={(e) => {
                if (e.key === "Escape") { e.preventDefault(); cancelTextEdit(); }
              }}
              style={{
                position: "absolute",
                left: cx - w / 2 - 8, top: cy - h / 2 - 8,
                width: w + 16, height: h + 16,
                fontSize: (Number(item.size) || 48) * scale,
                fontFamily: item.font || "Arial, sans-serif",
                fontWeight: item.style === "bold" ? "700" : "400",
                fontStyle: item.style === "italic" ? "italic" : "normal",
                color: item.color || "#1B2A4A",
                textAlign: item.align || "center",
                border: "2px dashed #1B2A4A",
                borderRadius: 6,
                background: "rgba(255,255,255,0.96)",
                resize: "none",
                outline: "none",
                padding: 4,
                lineHeight: 1.2,
                zIndex: 20,
                overflow: "hidden",
              }}
            />
          );
        })()}
      </div>

      {showDims && (
        <>
          <div style={{ position: "absolute", top: 0, right: 0, width: DIM_GUTTER, height: `calc(100% - ${DIM_BOTTOM}px)`, display: "flex", alignItems: "center", justifyContent: "center", pointerEvents: "none" }}>
            <div style={{ position: "absolute", left: 14, top: 5, bottom: 5, width: 0, borderLeft: "1px solid #9AA3B8" }} />
            <div style={{ position: "absolute", left: 8, top: 5, width: 12, height: 0, borderTop: "1px solid #9AA3B8" }} />
            <div style={{ position: "absolute", left: 8, bottom: 5, width: 12, height: 0, borderTop: "1px solid #9AA3B8" }} />
            <div style={{
              writingMode: "vertical-rl", fontSize: 11, fontWeight: 700, color: "#556077",
              background: "#fff", padding: "3px 4px", borderRadius: 4, position: "relative", zIndex: 1,
            }}>
              {fmtDim(panelDims.h)} {unitLabel}
            </div>
          </div>

          <div style={{ position: "absolute", left: 0, bottom: 0, width: `calc(100% - ${DIM_GUTTER}px)`, height: DIM_BOTTOM, display: "flex", alignItems: "center", justifyContent: "center", pointerEvents: "none" }}>
            <div style={{ position: "absolute", left: 5, right: 5, top: 14, height: 0, borderTop: "1px solid #9AA3B8" }} />
            <div style={{ position: "absolute", left: 5, top: 8, width: 0, height: 12, borderLeft: "1px solid #9AA3B8" }} />
            <div style={{ position: "absolute", right: 5, top: 8, width: 0, height: 12, borderLeft: "1px solid #9AA3B8" }} />
            <div style={{
              fontSize: 11, fontWeight: 700, color: "#556077",
              background: "#fff", padding: "3px 4px", borderRadius: 4, position: "relative", zIndex: 1,
            }}>
              {fmtDim(panelDims.w)} {unitLabel}
            </div>
          </div>
        </>
      )}
      </div>
      {outOfBounds && (
        <div className="cs-print-warning">⚠️ Artwork exceeds printable area.</div>
      )}
    </div>
  );
}

// Pure live-preview 3D box — drag to rotate, scroll to zoom, and it auto-orients
// to whichever face is selected. All artwork editing happens in the 2D panel
// editor above; this view only ever reflects that data, it's never edited directly.
// A small, lightweight 3D box (Outline style) that turns each selected side
// white live, as the customer checks/unchecks it in the printing-sides list.
function MiniBoxPreview({ L, W, H, highlightFaces }) {
  const mountRef = useRef(null);
  const facesRef = useRef({});

  useEffect(() => {
    const mount = mountRef.current;
    if (!mount || typeof THREE === "undefined") return;

    const height = 200;
    const width = mount.clientWidth || 200;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1b2a4a);

    const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(width, height);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.domElement.style.display = "block";
    renderer.domElement.style.width = "100%";
    renderer.domElement.style.cursor = "grab";
    renderer.domElement.style.touchAction = "none";
    mount.appendChild(renderer.domElement);

    const maxDim = Math.max(L, W, H, 1);
    const sizeScale = 3 / maxDim;
    const bw = L * sizeScale, bh = H * sizeScale, bd = W * sizeScale;
    const geometry = new THREE.BoxGeometry(bw, bh, bd);

    const TEX_RES = 256;
    facesRef.current = {};
    const materials = BOX_FACE_ORDER.map((key) => {
      const canvas = document.createElement("canvas");
      canvas.width = TEX_RES;
      canvas.height = TEX_RES;
      const isHighlighted = (highlightFaces || []).includes(key);
      drawFaceCanvas(canvas, null, key, null, null, "white", isHighlighted ? "#c49a6c" : null);
      const texture = new THREE.CanvasTexture(canvas);
      texture.needsUpdate = true;
      const mat = new THREE.MeshStandardMaterial({ map: texture, metalness: 0.04, roughness: 0.9 });
      facesRef.current[key] = { canvas, texture };
      return mat;
    });
    const mesh = new THREE.Mesh(geometry, materials);
    scene.add(mesh);

    const edgesGeo = new THREE.EdgesGeometry(geometry);
    const edges = new THREE.LineSegments(edgesGeo, new THREE.LineBasicMaterial({ color: 0x1b2a4a }));
    mesh.add(edges);

    const creaseGeoms = [];
    function buildFaceCreases(y) {
      const eps = Math.max(bh * 0.01, 0.01);
      const faceY = y > 0 ? y / 2 + eps : y / 2 - eps;
      const halfL = bw / 2;
      const positions = [-halfL, faceY, 0, halfL, faceY, 0];
      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
      creaseGeoms.push(geo);
      const lineMat = new THREE.LineDashedMaterial({ color: 0x8a93ac, dashSize: 0.04, gapSize: 0.03 });
      const lines = new THREE.LineSegments(geo, lineMat);
      lines.computeLineDistances();
      return lines;
    }
    mesh.add(buildFaceCreases(bh));
    mesh.add(buildFaceCreases(-bh));

    scene.add(new THREE.AmbientLight(0xffffff, 0.8));
    const keyLight = new THREE.DirectionalLight(0xffffff, 0.5);
    keyLight.position.set(4, 5, 6);
    scene.add(keyLight);

    let theta = Math.PI / 4, phi = Math.PI / 3;
    const radius = Math.max(5, maxDim * sizeScale * 1.8);
    function updateCamera() {
      camera.position.set(
        radius * Math.sin(phi) * Math.sin(theta),
        radius * Math.cos(phi),
        radius * Math.sin(phi) * Math.cos(theta)
      );
      camera.lookAt(0, 0, 0);
    }
    updateCamera();

    let dragging = false, lastX = 0, lastY = 0;
    function pointerPos(e) {
      if (e.touches && e.touches[0]) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
      return { x: e.clientX, y: e.clientY };
    }
    function onDown(e) {
      dragging = true;
      const p = pointerPos(e);
      lastX = p.x; lastY = p.y;
      renderer.domElement.style.cursor = "grabbing";
    }
    function onMove(e) {
      if (!dragging) return;
      const p = pointerPos(e);
      theta -= (p.x - lastX) * 0.01;
      phi = Math.max(0.2, Math.min(Math.PI - 0.2, phi - (p.y - lastY) * 0.01));
      lastX = p.x; lastY = p.y;
      updateCamera();
    }
    function onUp() {
      dragging = false;
      renderer.domElement.style.cursor = "grab";
    }
    renderer.domElement.addEventListener("pointerdown", onDown);
    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", onUp);

    let rafId;
    function animate() {
      rafId = requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();

    function handleResize() {
      const w = mount.clientWidth || 200;
      camera.aspect = w / height;
      camera.updateProjectionMatrix();
      renderer.setSize(w, height);
    }
    window.addEventListener("resize", handleResize);

    return () => {
      cancelAnimationFrame(rafId);
      window.removeEventListener("pointermove", onMove);
      window.removeEventListener("pointerup", onUp);
      window.removeEventListener("resize", handleResize);
      renderer.domElement.removeEventListener("pointerdown", onDown);
      geometry.dispose();
      materials.forEach((m) => { m.map && m.map.dispose(); m.dispose(); });
      edgesGeo.dispose();
      creaseGeoms.forEach((g) => g.dispose());
      renderer.dispose();
      if (mount.contains(renderer.domElement)) mount.removeChild(renderer.domElement);
      facesRef.current = {};
    };
  }, [L, W, H]);

  // Redraw only the affected faces when the selection changes
  useEffect(() => {
    BOX_FACE_ORDER.forEach((key) => {
      const f = facesRef.current[key];
      if (!f) return;
      const isHighlighted = (highlightFaces || []).includes(key);
      drawFaceCanvas(f.canvas, null, key, null, null, "white", isHighlighted ? "#c49a6c" : null);
      f.texture.needsUpdate = true;
    });
  }, [highlightFaces]);

  return <div ref={mountRef} style={{ width: "100%", maxWidth: 280, margin: "0 auto", height: 200, borderRadius: 14, overflow: "hidden" }} />;
}

function BoxViewer3D({ L, W, H, faceTexts, selectedFace, boxStyle }) {
  const mountRef = useRef(null);
  const facesRef = useRef({});
  const faceTextsRef = useRef(faceTexts);
  faceTextsRef.current = faceTexts;
  const boxStyleRef = useRef(boxStyle);
  boxStyleRef.current = boxStyle;
  const sceneRef = useRef(null);
  const camApiRef = useRef(null);

  useEffect(() => {
    const mount = mountRef.current;
    if (!mount || typeof THREE === "undefined") return;

    const height = 340;
    const width = mount.clientWidth || 400;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(boxStyleColors(boxStyleRef.current).sceneBg);
    sceneRef.current = scene;

    const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(width, height);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.domElement.style.display = "block";
    renderer.domElement.style.width = "100%";
    renderer.domElement.style.cursor = "grab";
    renderer.domElement.style.touchAction = "none";
    mount.appendChild(renderer.domElement);

    const maxDim = Math.max(L, W, H, 1);
    const sizeScale = 4 / maxDim;
    const bw = L * sizeScale, bh = H * sizeScale, bd = W * sizeScale;

    const geometry = new THREE.BoxGeometry(bw, bh, bd);

    facesRef.current = {};
    const TEX_RES = 1024; // higher-res texture — sharper text/images, especially when zoomed in
    const maxAniso = renderer.capabilities.getMaxAnisotropy();
    const materials = BOX_FACE_ORDER.map((key) => {
      const canvas = document.createElement("canvas");
      canvas.width = TEX_RES;
      canvas.height = TEX_RES;
      drawFaceCanvas(canvas, (faceTextsRef.current || {})[key], key, null, () => {
        drawFaceCanvas(canvas, (faceTextsRef.current || {})[key], key, null, null, boxStyleRef.current);
        texture.needsUpdate = true;
      }, boxStyleRef.current);
      const texture = new THREE.CanvasTexture(canvas);
      texture.needsUpdate = true;
      texture.anisotropy = maxAniso;
      const mat = new THREE.MeshStandardMaterial({ map: texture, metalness: 0.04, roughness: 0.9 });
      facesRef.current[key] = { canvas, texture };
      return mat;
    });

    const mesh = new THREE.Mesh(geometry, materials);
    scene.add(mesh);

    const edgesGeo = new THREE.EdgesGeometry(geometry);
    const edges = new THREE.LineSegments(edgesGeo, new THREE.LineBasicMaterial({ color: 0x1b2a4a }));
    mesh.add(edges);

    const creaseGeoms = [];
    function buildFaceCreases(y) {
      const eps = Math.max(bh * 0.01, 0.01);
      const faceY = y > 0 ? y / 2 + eps : y / 2 - eps;
      const halfL = bw / 2;
      const positions = [-halfL, faceY, 0, halfL, faceY, 0];
      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
      creaseGeoms.push(geo);
      const lineMat = new THREE.LineDashedMaterial({ color: 0x8a93ac, dashSize: 0.05, gapSize: 0.04 });
      const lines = new THREE.LineSegments(geo, lineMat);
      lines.computeLineDistances();
      return lines;
    }
    mesh.add(buildFaceCreases(bh));
    mesh.add(buildFaceCreases(-bh));

    scene.add(new THREE.AmbientLight(0xffffff, 0.75));
    const keyLight = new THREE.DirectionalLight(0xffffff, 0.55);
    keyLight.position.set(4, 5, 6);
    scene.add(keyLight);
    const fill = new THREE.DirectionalLight(0xffffff, 0.3);
    fill.position.set(-4, -2, -5);
    scene.add(fill);

    const fovVRad = (45 * Math.PI) / 180;
    const boxHalfDiag = Math.sqrt(bw * bw + bh * bh + bd * bd) / 2;
    function fitRadius(aspect) {
      const fovHRad = 2 * Math.atan(Math.tan(fovVRad / 2) * aspect);
      const distV = boxHalfDiag / Math.sin(fovVRad / 2);
      const distH = boxHalfDiag / Math.sin(fovHRad / 2);
      return Math.max(6, Math.max(distV, distH) * 1.15);
    }
    const camState = { theta: Math.PI / 4, phi: Math.PI / 3, radius: fitRadius(width / height) };
    let animTarget = null;

    function updateCamera() {
      camera.position.set(
        camState.radius * Math.sin(camState.phi) * Math.sin(camState.theta),
        camState.radius * Math.cos(camState.phi),
        camState.radius * Math.sin(camState.phi) * Math.cos(camState.theta)
      );
      camera.lookAt(0, 0, 0);
    }
    updateCamera();

    camApiRef.current = {
      goToFace(face) {
        const target = FACE_VIEW_ANGLES[face];
        if (!target) return;
        let dTheta = target.theta - camState.theta;
        while (dTheta > Math.PI) dTheta -= Math.PI * 2;
        while (dTheta < -Math.PI) dTheta += Math.PI * 2;
        animTarget = { theta: camState.theta + dTheta, phi: target.phi };
      },
    };

    let dragging = false;
    let lastX = 0, lastY = 0;

    function pointerPos(e) {
      if (e.touches && e.touches[0]) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
      return { x: e.clientX, y: e.clientY };
    }
    function onDown(e) {
      dragging = true;
      const p = pointerPos(e);
      lastX = p.x; lastY = p.y;
      renderer.domElement.style.cursor = "grabbing";
      animTarget = null;
    }
    function onMove(e) {
      if (!dragging) return;
      const p = pointerPos(e);
      const dx = p.x - lastX, dy = p.y - lastY;
      camState.theta -= dx * 0.008;
      camState.phi = Math.max(0.2, Math.min(Math.PI - 0.2, camState.phi - dy * 0.008));
      lastX = p.x; lastY = p.y;
      updateCamera();
    }
    function onUp() {
      dragging = false;
      renderer.domElement.style.cursor = "grab";
    }
    function onWheel(e) {
      e.preventDefault();
      camState.radius = Math.max(3, Math.min(20, camState.radius + e.deltaY * 0.025));
      updateCamera();
    }

    renderer.domElement.addEventListener("pointerdown", onDown);
    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", onUp);
    window.addEventListener("pointercancel", onUp);
    renderer.domElement.addEventListener("wheel", onWheel, { passive: false });

    let rafId;
    function animate() {
      rafId = requestAnimationFrame(animate);
      if (animTarget) {
        camState.theta += (animTarget.theta - camState.theta) * 0.12;
        camState.phi += (animTarget.phi - camState.phi) * 0.12;
        updateCamera();
        if (Math.abs(animTarget.theta - camState.theta) < 0.002 && Math.abs(animTarget.phi - camState.phi) < 0.002) {
          camState.theta = animTarget.theta;
          camState.phi = animTarget.phi;
          updateCamera();
          animTarget = null;
        }
      }
      renderer.render(scene, camera);
    }
    animate();

    function handleResize() {
      const w = mount.clientWidth || 400;
      camera.aspect = w / height;
      camera.updateProjectionMatrix();
      renderer.setSize(w, height);
      camState.radius = fitRadius(w / height);
      updateCamera();
    }
    window.addEventListener("resize", handleResize);

    if (selectedFace && FACE_VIEW_ANGLES[selectedFace]) {
      const t = FACE_VIEW_ANGLES[selectedFace];
      camState.theta = t.theta;
      camState.phi = t.phi;
      updateCamera();
    }

    return () => {
      cancelAnimationFrame(rafId);
      window.removeEventListener("pointermove", onMove);
      window.removeEventListener("pointerup", onUp);
      window.removeEventListener("pointercancel", onUp);
      window.removeEventListener("resize", handleResize);
      renderer.domElement.removeEventListener("pointerdown", onDown);
      renderer.domElement.removeEventListener("wheel", onWheel);
      geometry.dispose();
      materials.forEach((m) => { m.map && m.map.dispose(); m.dispose(); });
      edgesGeo.dispose();
      creaseGeoms.forEach((g) => g.dispose());
      renderer.dispose();
      if (mount.contains(renderer.domElement)) mount.removeChild(renderer.domElement);
      facesRef.current = {};
      camApiRef.current = null;
    };
  }, [L, W, H]);

  // Redraw just the affected face's canvas when its text settings change,
  // and live-update the box color / background when boxStyle changes —
  // without rebuilding the whole scene (which would reset rotation/zoom)
  useEffect(() => {
    if (sceneRef.current) {
      sceneRef.current.background = new THREE.Color(boxStyleColors(boxStyle).sceneBg);
    }
    BOX_FACE_ORDER.forEach((key) => {
      const f = facesRef.current[key];
      if (!f) return;
      drawFaceCanvas(f.canvas, (faceTexts || {})[key], key, null, () => {
        drawFaceCanvas(f.canvas, (faceTexts || {})[key], key, null, null, boxStyle);
        f.texture.needsUpdate = true;
      }, boxStyle);
      f.texture.needsUpdate = true;
    });
  }, [faceTexts, boxStyle]);

  // Smoothly rotate the camera to face whichever face is selected
  useEffect(() => {
    if (camApiRef.current) camApiRef.current.goToFace(selectedFace);
  }, [selectedFace]);

  return <div ref={mountRef} style={{ width: "100%", height: 340, borderRadius: 16, overflow: "hidden" }} />;
}

function RSCDiagram({ L, W, H }) {
  const maxDim = 100;
  const scale = maxDim / Math.max(L, W, H, 1);
  const w = Math.max(W * scale, 30);
  const h = Math.max(H * scale, 30);
  const dOffset = Math.max(Math.min(L * scale * 0.55, 50), 18); // depth (L) shown as isometric offset
  const ox = 70, oy = 55;

  const frontTL = [ox, oy], frontTR = [ox + w, oy], frontBL = [ox, oy + h], frontBR = [ox + w, oy + h];
  const backTL = [ox - dOffset, oy - dOffset * 0.55], backTR = [ox + w - dOffset, oy - dOffset * 0.55];
  const backBR = [ox + w - dOffset, oy + h - dOffset * 0.55];

  const topFace = [frontTL, frontTR, backTR, backTL].map((p) => p.join(",")).join(" ");
  const sideFace = [frontTR, frontBR, backBR, backTR].map((p) => p.join(",")).join(" ");

  return (
    <svg viewBox="0 0 240 230" width="100%" height="190" fontFamily="'IBM Plex Mono', monospace">
      <polygon points={topFace} fill="#EEF1F6" stroke="#2B4C7E" strokeWidth="1.2" />
      <polygon points={sideFace} fill="#E4E9F1" stroke="#2B4C7E" strokeWidth="1.2" />
      <rect x={ox} y={oy} width={w} height={h} fill="#FAFBFC" stroke="#2B4C7E" strokeWidth="1.4" />
      {/* top flap crease lines meeting at center, indicating RSC flaps */}
      <line x1={frontTL[0]} y1={frontTL[1]} x2={(frontTL[0] + backTR[0]) / 2} y2={(frontTL[1] + backTR[1]) / 2} stroke="#2B4C7E" strokeWidth="0.6" strokeDasharray="2,2" />
      <line x1={frontTR[0]} y1={frontTR[1]} x2={(frontTL[0] + backTR[0]) / 2} y2={(frontTL[1] + backTR[1]) / 2} stroke="#2B4C7E" strokeWidth="0.6" strokeDasharray="2,2" />
      <line x1={backTL[0]} y1={backTL[1]} x2={(frontTL[0] + backTR[0]) / 2} y2={(frontTL[1] + backTR[1]) / 2} stroke="#2B4C7E" strokeWidth="0.6" strokeDasharray="2,2" />
      <line x1={backTR[0]} y1={backTR[1]} x2={(frontTL[0] + backTR[0]) / 2} y2={(frontTL[1] + backTR[1]) / 2} stroke="#2B4C7E" strokeWidth="0.6" strokeDasharray="2,2" />

      {/* W label - front bottom edge */}
      <text x={ox + w / 2} y={oy + h + 20} textAnchor="middle" fontSize="10" fill="#1B2A4A" fontWeight="600">W {fmt(W)}</text>
      {/* H label - front left edge */}
      <text x={ox - 14} y={oy + h / 2} textAnchor="middle" fontSize="10" fill="#1B2A4A" fontWeight="600" transform={`rotate(-90 ${ox - 14} ${oy + h / 2})`}>H {fmt(H)}</text>
      {/* L label - top depth edge */}
      <text x={ox + w - dOffset / 2 + 4} y={oy - dOffset * 0.55 - 8} textAnchor="middle" fontSize="10" fill="#1B2A4A" fontWeight="600">L {fmt(L)}</text>
    </svg>
  );
}

// Simple stacked cross-section showing the ply construction
function PlyDiagram({ layerTypes, layerGsms, layerBFs }) {
  const bandH = 26, bandW = 90, ox = 50, oy = 20;
  return (
    <svg viewBox="0 0 260 200" width="100%" height="170" fontFamily="'IBM Plex Mono', monospace">
      <defs>
        <pattern id="fluteWave" patternUnits="userSpaceOnUse" width="12" height="10">
          <path d="M0,8 Q3,2 6,8 T12,8" stroke="#8A5A2B" strokeWidth="1.2" fill="none" />
        </pattern>
      </defs>
      {layerTypes.map((type, i) => (
        <g key={i}>
          <rect
            x={ox} y={oy + i * bandH} width={bandW} height={bandH - 3}
            fill={type === "flute" ? "#F3E7D6" : "#E4E9F1"}
            stroke="#2B4C7E" strokeWidth="1"
          />
          {type === "flute" && (
            <rect x={ox} y={oy + i * bandH} width={bandW} height={bandH - 3} fill="url(#fluteWave)" />
          )}
          <text x={ox + bandW + 8} y={oy + i * bandH + (bandH - 3) / 2 - 2} fontSize="9" fill="#1B2A4A" fontWeight="600">
            {type === "flute" ? "Flute" : "Liner"}
          </text>
          <text x={ox + bandW + 8} y={oy + i * bandH + (bandH - 3) / 2 + 10} fontSize="8" fill="#8A5A2B">
            {layerGsms[i] ?? "—"} GSM · {layerBFs[i] ?? "—"}BF
          </text>
        </g>
      ))}
    </svg>
  );
}
